name: CI

# Full automated regression net: type-check, build, unit (Vitest), and the
# @vscode/test-electron integration suite — including the unit↔electron engine
# parity gate. See docs/E2E_TESTING.md. No GUI clicks, no screenshots.
on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Cache the VS Code build that @vscode/test-electron downloads (~250 MB).
      - name: Cache VS Code test instance
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}

      - name: Type-check
        run: npm run typecheck

      - name: Build (esbuild + vite)
        run: npm run build

      - name: Unit tests (Vitest) + engine-parity baseline
        run: npm test

      # Electron integration needs a display; Linux uses xvfb, Windows runs direct.
      - name: Integration tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration
