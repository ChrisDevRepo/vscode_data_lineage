    sql: |-
      BEGIN SELECT 1 AS a INTO dbo.T END
      IF 1=1 SELECT 1 AS a INTO dbo.U ELSE SELECT 2 AS a INTO dbo.V
      SELECT 1 AS a INTO dbo.W
      SELECT 1
      SELECT 1 AS a INTO dbo.X ON fg1
      SELECT 1
