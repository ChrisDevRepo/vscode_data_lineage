    sql: INSERT TOP (10) PERCENT INTO dbo.T SELECT * FROM dbo.S; INSERT TOP (5) INTO dbo.U WITH (TABLOCK) (a) SELECT a FROM dbo.S; INSERT TOP (5) INTO dbo.V EXEC dbo.uspGet
