    description: An unterminated nested expression cannot supply an unresolved outer UPDATE alias
    sql: UPDATE absent SET Value=(SELECT 1 FROM dbo.FirstTable t
    sources: [dbo.FirstTable]
  - id: update-boundary-nested-join-alias
