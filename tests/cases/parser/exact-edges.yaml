    sql: UPDATE Target SET col = 1 FROM dbo.Target INNER JOIN dbo.Other ON Other.id = Target.id
    sources: [dbo.Target, dbo.Other]
    targets: [dbo.Target]
  - id: update-boundary-unaliased-left-join
    description: An unaliased UPDATE table remains resolvable before left-join
    sql: UPDATE Target SET col = 1 FROM dbo.Target LEFT OUTER JOIN dbo.Other o ON o.id = Target.id
    sources: [dbo.Target, dbo.Other]
    targets: [dbo.Target]
