  - id: update-boundary-two-writes-without-metadata
    description: Separate un-delimited UPDATE statements retain both physical writes without catalog dependencies
    sql: |-
      UPDATE t SET Value=1 FROM dbo.FirstTable t
      UPDATE t SET Value=2 FROM dbo.SecondTable t
    sources: [dbo.FirstTable, dbo.SecondTable]
    targets: [dbo.FirstTable, dbo.SecondTable]
    graph:
      tables: [dbo.FirstTable, dbo.SecondTable]
      metadata: []
      edges:
        - source: '[dbo].[FirstTable]'
          target: '[gen].[Subject]'
          type: body
        - source: '[gen].[Subject]'
          target: '[dbo].[FirstTable]'
          type: body
        - source: '[dbo].[SecondTable]'
          target: '[gen].[Subject]'
          type: body
        - source: '[gen].[Subject]'
          target: '[dbo].[SecondTable]'
          type: body
  - id: update-boundary-nested-and-inert-keywords
    description: Nested SELECT and quoted/commented UPDATE keywords do not break separate UPDATE statements
    case_modes: [ci, cs]
    sql: >-
      UPDATE t SET Value=1 FROM dbo.FirstTable t WHERE t.Value=(SELECT MAX(Value) FROM dbo.Source) AND t.Value <> 'UPDATE x FROM dbo.False
      x' /* UPDATE z FROM dbo.False z */

      UPDATE t SET Value=2 FROM dbo.SecondTable t
    sources: [dbo.FirstTable, dbo.Source, dbo.SecondTable]
    targets: [dbo.FirstTable, dbo.SecondTable]
  - id: update-boundary-following-select-alias
