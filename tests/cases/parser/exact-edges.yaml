  - id: update-top-n-through-a-joining-cte-writes-no-single-table
    description: UPDATE TOP (n) through a joining CTE writes no single table
    sql: WITH c AS (SELECT * FROM dbo.A a JOIN dbo.B b ON a.id=b.id) UPDATE TOP (5) c SET x=1
