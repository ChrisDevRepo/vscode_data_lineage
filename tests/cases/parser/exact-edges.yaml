        - source: '[dbo].[Target]'
          target: '[gen].[Subject]'
          type: body
        - source: '[dbo].[Other]'
          target: '[gen].[Subject]'
          type: body
        - source: '[gen].[Subject]'
          target: '[dbo].[Target]'
          type: body
