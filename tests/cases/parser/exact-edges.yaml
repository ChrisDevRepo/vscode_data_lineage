  - id: fixture-ansi-old-01-comma-join
    description: 'Targeted fixture: ansi_old_01_comma_join.sql'
    sql: |-
      -- ANSI Old Pattern 01: Pre-SQL-92 comma-separated FROM clause (no JOIN keyword)

      -- Typical SQL Server 6.5 / 7.0 era stored procedure style
      -- Written in 1998-style T-SQL, no JOIN keyword, all WHERE-clause predicates

      CREATE PROCEDURE dbo.spBuildSalesSummary
      AS
      BEGIN
          INSERT INTO [dbo].[SalesSummary] (CustomerID, CustomerName, TotalOrders, TotalAmount, TopProduct)
          SELECT
              c.CustomerID,
              c.CompanyName,
              COUNT(DISTINCT o.OrderID),
              SUM(ol.UnitPrice * ol.Quantity),
              p.ProductName
          FROM
              dbo.Customer    c,
              dbo.[Order]     o,
              dbo.OrderLine   ol,
              dbo.Product     p
          WHERE
              c.CustomerID  = o.CustomerID
          AND o.OrderID     = ol.OrderID
          AND ol.ProductID  = p.ProductID
          AND o.OrderDate  >= '1998-01-01'
          AND o.Status      = 'CLOSED'
          AND c.Active      = 1
          GROUP BY
              c.CustomerID, c.CompanyName, p.ProductName
      END
      GO
    sources:
      - dbo.Customer
      - dbo.Order
      - dbo.OrderLine
      - dbo.Product
    targets:
      - dbo.SalesSummary
  - id: fixture-ansi-old-02-outer-join-star
    description: 'Targeted fixture: ansi_old_02_outer_join_star.sql'
    sql: |-
      -- ANSI Old Pattern 02: Old T-SQL *= and =* outer join operators (SQL Server 6.x/7.x era)
      -- NOTE: *= (left outer join) and =* (right outer join) were deprecated in SQL Server 2005,
      --       removed at compatibility level 90+. Both tables appear in the comma-FROM list.
      --       extract_sources_ansi misses [dbo].[Department],[dbo].[Project],[dbo].[Assignment]
      --       (only [dbo].[Employee] after FROM keyword is caught). Gap signal for RL.

      -- SQL Server 7.0 era style — outer joins via WHERE clause operators
      CREATE PROCEDURE dbo.spHeadcountReport
          @AsOfDate DATETIME
      AS
      BEGIN
          INSERT INTO [dbo].[HeadcountReport]
              (EmployeeID, LastName, DeptName, ProjectName, AssignedHours, ReportDate)
          SELECT
              e.EmployeeID,
              e.LastName,
              d.DeptName,
              p.ProjectName,
              a.HoursAssigned,
              @AsOfDate
          FROM
              dbo.Employee   e,
              dbo.Department d,
              dbo.Project    p,
              dbo.Assignment a
          WHERE
              e.DeptID    *= d.DeptID          -- left outer: employees with no dept still appear
          AND e.EmployeeID = a.EmployeeID       -- inner: only assigned employees
          AND a.ProjectID *= p.ProjectID        -- left outer: assignments without project still appear
          AND e.TermDate  IS NULL
          AND e.HireDate  <= @AsOfDate
      END
      GO
    sources:
      - dbo.Employee
      - dbo.Department
      - dbo.Project
      - dbo.Assignment
    targets:
      - dbo.HeadcountReport
  - id: fixture-ansi-old-03-no-schema-prefix
    description: 'Targeted fixture: ansi_old_03_no_schema_prefix.sql'
    sql: |-
      -- ANSI Old Pattern 03: SQL Server 2000 era — unqualified names (no schema prefix)
      -- NOTE: All references here are UNQUALIFIED (no schema.table dot notation).
      --       normalizeCaptured() rejects unqualified names (no dot → filtered out).
      --       This is BY DESIGN — we cannot resolve "Orders" without knowing the schema.
      --       EXPECT is intentionally EMPTY to verify zero false positives from old unqualified code.
      --       absent:[dbo].[Orders],[dbo].[Customers],[dbo].[Products]

      -- SQL Server 2000 / Northwind-era style (no schema prefix, uses dbo implicitly)
      -- This is a STABILITY test: parser must not crash, must not produce false captures
      CREATE PROCEDURE spGetOrdersByCustomer
          @CustomerID int
      AS
      BEGIN
          INSERT INTO SalesSummaryTemp
              (CustomerID, OrderCount, TotalAmount)
          SELECT
              CustomerID,
              COUNT(*),
              SUM(UnitPrice * Quantity)
          FROM Customers c, Orders o, OrderDetails od
          WHERE c.CustomerID = o.CustomerID
            AND o.OrderID    = od.OrderID
            AND c.CustomerID = @CustomerID

          SELECT * FROM SalesSummaryTemp
          DROP TABLE SalesSummaryTemp
      END
      GO
  - id: fixture-ansi-old-04-mixed-modern-old
    description: 'Targeted fixture: ansi_old_04_mixed_modern_old.sql'
    sql: |-
      -- ANSI Old Pattern 04: Mixed old-style comma joins AND modern ANSI JOINs in same SP
      -- NOTE: Modern JOINs are fully captured. Old-style comma tables after first in FROM are missed.
      --       [dbo].[Header] (after FROM) and [dbo].[Customer] (after JOIN) should be found.
      --       [dbo].[Line] and [dbo].[Lookup] (comma-separated after [dbo].[Header]) are likely missed.
      --       Partial pass expected — a realistic mixed codebase scenario.

      -- Codebase migrated partially to SQL-92 syntax but older sections remain untouched
      CREATE PROCEDURE [dbo].[spArchiveOldTransactions]
          @CutoffDate DATETIME
      AS
      BEGIN
          -- Old-style section: written in SQL Server 2000 era, never refactored
          INSERT INTO [dbo].[Archive] (
              HeaderID, LineID, LookupCode, CustomerName, Amount, ArchivedOn
          )
          SELECT
              h.HeaderID,
              l.LineID,
              lk.Code,
              c.CustomerName,
              l.Amount,
              GETDATE()
          FROM
              [dbo].[Header]  h,    -- first table: captured by FROM rule
              [dbo].[Line]    l,    -- missed by current parser
              [dbo].[Lookup]  lk    -- missed by current parser
          JOIN [dbo].[Customer] c   -- modern JOIN: captured
              ON c.CustomerID = h.CustomerID
          WHERE
              h.HeaderID  = l.HeaderID
          AND l.LookupID  = lk.LookupID
          AND h.TxDate    < @CutoffDate
          AND h.Processed = 1;

          EXEC [dbo].[usp_PostProcess] @CutoffDate = @CutoffDate;
      END
      GO
    sources:
      - dbo.Header
      - dbo.Line
      - dbo.Lookup
      - dbo.Customer
    targets:
      - dbo.Archive
    exec:
      - dbo.usp_PostProcess
  - id: fixture-apply-01-cross-apply-tvf
    description: 'Targeted fixture: apply_01_cross_apply_tvf.sql'
    sql: |-
      -- CROSS/OUTER APPLY Pattern 01: CROSS APPLY with schema-qualified TVF

      INSERT INTO [dbo].[OrderLineSummary] (
          [OrderID],
          [ProductID],
          [ProductName],
          [Quantity],
          [UnitPrice],
          [LineTotal],
          [Margin],
          [SummarizedAt]
      )
      SELECT
          o.[OrderID],
          ol.[ProductID],
          ol.[ProductName],
          ol.[Quantity],
          ol.[UnitPrice],
          ol.[Quantity] * ol.[UnitPrice] AS LineTotal,
          (ol.[UnitPrice] - ol.[StandardCost]) * ol.[Quantity] AS Margin,
          GETUTCDATE()
      FROM [dbo].[Order] AS o
      CROSS APPLY [dbo].[udf_GetOrderLines](o.[OrderID], o.[CurrencyCode]) AS ol
      WHERE o.[Status] = N'COMPLETE'
        AND o.[OrderDate] >= DATEADD(DAY,-7,GETDATE());
