    sql: SELECT * FROM tempdb.dbo.#t JOIN [db].[dbo].[#u] ON 1=1; SELECT a INTO tempdb.dbo.##g FROM dbo.S; SELECT * FROM [db].[#v]; INSERT INTO [dbo].[#w] SELECT * FROM dbo.S; UPDATE tempdb.dbo.#t SET a=1; UPDATE x SET a=1 FROM [dbo].[#t] x
