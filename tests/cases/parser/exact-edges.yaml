  - id: fixture-bidirectional-01-read-write-same
    description: 'Targeted fixture: bidirectional_01_read_write_same.sql'
    sql: |-
      -- BIDIRECTIONAL Pattern 01: SP reads AND writes same table — both edges expected
      -- Account appears in BOTH sources and targets — bidirectional ⇄ edge in lineage graph

      -- Read current balance from Account, then update it after recording the transaction
      DECLARE @AccountID  INT = 42;
      DECLARE @Amount     DECIMAL(18,2) = 500.00;
      DECLARE @Balance    DECIMAL(18,2);
      DECLARE @NewBalance DECIMAL(18,2);

      -- READ: check current balance
      SELECT @Balance = [Balance]
      FROM   [dbo].[Account]
      WHERE  [AccountID] = @AccountID;

      -- READ: get pending transactions to apply
      INSERT INTO [dbo].[AuditLog] ([AccountID],[ActionType],[OldBalance],[ActionDate])
      SELECT @AccountID, N'PRE_APPLY', @Balance, GETUTCDATE()
      WHERE  EXISTS (
          SELECT 1 FROM [dbo].[Transaction]
          WHERE  [AccountID] = @AccountID AND [Status] = N'PENDING'
      );

      -- WRITE: apply transactions to Account
      UPDATE [dbo].[Account]
      SET
          [Balance]      = [Balance] + t.[NetAmount],
          [LastActivity] = GETUTCDATE()
      FROM [dbo].[Account] AS a
      JOIN (
          SELECT [AccountID], SUM([Amount]) AS NetAmount
          FROM   [dbo].[Transaction]
          WHERE  [AccountID] = @AccountID AND [Status] = N'PENDING'
          GROUP  BY [AccountID]
      ) AS t ON t.[AccountID] = a.[AccountID];
    sources:
      - dbo.Account
      - dbo.Transaction
    targets:
      - dbo.Account
      - dbo.AuditLog
  - id: fixture-comments-01-massive-block
    description: 'Targeted fixture: comments_01_massive_block.sql'
    sql: |-
      -- COMMENTS Pattern 01: Massive block comments containing SQL-like content — must NOT be extracted

      /*
      =============================================================================
      PROCEDURE: usp_RefreshCustomerOrderSummary
      AUTHOR:    Data Engineering Team
      DATE:      2019-03-14
      VERSION:   4.2.1

      HISTORY:
        v1.0 (2019-03-14): Initial version
          - SELECT * FROM dbo.OldCustomer WHERE Active = 1
          - INSERT INTO dbo.DeprecatedSummary SELECT * FROM dbo.LegacyOrder

        v2.0 (2020-07-22): Redesigned from scratch
          - Removed: INSERT INTO [dbo].[LegacyOrder] SELECT * FROM [dbo].[OldCustomer]
          - Added proper schema qualification
          - Added error handling

        v3.0 (2021-11-05): Performance optimization
          Old query (removed):
            SELECT c.CustomerID, o.OrderDate, SUM(o.Amount) AS Total
            FROM dbo.DeprecatedSummary s
            JOIN dbo.LegacyOrder o ON o.CustomerID = s.CustomerID
            WHERE s.IsActive = 1
            GROUP BY c.CustomerID, o.OrderDate

        v4.0 (2022-08-19): Added partitioning support
        v4.2.1 (2023-01-30): Hotfix for NULL handling

      DESCRIPTION:
        Refreshes the customer order summary table from the current Customer and Order tables.
        NOTE: Do NOT use dbo.OldCustomer or dbo.LegacyOrder — those are deprecated.

      USAGE:
        EXEC [dbo].[usp_RefreshCustomerOrderSummary]
          @FullRefresh = 0,  -- 0=incremental, 1=full truncate+reload
          @Cutoff      = '2023-01-01'

      RETURNS: Nothing (side-effects only)

      DEPENDENCIES (legacy, no longer used):
        -- FROM [dbo].[OldCustomer] c
        -- JOIN [dbo].[LegacyOrder] o ON o.CustomerID = c.CustomerID
        -- INSERT INTO [dbo].[DeprecatedSummary]

      =============================================================================
      */

      DECLARE @Cutoff    DATE = DATEADD(MONTH, -12, GETDATE());
      DECLARE @FullRefresh BIT = 0;

      -- Old approach (commented out in v2.0):
      -- INSERT INTO [dbo].[DeprecatedSummary]
      -- SELECT c.CustomerID, SUM(o.Total)
      -- FROM [dbo].[OldCustomer] c
      -- JOIN [dbo].[LegacyOrder] o ON o.CustomerID = c.CustomerID
      -- GROUP BY c.CustomerID;

      INSERT INTO [dbo].[CustomerOrderSummary] (
          [CustomerID],
          [FirstOrderDate],
          [LastOrderDate],
          [TotalOrders],
          [TotalAmount],
          [AvgOrderValue],
          [RefreshedAt]
      )
      SELECT
          c.[CustomerID],
          MIN(o.[OrderDate])   AS [FirstOrderDate],
          MAX(o.[OrderDate])   AS [LastOrderDate],
          COUNT(o.[OrderID])   AS [TotalOrders],
          SUM(o.[TotalAmount]) AS [TotalAmount],
          AVG(o.[TotalAmount]) AS [AvgOrderValue],
          GETUTCDATE()         AS [RefreshedAt]
      FROM      [dbo].[Customer] AS c
      LEFT JOIN [dbo].[Order]    AS o ON o.[CustomerID] = c.[CustomerID]
                                      AND o.[OrderDate] >= @Cutoff
      GROUP BY c.[CustomerID];
    sources:
      - dbo.Customer
      - dbo.Order
    targets:
      - dbo.CustomerOrderSummary
    absent:
      - dbo.OldCustomer
      - dbo.LegacyOrder
      - dbo.DeprecatedSummary
  - id: fixture-comments-02-nested-blocks
    description: 'Targeted fixture: comments_02_nested_blocks.sql'
    sql: |-
      -- COMMENTS Pattern 02: Deeply nested block comments — must NOT be extracted

      /*
        Outer comment start
        /* inner comment level 1
           SELECT * FROM [dbo].[OldPayroll]
           /* inner comment level 2
              INSERT INTO [hr].[LegacyEmployee] ...
              FROM [dbo].[OldPayroll] WHERE Active = 1
           */  -- end level 2
           More text: UPDATE [dbo].[OldPayroll] SET x = 1
        */ -- end level 1
        Still in outer comment: EXEC [dbo].[DeprecatedProc]
      */

      DECLARE @PayPeriodStart DATE = DATEADD(MONTH, DATEDIFF(MONTH,0,GETDATE()), 0);
      DECLARE @PayPeriodEnd   DATE = EOMONTH(GETDATE());
      DECLARE @RunID          INT;

      -- Insert payroll run header
      INSERT INTO [hr].[PayrollRun] ([PeriodStart],[PeriodEnd],[Status],[CreatedAt])
      VALUES (@PayPeriodStart, @PayPeriodEnd, N'PENDING', GETUTCDATE());

      SET @RunID = SCOPE_IDENTITY();

      -- Calculate payroll from live tables
      INSERT INTO [hr].[PayrollRun] ([RunID],[EmployeeID],[DepartmentID],[GradeCode],[GrossPay],[NetPay],[Status])
      SELECT
          @RunID,
          e.[EmployeeID],
          e.[DepartmentID],
          e.[GradeCode],
          jg.[BaseSalary] + ISNULL(e.[Bonus], 0),
          (jg.[BaseSalary] + ISNULL(e.[Bonus], 0)) * (1 - jg.[TaxRate]),
          N'CALCULATED'
      FROM      [dbo].[Employee]   AS e
      JOIN      [hr].[Department]  AS d  ON d.[DepartmentID] = e.[DepartmentID]
      JOIN      [hr].[JobGrade]    AS jg ON jg.[GradeCode]   = e.[GradeCode]
      WHERE e.[IsActive] = 1
        AND d.[IsActive] = 1;

      EXEC [hr].[usp_ValidatePayroll] @RunID = @RunID;
    sources:
      - dbo.Employee
      - hr.Department
      - hr.JobGrade
    targets:
      - hr.PayrollRun
    exec:
      - hr.usp_ValidatePayroll
    absent:
      - dbo.OldPayroll
      - hr.LegacyEmployee
  - id: fixture-comments-03-line-comments-sql
    description: 'Targeted fixture: comments_03_line_comments_sql.sql'
    sql: |-
      -- COMMENTS Pattern 03: Line comments containing SQL with table references — must NOT be extracted

      DECLARE @StartDate DATE = '2023-01-01';
      DECLARE @EndDate   DATE = '2023-12-31';

      -- Old query (v1):
      -- SELECT * FROM [sales].[OldInvoice] WHERE InvoiceDate BETWEEN @StartDate AND @EndDate

      -- Attempted rewrite (abandoned):
      -- INSERT INTO [reporting].[InvoiceReport]
      -- SELECT i.*, c.Name FROM [dbo].[ArchiveCustomer] c JOIN [sales].[OldInvoice] i ON i.CustID = c.CustID

      -- Current implementation:
      INSERT INTO [reporting].[InvoiceReport] (
          [InvoiceID],
          [CustomerID],
          [CustomerName],
          [InvoiceDate],
          [DueDate],
          [Subtotal],
          [TaxAmount],
          [TotalAmount],
          [LineCount],
          [Status]
      )
      SELECT
          i.[InvoiceID],          -- was: [sales].[OldInvoice].[InvoiceID] (renamed)
          i.[CustomerID],
          c.[CustomerName],       -- previously from [dbo].[ArchiveCustomer] — now live
          i.[InvoiceDate],
          i.[DueDate],
          SUM(il.[LineAmount]),   -- replaces: SELECT Amount FROM [sales].[OldInvoice]
          SUM(il.[TaxAmount]),
          SUM(il.[LineAmount]) + SUM(il.[TaxAmount]),
          COUNT(il.[InvoiceLineID]),
          i.[Status]
      FROM      [sales].[Invoice]     AS i
      JOIN      [dbo].[Customer]      AS c  ON c.[CustomerID]  = i.[CustomerID]
      JOIN      [sales].[InvoiceLine] AS il ON il.[InvoiceID]  = i.[InvoiceID]
      WHERE i.[InvoiceDate] BETWEEN @StartDate AND @EndDate
      GROUP BY i.[InvoiceID], i.[CustomerID], c.[CustomerName], i.[InvoiceDate], i.[DueDate], i.[Status];
    sources:
      - sales.Invoice
      - sales.InvoiceLine
      - dbo.Customer
    targets:
      - reporting.InvoiceReport
    absent:
      - sales.OldInvoice
      - dbo.ArchiveCustomer
  - id: fixture-copy-into-01-fabric
    description: 'Targeted fixture: copy_into_01_fabric.sql'
    sql: |-
      -- COPY INTO Pattern 01: Fabric/Synapse COPY INTO bulk load from external storage
      -- COPY INTO loads data from Azure Blob/ADLS into the target table — no SQL source table

      COPY INTO [dbo].[SalesDataRaw] (
          [OrderID],
          [CustomerID],
          [ProductID],
          [OrderDate],
          [Quantity],
          [UnitPrice],
          [LineTotal],
          [CurrencyCode],
          [TerritoryID],
          [SalesPersonID]
      )
      FROM 'https://mystorageaccount.blob.core.windows.net/salesdata/2024/01/*.parquet'
      WITH (
          FILE_TYPE          = 'PARQUET',
          CREDENTIAL         = (IDENTITY = 'Managed Identity'),
          AUTO_CREATE_TABLE  = 'OFF',
          MAX_ERRORS         = 0,
          ERRORFILE_LOCATION = 'https://mystorageaccount.blob.core.windows.net/errors/'
      );
    targets:
      - dbo.SalesDataRaw
  - id: fixture-cte-01-chain
    description: 'Targeted fixture: cte_01_chain.sql'
    sql: |-
      -- CTE Pattern 01: Multi-CTE chain — only base tables captured, CTE names excluded

      WITH OrderBaseCTE AS (
          SELECT
              so.[SalesOrderID],
              so.[OrderDate],
              so.[CustomerID],
              so.[TerritoryID],
              so.[Status],
              so.[ShipDate]
          FROM [dbo].[SalesOrder] AS so
          WHERE so.[OrderDate] >= DATEADD(MONTH,-3,GETDATE())
            AND so.[Status] NOT IN (N'CANCELLED',N'DRAFT')
      ),
      LineSumCTE AS (
          SELECT
              sol.[SalesOrderID],
              SUM(sol.[LineTotal])      AS OrderTotal,
              SUM(sol.[TaxAmount])      AS TaxTotal,
              SUM(sol.[DiscountAmount]) AS DiscountTotal,
              COUNT(1)                  AS LineCount,
              SUM(sol.[Quantity])       AS TotalQty
          FROM [dbo].[SalesOrderLine] AS sol
          JOIN OrderBaseCTE            AS ob ON ob.[SalesOrderID] = sol.[SalesOrderID]
          GROUP BY sol.[SalesOrderID]
      ),
      ProductCTE AS (
          SELECT DISTINCT
              sol.[SalesOrderID],
              p.[ProductCategoryID],
              p.[ProductSubCategoryID]
          FROM [dbo].[SalesOrderLine] AS sol
          JOIN [dbo].[Product]        AS p  ON p.[ProductID] = sol.[ProductID]
          JOIN OrderBaseCTE           AS ob ON ob.[SalesOrderID] = sol.[SalesOrderID]
      ),
      CustomerCTE AS (
          SELECT
              c.[CustomerID],
              c.[AccountNumber],
              c.[TerritoryID]   AS CustomerTerritory,
              t.[Name]          AS TerritoryName
          FROM [dbo].[Customer]   AS c
          JOIN [ref].[Territory]  AS t ON t.[TerritoryID] = c.[TerritoryID]
      ),
      FinalCTE AS (
          SELECT
              ob.[SalesOrderID],
              ob.[OrderDate],
              ob.[CustomerID],
              cc.[AccountNumber],
              cc.[TerritoryName],
              ls.[OrderTotal],
              ls.[TaxTotal],
              ls.[DiscountTotal],
              ls.[LineCount],
              ls.[TotalQty],
              pc.[ProductCategoryID],
              pc.[ProductSubCategoryID]
          FROM  OrderBaseCTE AS ob
          JOIN  LineSumCTE   AS ls ON ls.[SalesOrderID] = ob.[SalesOrderID]
          JOIN  ProductCTE   AS pc ON pc.[SalesOrderID] = ob.[SalesOrderID]
          JOIN  CustomerCTE  AS cc ON cc.[CustomerID]   = ob.[CustomerID]
      )
      INSERT INTO [dbo].[SalesPerformance] (
          [SalesOrderID],[OrderDate],[CustomerID],[AccountNumber],[TerritoryName],
          [OrderTotal],[TaxTotal],[DiscountTotal],[LineCount],[TotalQty],
          [ProductCategoryID],[ProductSubCategoryID],[LoadedAt]
      )
      SELECT *, GETUTCDATE() FROM FinalCTE;
    sources:
      - dbo.SalesOrder
      - dbo.SalesOrderLine
      - dbo.Product
      - dbo.Customer
      - ref.Territory
    targets:
      - dbo.SalesPerformance
    absent:
      - OrderBaseCTE
      - LineSumCTE
      - ProductCTE
      - CustomerCTE
      - FinalCTE
  - id: fixture-cte-02-recursive
    description: 'Targeted fixture: cte_02_recursive.sql'
    sql: |-
      -- CTE Pattern 02: Recursive CTE — base table captured; recursive self-reference does NOT produce false dep
      -- CTE name OrgCTE must NOT appear in sources

      WITH OrgCTE AS (
          -- Anchor member: top-level managers (no manager)
          SELECT
              e.[EmployeeID],
              e.[ManagerID],
              e.[FullName],
              e.[JobTitle],
              e.[DepartmentID],
              0 AS [Level],
              CAST(e.[FullName] AS NVARCHAR(4000)) AS [HierarchyPath]
          FROM [dbo].[Employee] AS e
          WHERE e.[ManagerID] IS NULL

          UNION ALL

          -- Recursive member: employees with a manager already in the CTE
          SELECT
              e.[EmployeeID],
              e.[ManagerID],
              e.[FullName],
              e.[JobTitle],
              e.[DepartmentID],
              cte.[Level] + 1,
              CAST(cte.[HierarchyPath] + N' > ' + e.[FullName] AS NVARCHAR(4000))
          FROM [dbo].[Employee] AS e
          JOIN OrgCTE AS cte ON cte.[EmployeeID] = e.[ManagerID]
      )
      INSERT INTO [dbo].[OrgHierarchy] ([EmployeeID],[ManagerID],[FullName],[JobTitle],[DepartmentID],[Level],[HierarchyPath],[DepartmentName],[RefreshedAt])
      SELECT
          oc.[EmployeeID],
          oc.[ManagerID],
          oc.[FullName],
          oc.[JobTitle],
          oc.[DepartmentID],
          oc.[Level],
          oc.[HierarchyPath],
          d.[DepartmentName],
          GETUTCDATE()
      FROM OrgCTE AS oc
      JOIN [dbo].[Department] AS d ON d.[DepartmentID] = oc.[DepartmentID];
    sources:
      - dbo.Employee
      - dbo.Department
    targets:
      - dbo.OrgHierarchy
  - id: fixture-cte-chained-update
    description: 'Targeted fixture: cte_chained_update.sql'
    sql: |-
      -- CTE CHAIN RESOLUTION: WITH c1 AS (...FROM t1), c2 AS (...FROM c1) UPDATE c2 SET ...
      -- Pass 1.6 now resolves CTE chains: c2's first FROM is c1 (unqualified), which is looked
      -- up in the cteMap. Chain resolution collapses c2 → c1 → [dbo].[SalesOrder].
      -- Paren-balanced body detection finds exact CTE boundaries (no magic-number window).
      --
      -- Previously a by-design limitation; resolved after 10 real-world SPs hit this pattern
      -- (UPDATE alias SET ... FROM cte_chain over chained CTEs).
      --

      WITH BaseOrders AS (
          SELECT
              o.[OrderID],
              o.[CustomerID],
              o.[TotalAmount],
              o.[Status]
          FROM [dbo].[SalesOrder] AS o
          WHERE o.[Status] = N'PENDING'
      ),
      OrdersWithLimit AS (
          SELECT
              b.[OrderID],
              b.[TotalAmount]
          FROM BaseOrders AS b          -- references CTE, not a real table
          WHERE b.[TotalAmount] > 100
      )
      UPDATE OrdersWithLimit            -- alias of alias: resolved through the chain
      SET    [Status] = N'APPROVED'
      WHERE  [TotalAmount] BETWEEN 100 AND 10000;

      -- Expected parser behavior (after chain resolution):
      --   sources: [dbo].[SalesOrder]       (BaseOrders CTE resolved by Pass 1.6 via its FROM)
      --   targets: [dbo].[SalesOrder]       (OrdersWithLimit → BaseOrders → [dbo].[SalesOrder] chain resolved)
    sources:
      - dbo.SalesOrder
    targets:
      - dbo.SalesOrder
  - id: fixture-cursor-01-loop
    description: 'Targeted fixture: cursor_01_loop.sql'
    sql: |-
      -- CURSOR Pattern 01: Anti-pattern cursor loop — all table refs inside cursor body must be captured
      -- Cursor-based row-by-row processing (anti-pattern, but common in legacy code)

      DECLARE @CustomerID  INT;
      DECLARE @CustomerName NVARCHAR(200);
      DECLARE @ReportID    INT;

      DECLARE customer_cursor CURSOR LOCAL FAST_FORWARD FOR
          SELECT [CustomerID], [FullName]
          FROM   [dbo].[Customer]
          WHERE  [IsActive] = 1
          ORDER  BY [CustomerID];

      OPEN customer_cursor;
      FETCH NEXT FROM customer_cursor INTO @CustomerID, @CustomerName;

      WHILE @@FETCH_STATUS = 0
      BEGIN
          -- Create report header per customer
          INSERT INTO [dbo].[CustomerReport] ([CustomerID],[CustomerName],[ReportDate],[Status])
          VALUES (@CustomerID, @CustomerName, GETDATE(), N'GENERATING');
          SET @ReportID = SCOPE_IDENTITY();

          -- Read orders for this customer and add detail lines
          INSERT INTO [dbo].[ReportLine] ([ReportID],[OrderID],[ProductName],[Qty],[Amount])
          SELECT
              @ReportID,
              o.[OrderID],
              p.[Name],
              o.[Quantity],
              o.[TotalAmount]
          FROM [dbo].[Order]   AS o
          JOIN [dbo].[Product] AS p ON p.[ProductID] = o.[ProductID]
          WHERE o.[CustomerID] = @CustomerID
            AND o.[Status]     = N'COMPLETE';

          -- Update status
          UPDATE [dbo].[CustomerReport]
          SET    [Status] = N'COMPLETE'
          WHERE  [ReportID] = @ReportID;

          FETCH NEXT FROM customer_cursor INTO @CustomerID, @CustomerName;
      END;

      CLOSE customer_cursor;
      DEALLOCATE customer_cursor;

      EXEC [dbo].[usp_LogReport] @Status = N'DONE', @CustomerCount = @@ROWCOUNT;
    sources:
      - dbo.Customer
      - dbo.Order
      - dbo.Product
    targets:
      - dbo.CustomerReport
      - dbo.ReportLine
    exec:
      - dbo.usp_LogReport
  - id: fixture-declare-heavy-01
    description: 'Targeted fixture: declare_heavy_01.sql'
    sql: |-
      -- DECLARE HEAVY Pattern 01: Massive DECLARE block before any logic — all table refs still captured

      -- 40+ DECLARE statements — common in legacy ETL SPs
      DECLARE @RunID              BIGINT;
      DECLARE @RunStart           DATETIME2;
      DECLARE @RunEnd             DATETIME2;
      DECLARE @RowsRead           INT = 0;
      DECLARE @RowsWritten        INT = 0;
      DECLARE @RowsSkipped        INT = 0;
      DECLARE @RowsError          INT = 0;
      DECLARE @StartDate          DATE;
      DECLARE @EndDate            DATE;
      DECLARE @ReportPeriod       NVARCHAR(20);
      DECLARE @ReportTitle        NVARCHAR(500);
      DECLARE @ReportSubTitle     NVARCHAR(500);
      DECLARE @MaxRows            INT;
      DECLARE @MinAmount          DECIMAL(18,2);
      DECLARE @MaxAmount          DECIMAL(18,2);
      DECLARE @FilterRegion       NVARCHAR(100);
      DECLARE @FilterStatus       NVARCHAR(50);
      DECLARE @FilterProduct      NVARCHAR(200);
      DECLARE @IsFullRefresh      BIT = 0;
      DECLARE @IsDebugMode        BIT = 0;
      DECLARE @IsSendAlert        BIT = 1;
      DECLARE @AlertThreshold     INT;
      DECLARE @ErrorCode          INT = 0;
      DECLARE @ErrorMessage       NVARCHAR(MAX);
      DECLARE @ErrorSeverity      INT;
      DECLARE @ErrorState         INT;
      DECLARE @RetryCount         INT = 0;
      DECLARE @MaxRetries         INT = 3;
      DECLARE @PageSize           INT = 10000;
      DECLARE @PageNumber         INT = 1;
      DECLARE @TotalPages         INT;
      DECLARE @SQL                NVARCHAR(MAX);
      DECLARE @ParamStr           NVARCHAR(2000);
      DECLARE @ConfigKey          NVARCHAR(100);
      DECLARE @ConfigValue        NVARCHAR(500);
      DECLARE @SchemaName         NVARCHAR(128);
      DECLARE @TableName          NVARCHAR(256);
      DECLARE @ColumnList         NVARCHAR(2000);
      DECLARE @WhereClause        NVARCHAR(2000);
      DECLARE @OrderByClause      NVARCHAR(500);
      DECLARE @TempPath           NVARCHAR(500);
      DECLARE @OutputFormat       NVARCHAR(20);
      DECLARE @Delimiter          NCHAR(1);

      SET @RunStart     = SYSUTCDATETIME();

      -- Read config
      SELECT
          @StartDate       = CAST([Value] AS DATE),
          @MaxRows         = CAST([Value2] AS INT),
          @FilterRegion    = [Value3],
          @AlertThreshold  = CAST([Value4] AS INT)
      FROM [dbo].[Config]
      WHERE [ConfigName] = N'DailyReportSettings';

      -- Main data load
      INSERT INTO [dbo].[DailyReport] (
          [RunID],[ReportDate],[CustomerID],[CustomerName],[Region],
          [OrderCount],[TotalAmount],[ProductCount],[ReportedAt]
      )
      SELECT
          @RunID,
          CAST(GETDATE() AS DATE),
          c.[CustomerID],
          c.[FullName],
          r.[RegionName],
          COUNT(o.[OrderID]),
          SUM(o.[TotalAmount]),
          COUNT(DISTINCT p.[ProductID]),
          GETUTCDATE()
      FROM      [dbo].[Customer] AS c
      JOIN      [ref].[Region]   AS r ON r.[RegionCode] = c.[RegionCode]
      LEFT JOIN [dbo].[Order]    AS o ON o.[CustomerID] = c.[CustomerID]
                                      AND o.[OrderDate] >= @StartDate
      LEFT JOIN [dbo].[Product]  AS p ON p.[ProductID]  = o.[ProductID]
      WHERE r.[RegionName] LIKE @FilterRegion + N'%'
        AND c.[IsActive] = 1
      GROUP BY c.[CustomerID], c.[FullName], r.[RegionName];

      SET @RowsWritten = @@ROWCOUNT;
      SET @RunEnd = SYSUTCDATETIME();

      INSERT INTO [ops].[RunLog] ([RunStart],[RunEnd],[RowsWritten],[ProcName])
      VALUES (@RunStart, @RunEnd, @RowsWritten, N'usp_GenerateDailyReport');

      IF @IsSendAlert = 1 AND @RowsWritten < @AlertThreshold
          EXEC [dbo].[usp_SendAlert] @Message = N'Low row count in DailyReport', @Rows = @RowsWritten;
    sources:
      - dbo.Config
      - dbo.Customer
      - dbo.Order
      - dbo.Product
      - ref.Region
    targets:
      - dbo.DailyReport
      - ops.RunLog
    exec:
      - dbo.usp_SendAlert
  - id: fixture-dmv-style-01-full-create-proc
    description: 'Targeted fixture: dmv_style_01_full_create_proc.sql'
    sql: |-
      -- DMV Style Pattern 01: Full CREATE OR ALTER PROCEDURE body as returned by sys.sql_modules
      -- Tests parser handling the full header (WITH EXECUTE AS, SET options, etc.)

      CREATE OR ALTER PROCEDURE [dbo].[usp_RefreshSalesPersonSummary]
          @TerritoryID  INT          = NULL,
          @RefreshDate  DATE         = NULL,
          @ForceRefresh BIT          = 0
      WITH EXECUTE AS OWNER,
           RECOMPILE
      AS
      BEGIN
          SET NOCOUNT ON;
          SET XACT_ABORT ON;
          SET ANSI_NULLS ON;
          SET QUOTED_IDENTIFIER ON;

          DECLARE @Now     DATETIME2 = SYSUTCDATETIME();
          DECLARE @RowsAffected INT;

          IF @RefreshDate IS NULL
              SET @RefreshDate = CAST(@Now AS DATE);

          -- Refresh summary from view and HR data
          INSERT INTO [dbo].[SalesPersonSummary] (
              [SalesPersonID],
              [FullName],
              [JobTitle],
              [DepartmentName],
              [TerritoryName],
              [YTDSales],
              [YTDBonus],
              [CommissionPct],
              [HireDate],
              [RefreshedAt]
          )
          SELECT
              sp.[BusinessEntityID],
              sp.[FirstName] + N' ' + sp.[LastName],
              e.[JobTitle],
              d.[Name],
              sp.[TerritoryName],
              sp.[SalesYTD],
              sp.[BonusYTD],
              sp.[CommissionPct],
              e.[HireDate],
              @Now
          FROM      [sales].[vSalesPerson]         AS sp
          JOIN      [HumanResources].[Employee]    AS e  ON e.[BusinessEntityID] = sp.[BusinessEntityID]
          JOIN      [HumanResources].[Department]  AS d  ON d.[DepartmentID]     = e.[DepartmentID]
          WHERE (@TerritoryID IS NULL OR sp.[TerritoryID] = @TerritoryID);

          SET @RowsAffected = @@ROWCOUNT;

          EXEC [dbo].[usp_LogRefresh]
              @ProcName    = N'usp_RefreshSalesPersonSummary',
              @RowsAffected = @RowsAffected,
              @RefreshDate  = @RefreshDate;

      END;
    sources:
      - sales.vSalesPerson
      - HumanResources.Employee
      - HumanResources.Department
    targets:
      - dbo.SalesPersonSummary
    exec:
      - dbo.usp_LogRefresh
  - id: fixture-execute-as-01-basic
    description: 'Targeted fixture: execute_as_01_basic.sql'
    sql: |-
      -- EXECUTE AS Pattern 01: EXECUTE AS context declaration in SP header, followed by real EXEC

      -- This simulates a SP body that starts with EXECUTE AS context switch
      -- In a real dacpac, the full CREATE PROC has: WITH EXECUTE AS N'DataOwner'
      -- The body seen by parser might or might not include this header

      EXECUTE AS LOGIN = N'DataOwner';   -- context switch — login name must NOT be captured as exec dep

      -- A procedure parameter value must be a constant or a variable, never a function call.
      DECLARE @Login  sysname        = ORIGINAL_LOGIN();
      DECLARE @ErrMsg NVARCHAR(4000);

      BEGIN TRY
          -- Real table read under elevated context
          INSERT INTO [dbo].[AuditAccess] ([UserRequested],[AccessTime],[DataSetName],[RowCount])
          SELECT
              ORIGINAL_LOGIN(),
              GETUTCDATE(),
              N'SensitiveData',
              COUNT(1)
          FROM [dbo].[SensitiveData]
          WHERE [ClassificationLevel] >= 3;

          EXEC [dbo].[usp_LogAccess]
              @User     = @Login,
              @Resource = N'SensitiveData',
              @Success  = 1;

      END TRY
      BEGIN CATCH
          SET @ErrMsg = ERROR_MESSAGE();

          EXEC [dbo].[usp_LogAccess]
              @User     = @Login,
              @Resource = N'SensitiveData',
              @Success  = 0,
              @Error    = @ErrMsg;
          THROW;
      END CATCH;

      REVERT;   -- revert context — 'REVERT' keyword, no table/proc ref
    sources:
      - dbo.SensitiveData
    targets:
      - dbo.AuditAccess
    exec:
      - dbo.usp_LogAccess
    absent:
      - DataOwner
  - id: fixture-execute-as-02-with-clause
    description: 'Targeted fixture: execute_as_02_with_clause.sql'
    sql: |-
      -- EXECUTE AS Pattern 02: WITH EXECUTE AS OWNER in CREATE PROC header (DMV-style full body)

      -- This is a DMV-style body (sys.sql_modules returns full CREATE OR ALTER text)
      CREATE OR ALTER PROCEDURE [security].[usp_RefreshUserPermissions]
          @UserID      INT = NULL,
          @ForceRefresh BIT = 0
      WITH EXECUTE AS OWNER   -- OWNER is not a table/proc — must not be captured
      AS
      BEGIN
          SET NOCOUNT ON;
          SET XACT_ABORT ON;

          DECLARE @Now DATETIME2 = SYSUTCDATETIME();

          -- Clear existing permissions for user (or all if @UserID IS NULL)
          DELETE FROM [security].[UserPermission]
          WHERE (@UserID IS NULL OR [UserID] = @UserID)
            AND (@ForceRefresh = 1 OR [ExpiresAt] < @Now);

          -- Rebuild permissions from matrix
          INSERT INTO [security].[UserPermission] (
              [UserID],
              [PermissionCode],
              [ResourceType],
              [ResourceID],
              [GrantedAt],
              [ExpiresAt],
              [GrantedBy]
          )
          SELECT DISTINCT
              u.[UserID],
              pm.[PermissionCode],
              pm.[ResourceType],
              pm.[ResourceID],
              @Now,
              DATEADD(DAY, pm.[DurationDays], @Now),
              SUSER_SNAME()
          FROM      [dbo].[User]                AS u
          JOIN      [security].[PermissionMatrix] AS pm ON pm.[RoleCode] = u.[RoleCode]
          WHERE (u.[UserID] = @UserID OR @UserID IS NULL)
            AND u.[IsActive] = 1
            AND pm.[IsActive] = 1;

      END;
    sources:
      - dbo.User
      - security.PermissionMatrix
      - security.UserPermission
    targets:
      - security.UserPermission
  - id: fixture-gp-style-01-cryptic-tables
    description: 'Targeted fixture: gp_style_01_cryptic_tables.sql'
    sql: |-
      -- GP Style Pattern 01: Microsoft Dynamics GP (Great Plains) cryptic table naming
      -- GP uses 2-letter module prefix + 5-digit table number as table names

      -- GP table name legend:
      --   IV00101 = Item Master
      --   IV00105 = Item Site Master
      --   RM00101 = Customer Master
      --   IV30300 = Inventory Transaction History
      --   RM30101 = RM Posted Transaction History

      DECLARE @DEX_ROW_ID INT;
      DECLARE @Time       DATETIME = GETDATE();
      DECLARE @UserID     NVARCHAR(20) = SUSER_SNAME();

      -- Write inventory transaction history (IV30300)
      INSERT INTO [dbo].[IV30300] (
          [ITEMNMBR],
          [DOCNUMBR],
          [DOCTYPE],
          [DOCDATE],
          [TRXQTY],
          [UNITCOST],
          [EXTDCOST],
          [LOCNCODE],
          [TRXLOCTN],
          [DEX_ROW_ID]
      )
      SELECT
          iv.[ITEMNMBR],
          N'IVADJ' + CONVERT(NVARCHAR,NEWID(),32),
          3,   -- Inventory Adjustment
          @Time,
          iv.[QTYONHND] - ivs.[QTYONHND],
          iv.[STNDCOST],
          (iv.[QTYONHND] - ivs.[QTYONHND]) * iv.[STNDCOST],
          ivs.[LOCNCODE],
          ivs.[LOCNCODE],
          NEXT VALUE FOR [dbo].[DEX_ROW_SEQ]
      FROM [dbo].[IV00101] AS iv    -- Item Master
      JOIN [dbo].[IV00105] AS ivs   -- Item Site Master
          ON ivs.[ITEMNMBR] = iv.[ITEMNMBR]
      WHERE ABS(iv.[QTYONHND] - ivs.[QTYONHND]) > 0.001;

      -- Write AR transaction history (RM30101)
      INSERT INTO [dbo].[RM30101] (
          [CUSTNMBR],
          [RMDTYPAL],
          [DOCNUMBR],
          [DOCDATE],
          [DOCAMNT],
          [CURTRXAM],
          [DEX_ROW_ID]
      )
      SELECT
          rm.[CUSTNMBR],
          7,   -- Posted Payment
          N'PMT' + CONVERT(NVARCHAR,NEWID(),32),
          @Time,
          rm.[CUSTCLAS],
          rm.[CUSTCLAS],
          NEXT VALUE FOR [dbo].[DEX_ROW_SEQ]
      FROM [dbo].[RM00101] AS rm    -- Customer Master
      WHERE rm.[INACTIVE] = 0;

      EXEC [dbo].[taUpdateSalesOrder] @UserID = @UserID, @Timestamp = @Time;
    sources:
      - dbo.IV00101
      - dbo.IV00105
      - dbo.RM00101
    targets:
      - dbo.IV30300
      - dbo.RM30101
    exec:
      - dbo.taUpdateSalesOrder
  - id: fixture-insert-exec-01-basic
    description: 'Targeted fixture: insert_exec_01_basic.sql'
    sql: |-
      -- INSERT EXEC Pattern 01: Basic INSERT INTO ... EXEC
      -- Note: temp table should NOT be captured; @tbl variable should NOT be captured

      DECLARE @StartDate DATE = DATEADD(MONTH, -1, GETDATE());
      DECLARE @EndDate   DATE = GETDATE();

      -- Populate staging via SP result
      INSERT INTO [dbo].[ReportData] (
          [ReportDate],
          [Region],
          [ProductCategory],
          [TotalSales],
          [UnitsSold],
          [AvgUnitPrice]
      )
      EXEC [dbo].[usp_GetReportData]
          @StartDate = @StartDate,
          @EndDate   = @EndDate,
          @IncludeReturns = 0;
    targets:
      - dbo.ReportData
    exec:
      - dbo.usp_GetReportData
  - id: fixture-insert-exec-02-multi
    description: 'Targeted fixture: insert_exec_02_multi.sql'
    sql: |-
      -- INSERT EXEC Pattern 02: Multiple INSERT EXEC in sequence

      DECLARE @AsOf DATETIME2 = SYSUTCDATETIME();

      -- First population: Sales
      TRUNCATE TABLE [etl].[SalesSnapshot];
      INSERT INTO [etl].[SalesSnapshot] ([OrderID],[LineID],[ProductID],[Qty],[Amount],[Territory],[AsOf])
      EXEC [dbo].[usp_ExtractSales] @SnapshotDate = @AsOf, @IncludePending = 1;

      -- Second population: Inventory
      TRUNCATE TABLE [etl].[InventorySnapshot];
      INSERT INTO [etl].[InventorySnapshot] ([ProductID],[LocationID],[QtyOnHand],[QtyAllocated],[QtyAvailable],[AsOf])
      EXEC [dbo].[usp_ExtractInventory] @SnapshotDate = @AsOf;

      -- Third population: Customer dimension
      TRUNCATE TABLE [etl].[CustomerSnapshot];
      INSERT INTO [etl].[CustomerSnapshot] ([CustomerID],[Name],[Tier],[Region],[ActiveSince],[AsOf])
      EXEC [reporting].[usp_GetCustomers] @ActiveOnly = 1, @AsOf = @AsOf;
    targets:
      - etl.SalesSnapshot
      - etl.InventorySnapshot
      - etl.CustomerSnapshot
    exec:
      - dbo.usp_ExtractSales
      - dbo.usp_ExtractInventory
      - reporting.usp_GetCustomers
  - id: fixture-insert-exec-03-with-static
    description: 'Targeted fixture: insert_exec_03_with_static.sql'
    sql: |-
      -- INSERT EXEC Pattern 03: INSERT EXEC combined with static SELECT/INSERT

      DECLARE @BatchID  INT;
      DECLARE @BatchTS  DATETIME2 = SYSUTCDATETIME();
      -- A procedure parameter value must be a constant or a variable, never an expression.
      DECLARE @StartDt  DATE = CAST(DATEADD(DAY,-1,GETDATE()) AS DATE);
      DECLARE @EndDt    DATE = CAST(GETDATE() AS DATE);

      -- 1. Log the batch start (static INSERT)
      INSERT INTO [dbo].[AuditBatch] ([BatchStart],[ProcName],[Status])
      VALUES (@BatchTS, N'etl_daily_load', N'RUNNING');

      SET @BatchID = SCOPE_IDENTITY();

      -- 2. Load sales fact via SP execution
      INSERT INTO [dbo].[SalesFact]
          ([BatchID],[OrderDate],[ProductID],[CustomerID],[Qty],[Amount],[CurrencyCode])
      EXEC [etl].[usp_TransformSales]
          @BatchID    = @BatchID,
          @StartDate  = @StartDt,
          @EndDate    = @EndDt;

      -- 3. Refresh product dimension (static SELECT)
      INSERT INTO [dbo].[DimProduct] ([ProductID],[ProductName],[CategoryName],[ListPrice],[IsActive])
      SELECT
          p.[ProductID],
          p.[Name],
          c.[CategoryName],
          p.[ListPrice],
          CASE WHEN p.[SellEndDate] IS NULL THEN 1 ELSE 0 END
      FROM [dbo].[Product]  AS p
      JOIN [dbo].[Category] AS c ON c.[CategoryID] = p.[ProductCategoryID]
      WHERE p.[ModifiedDate] >= DATEADD(DAY,-2,GETDATE());

      -- 4. Update batch status
      UPDATE [dbo].[AuditBatch]
      SET    [Status] = N'COMPLETE', [BatchEnd] = SYSUTCDATETIME()
      WHERE  [BatchID] = @BatchID;
    sources:
      - dbo.Product
      - dbo.Category
    targets:
      - dbo.AuditBatch
      - dbo.SalesFact
      - dbo.DimProduct
    exec:
      - etl.usp_TransformSales
  - id: fixture-insert-exec-04-dynamic-should-not-capture
    description: 'Targeted fixture: insert_exec_04_dynamic_should_not_capture.sql'
    sql: |-
      -- INSERT EXEC Pattern 04: Dynamic proc name via variable — should NOT extract proc as execCall
      -- NOTE: [dbo].[DynamicResult] is inside a string literal (N'INSERT INTO [dbo].[DynamicResult] EXEC ...')
      --       Parser strips string content → DynamicResult correctly NOT in targets (by design).
      --       This tests: @FullProcRef var not captured, sp_executesql not captured, commented proc not captured.

      DECLARE @ProcName    NVARCHAR(256);
      DECLARE @SchemaName  NVARCHAR(128);
      DECLARE @FullProcRef NVARCHAR(512);
      DECLARE @SQL         NVARCHAR(MAX);

      SELECT
          @ProcName   = [ProcedureName],
          @SchemaName = [SchemaName]
      FROM [dbo].[BatchConfig]
      WHERE [ConfigKey] = N'DailyLoadProc'
        AND [IsActive]  = 1;

      SET @FullProcRef = QUOTENAME(@SchemaName) + N'.' + QUOTENAME(@ProcName);
      SET @SQL = N'INSERT INTO [dbo].[DynamicResult] EXEC ' + @FullProcRef;

      -- This is dynamic SQL — parser cannot resolve @FullProcRef to a catalog object
      EXEC sp_executesql @SQL;

      -- This is a string reference — must NOT be captured
      -- Old code: EXEC [dbo].[usp_SomeOtherProc] @Param = 1
    sources:
      - dbo.BatchConfig
    absent:
      - dbo.usp_SomeOtherProc
  - id: fixture-insert-exec-05-temp-table
    description: 'Targeted fixture: insert_exec_05_temp_table.sql'
    sql: |-
      -- INSERT EXEC Pattern 05: INSERT INTO temp table via EXEC — temp table must NOT be captured

      -- Populate temp table from SP
      CREATE TABLE #TempOrders (
          [OrderID]       INT,
          [CustomerID]    INT,
          [OrderDate]     DATE,
          [TotalAmount]   DECIMAL(18,2),
          [LineCount]     INT,
          [Status]        NVARCHAR(20)
      );

      INSERT INTO #TempOrders ([OrderID],[CustomerID],[OrderDate],[TotalAmount],[LineCount],[Status])
      EXEC [dbo].[usp_GetOpenOrders] @DaysBack = 30;

      -- Join temp table with catalog tables and persist result
      INSERT INTO [dbo].[OrderSummary] ([OrderID],[CustomerID],[OrderDate],[TotalAmount],[LineCount],[Status],[CreatedDate])
      SELECT
          t.[OrderID],
          t.[CustomerID],
          t.[OrderDate],
          t.[TotalAmount],
          t.[LineCount],
          t.[Status],
          GETUTCDATE()
      FROM #TempOrders AS t
      JOIN [dbo].[Order]     AS o  ON o.[OrderID] = t.[OrderID]
      JOIN [dbo].[OrderLine] AS ol ON ol.[OrderID] = t.[OrderID]
      WHERE ol.[Status] <> N'Cancelled'
        AND o.[IsArchived] = 0;

      DROP TABLE #TempOrders;
    sources:
      - dbo.Order
      - dbo.OrderLine
    targets:
      - dbo.OrderSummary
    exec:
      - dbo.usp_GetOpenOrders
    absent:
      - '#TempOrders'
  - id: fixture-merge-01-basic
    description: 'Targeted fixture: merge_01_basic.sql'
    sql: |-
      -- MERGE Pattern 01: Basic MERGE with UPDATE and INSERT

      MERGE INTO [dbo].[Customer] AS tgt
      USING [dbo].[CustomerStaging] AS src
          ON tgt.[CustomerID] = src.[CustomerID]
      WHEN MATCHED AND src.[IsDeleted] = 0 THEN
          UPDATE SET
              tgt.[FirstName]     = src.[FirstName],
              tgt.[LastName]      = src.[LastName],
              tgt.[Email]         = src.[Email],
              tgt.[Phone]         = src.[Phone],
              tgt.[AddressLine1]  = src.[AddressLine1],
              tgt.[AddressLine2]  = src.[AddressLine2],
              tgt.[City]          = src.[City],
              tgt.[StateCode]     = src.[StateCode],
              tgt.[ZipCode]       = src.[ZipCode],
              tgt.[CountryCode]   = src.[CountryCode],
              tgt.[ModifiedDate]  = GETUTCDATE()
      WHEN MATCHED AND src.[IsDeleted] = 1 THEN
          UPDATE SET
              tgt.[IsActive]      = 0,
              tgt.[DeletedDate]   = GETUTCDATE()
      WHEN NOT MATCHED BY TARGET THEN
          INSERT (
              [CustomerID], [FirstName], [LastName], [Email], [Phone],
              [AddressLine1], [AddressLine2], [City], [StateCode], [ZipCode],
              [CountryCode], [IsActive], [CreatedDate], [ModifiedDate]
          )
          VALUES (
              src.[CustomerID], src.[FirstName], src.[LastName], src.[Email], src.[Phone],
              src.[AddressLine1], src.[AddressLine2], src.[City], src.[StateCode], src.[ZipCode],
              src.[CountryCode], 1, GETUTCDATE(), GETUTCDATE()
          );
    sources:
      - dbo.CustomerStaging
    targets:
      - dbo.Customer
    absent:
      - none
  - id: fixture-merge-02-cross-schema
    description: 'Targeted fixture: merge_02_cross_schema.sql'
    sql: |-
      -- MERGE Pattern 02: Cross-schema MERGE with output logging

      DECLARE @MergeResults TABLE (
          [Action]      NVARCHAR(10),
          [OrderLineID] BIGINT,
          [OrderID]     BIGINT,
          [ProductID]   INT
      );

      MERGE INTO [sales].[OrderLine] AS tgt
      USING (
          SELECT
              ol.[OrderLineID],
              ol.[OrderID],
              ol.[ProductID],
              ol.[Quantity],
              ol.[UnitPrice],
              ol.[DiscountPercent],
              ol.[LineTotal],
              ol.[ShipDate],
              ol.[Status]
          FROM   [staging].[OrderLines] AS ol
          WHERE  ol.[BatchDate] = CAST(GETUTCDATE() AS DATE)
      ) AS src ON tgt.[OrderLineID] = src.[OrderLineID]
      WHEN MATCHED THEN
          UPDATE SET
              tgt.[Quantity]        = src.[Quantity],
              tgt.[UnitPrice]       = src.[UnitPrice],
              tgt.[DiscountPercent] = src.[DiscountPercent],
              tgt.[LineTotal]       = src.[LineTotal],
              tgt.[ShipDate]        = src.[ShipDate],
              tgt.[Status]          = src.[Status],
              tgt.[LastUpdated]     = GETUTCDATE()
      WHEN NOT MATCHED BY TARGET THEN
          INSERT ([OrderLineID],[OrderID],[ProductID],[Quantity],[UnitPrice],
                  [DiscountPercent],[LineTotal],[ShipDate],[Status],[LastUpdated])
          VALUES (src.[OrderLineID],src.[OrderID],src.[ProductID],src.[Quantity],src.[UnitPrice],
                  src.[DiscountPercent],src.[LineTotal],src.[ShipDate],src.[Status],GETUTCDATE())
      OUTPUT
          $action,
          INSERTED.[OrderLineID],
          INSERTED.[OrderID],
          INSERTED.[ProductID]
      INTO @MergeResults ([Action],[OrderLineID],[OrderID],[ProductID]);

      -- Log to audit table (real catalog table, not @var)
      INSERT INTO [audit].[MergeLog] ([RunDate],[TableName],[Inserted],[Updated],[Deleted])
      SELECT
          GETUTCDATE(),
          N'sales.OrderLine',
          SUM(CASE WHEN [Action] = 'INSERT' THEN 1 ELSE 0 END),
          SUM(CASE WHEN [Action] = 'UPDATE' THEN 1 ELSE 0 END),
          0
      FROM @MergeResults;
    sources:
      - staging.OrderLines
    targets:
      - sales.OrderLine
      - audit.MergeLog
  - id: fixture-merge-03-cte-source
    description: 'Targeted fixture: merge_03_cte_source.sql'
    sql: |-
      -- MERGE Pattern 03: MERGE with CTE as source (CTE name must NOT be extracted)

      WITH InventoryCTE AS (
          SELECT
              pi.[ProductID],
              SUM(pi.[Quantity])         AS TotalQty,
              AVG(pi.[LocationID]  * 1.0) AS AvgLocation,
              MIN(pi.[ModifiedDate])     AS OldestRecord
          FROM [dbo].[ProductInventory] pi
          GROUP BY pi.[ProductID]
      ),
      SalesCTE AS (
          SELECT
              sod.[ProductID],
              SUM(sod.[OrderQty])         AS TotalOrdered,
              SUM(sod.[LineTotal])        AS TotalRevenue,
              COUNT(DISTINCT sod.[SalesOrderID]) AS OrderCount
          FROM [dbo].[SalesOrderDetail] sod
          WHERE sod.[ModifiedDate] >= DATEADD(MONTH, -3, GETUTCDATE())
          GROUP BY sod.[ProductID]
      ),
      CombinedCTE AS (
          SELECT
              ISNULL(i.[ProductID], s.[ProductID]) AS [ProductID],
              ISNULL(i.[TotalQty], 0)              AS [TotalQty],
              ISNULL(s.[TotalOrdered], 0)          AS [TotalOrdered],
              ISNULL(s.[TotalRevenue], 0.0)        AS [TotalRevenue],
              ISNULL(s.[OrderCount], 0)            AS [OrderCount]
          FROM       InventoryCTE AS i
          FULL JOIN  SalesCTE      AS s ON i.[ProductID] = s.[ProductID]
      )
      MERGE INTO [dbo].[ProductSummary] AS tgt
      USING CombinedCTE AS src ON tgt.[ProductID] = src.[ProductID]
      WHEN MATCHED THEN
          UPDATE SET
              tgt.[TotalInventory]  = src.[TotalQty],
              tgt.[TotalOrdered]    = src.[TotalOrdered],
              tgt.[TotalRevenue]    = src.[TotalRevenue],
              tgt.[OrderCount]      = src.[OrderCount],
              tgt.[LastRefreshed]   = GETUTCDATE()
      WHEN NOT MATCHED BY TARGET THEN
          INSERT ([ProductID],[TotalInventory],[TotalOrdered],[TotalRevenue],[OrderCount],[LastRefreshed])
          VALUES (src.[ProductID],src.[TotalQty],src.[TotalOrdered],src.[TotalRevenue],src.[OrderCount],GETUTCDATE())
      WHEN NOT MATCHED BY SOURCE THEN
          UPDATE SET tgt.[IsActive] = 0;
    sources:
      - dbo.ProductInventory
      - dbo.SalesOrderDetail
    targets:
      - dbo.ProductSummary
    absent:
      - dbo.InventoryCTE
      - dbo.SalesCTE
      - dbo.CombinedCTE
  - id: fixture-merge-04-delete-action
    description: 'Targeted fixture: merge_04_delete_action.sql'
    sql: |-
      -- MERGE Pattern 04: MERGE with all three actions including WHEN NOT MATCHED BY SOURCE (delete)

      DECLARE @RunID   UNIQUEIDENTIFIER = NEWID();
      DECLARE @RunDate DATETIME2        = SYSUTCDATETIME();

      MERGE INTO [hr].[Employee] WITH (HOLDLOCK) AS tgt
      USING (
          SELECT
              ei.[EmployeeNumber],
              ei.[FirstName],
              ei.[LastName],
              ei.[Email],
              ei.[HireDate],
              ei.[TerminationDate],
              ei.[JobTitle],
              ei.[DepartmentCode],
              d.[DepartmentID]
          FROM  [dbo].[EmployeeImport] AS ei
          JOIN  [hr].[Department]      AS d  ON d.[DepartmentCode] = ei.[DepartmentCode]
          WHERE ei.[ImportBatchID] = @RunID
             OR ei.[ImportBatchID] IS NULL    -- allow null-batch full refresh
      ) AS src ON tgt.[EmployeeNumber] = src.[EmployeeNumber]
      WHEN MATCHED AND (
              tgt.[FirstName]   <> src.[FirstName]
           OR tgt.[LastName]    <> src.[LastName]
           OR tgt.[Email]       <> src.[Email]
           OR tgt.[DepartmentID]<> src.[DepartmentID]
           OR tgt.[JobTitle]    <> src.[JobTitle]
      ) THEN
          UPDATE SET
              tgt.[FirstName]        = src.[FirstName],
              tgt.[LastName]         = src.[LastName],
              tgt.[Email]            = src.[Email],
              tgt.[DepartmentID]     = src.[DepartmentID],
              tgt.[JobTitle]         = src.[JobTitle],
              tgt.[ModifiedDate]     = @RunDate,
              tgt.[ModifiedByRunID]  = @RunID
      WHEN NOT MATCHED BY TARGET THEN
          INSERT ([EmployeeNumber],[FirstName],[LastName],[Email],[HireDate],[JobTitle],[DepartmentID],[IsActive],[CreatedDate])
          VALUES (src.[EmployeeNumber],src.[FirstName],src.[LastName],src.[Email],src.[HireDate],src.[JobTitle],src.[DepartmentID],1,@RunDate)
      WHEN NOT MATCHED BY SOURCE AND tgt.[IsActive] = 1 THEN
          UPDATE SET
              tgt.[IsActive]        = 0,
              tgt.[TerminationDate] = @RunDate;

      EXEC [dbo].[usp_LogMergeActivity]
          @TableName  = N'hr.Employee',
          @RunID      = @RunID,
          @RunDate    = @RunDate;
    sources:
      - dbo.EmployeeImport
      - hr.Department
    targets:
      - hr.Employee
    exec:
      - dbo.usp_LogMergeActivity
  - id: fixture-merge-05-complex-condition
    description: 'Targeted fixture: merge_05_complex_condition.sql'
    sql: |-
      -- MERGE Pattern 05: MERGE with complex conditional logic and multiple schemas

      BEGIN TRANSACTION;

      BEGIN TRY
          -- Step 1: Merge core product data
          MERGE INTO [prd].[Product] AS tgt
          USING (
              SELECT
                  sp.[ProductCode],
                  sp.[ProductName],
                  sp.[Description],
                  sp.[ListPrice],
                  sp.[StandardCost],
                  sp.[Weight],
                  sp.[Color],
                  sp.[Size],
                  sp.[UnitsInStock],
                  sp.[ReorderLevel],
                  sp.[Discontinued],
                  c.[CategoryID],
                  c.[CategoryName],
                  s.[SupplierID],
                  s.[SupplierName]
              FROM      [stg].[Product]  AS sp
              JOIN      [ref].[Category] AS c  ON c.[CategoryCode] = sp.[CategoryCode]
              LEFT JOIN [ref].[Supplier] AS s  ON s.[SupplierCode] = sp.[SupplierCode]
              WHERE sp.[IsValid] = 1
                AND sp.[LoadDate] = CAST(GETUTCDATE() AS DATE)
          ) AS src ON tgt.[ProductCode] = src.[ProductCode]
          WHEN MATCHED AND (
              tgt.[ListPrice]    <> src.[ListPrice]
           OR tgt.[StandardCost] <> src.[StandardCost]
           OR tgt.[Discontinued] <> src.[Discontinued]
          ) THEN
              UPDATE SET
                  tgt.[ProductName]  = src.[ProductName],
                  tgt.[Description]  = src.[Description],
                  tgt.[ListPrice]    = src.[ListPrice],
                  tgt.[StandardCost] = src.[StandardCost],
                  tgt.[Weight]       = src.[Weight],
                  tgt.[Color]        = src.[Color],
                  tgt.[Size]         = src.[Size],
                  tgt.[UnitsInStock] = src.[UnitsInStock],
                  tgt.[ReorderLevel] = src.[ReorderLevel],
                  tgt.[Discontinued] = src.[Discontinued],
                  tgt.[CategoryID]   = src.[CategoryID],
                  tgt.[SupplierID]   = src.[SupplierID],
                  tgt.[ModifiedDate] = GETUTCDATE()
          WHEN NOT MATCHED BY TARGET THEN
              INSERT ([ProductCode],[ProductName],[Description],[ListPrice],[StandardCost],
                      [Weight],[Color],[Size],[UnitsInStock],[ReorderLevel],[Discontinued],
                      [CategoryID],[SupplierID],[IsActive],[CreatedDate])
              VALUES (src.[ProductCode],src.[ProductName],src.[Description],src.[ListPrice],src.[StandardCost],
                      src.[Weight],src.[Color],src.[Size],src.[UnitsInStock],src.[ReorderLevel],src.[Discontinued],
                      src.[CategoryID],src.[SupplierID],1,GETUTCDATE());

          -- Step 2: Archive changed product history
          INSERT INTO [prd].[ProductHistory]
              ([ProductCode],[SnapshotDate],[ListPrice],[StandardCost],[CategoryID],[SupplierID])
          SELECT
              p.[ProductCode],
              CAST(GETUTCDATE() AS DATE),
              p.[ListPrice],
              p.[StandardCost],
              p.[CategoryID],
              p.[SupplierID]
          FROM [prd].[Product] AS p
          WHERE p.[ModifiedDate] >= DATEADD(MINUTE, -5, GETUTCDATE());

          COMMIT TRANSACTION;
      END TRY
      BEGIN CATCH
          IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
          THROW;
      END CATCH;
    sources:
      - prd.Product
      - ref.Category
      - ref.Supplier
      - stg.Product
    targets:
      - prd.Product
      - prd.ProductHistory
  - id: fixture-multi-dml-01-etl-pipeline
    description: 'Targeted fixture: multi_dml_01_etl_pipeline.sql'
    sql: |-
      -- MULTI-DML Pattern 01: ETL pipeline — stage → transform → load with 5 INSERT + 3 UPDATE

      DECLARE @RunID    INT;
      DECLARE @RunStart DATETIME2 = SYSUTCDATETIME();
      DECLARE @Errors   INT = 0;

      -- Step 1: Log ETL start
      INSERT INTO [ops].[ETLRun] ([RunStart],[ProcName],[Status])
      VALUES (@RunStart, N'usp_LoadOrderFact', N'RUNNING');
      SET @RunID = SCOPE_IDENTITY();

      -- Step 2: Stage raw orders
      INSERT INTO [stg].[Order] ([OrderID],[CustomerID],[OrderDate],[CurrencyCode],[TotalAmount],[RawAmount],[Status],[StageDate])
      SELECT
          r.[OrderID],
          r.[CustomerID],
          r.[OrderDate],
          r.[CurrencyCode],
          r.[Amount] * ISNULL(er.[Rate],1.0),
          r.[Amount],
          r.[Status],
          GETUTCDATE()
      FROM [raw].[InboundOrder]  AS r
      LEFT JOIN [ops].[ExchangeRate] AS er ON er.[FromCurrency] = r.[CurrencyCode]
                                           AND er.[ToCurrency]  = N'USD'
                                           AND er.[RateDate]    = CAST(r.[OrderDate] AS DATE)
      WHERE r.[LoadedDate] = CAST(@RunStart AS DATE);

      -- Step 3: Stage order lines
      INSERT INTO [stg].[OrderLine] ([OrderID],[LineID],[ProductID],[Qty],[UnitPrice],[LineTotal],[StageDate])
      SELECT
          r.[OrderID],
          r.[LineNumber],
          r.[ProductID],
          r.[Quantity],
          r.[UnitPrice],
          r.[Quantity] * r.[UnitPrice],
          GETUTCDATE()
      FROM [raw].[InboundOrder] AS r
      WHERE r.[RecordType] = N'LINE'
        AND r.[LoadedDate]  = CAST(@RunStart AS DATE);

      -- Step 4: Validate staged data
      EXEC [dbo].[usp_ValidateOrder] @RunID = @RunID;

      -- Step 5: Load order fact
      INSERT INTO [dbo].[OrderFact] ([RunID],[OrderID],[CustomerID],[OrderDate],[TotalAmount],[CurrencyCode],[DimCustomerKey])
      SELECT
          @RunID,
          s.[OrderID],
          s.[CustomerID],
          s.[OrderDate],
          s.[TotalAmount],
          s.[CurrencyCode],
          dc.[DimCustomerKey]
      FROM [stg].[Order] AS s
      JOIN [dbo].[DimCustomer] AS dc ON dc.[CustomerID] = s.[CustomerID]
      WHERE s.[Status] = N'VALID';

      -- Step 6: Load order line fact
      INSERT INTO [dbo].[OrderLineFact] ([RunID],[OrderID],[LineID],[ProductID],[Qty],[UnitPrice],[LineTotal])
      SELECT @RunID, sl.[OrderID], sl.[LineID], sl.[ProductID], sl.[Qty], sl.[UnitPrice], sl.[LineTotal]
      FROM [stg].[OrderLine] AS sl
      JOIN [stg].[Order]     AS so ON so.[OrderID] = sl.[OrderID] AND so.[Status] = N'VALID';

      -- Step 7: Update customer dimension with latest order info
      UPDATE dc
      SET
          dc.[LastOrderDate]  = agg.[MaxDate],
          dc.[TotalOrders]    = dc.[TotalOrders] + agg.[NewOrders],
          dc.[LifetimeValue]  = dc.[LifetimeValue] + agg.[NewAmount],
          dc.[ModifiedDate]   = GETUTCDATE()
      FROM [dbo].[DimCustomer] AS dc
      JOIN (
          SELECT [CustomerID], MAX([OrderDate]) AS MaxDate, COUNT(1) AS NewOrders, SUM([TotalAmount]) AS NewAmount
          FROM   [stg].[Order]
          WHERE  [Status] = N'VALID'
          GROUP BY [CustomerID]
      ) AS agg ON agg.[CustomerID] = dc.[CustomerID];

      -- Step 8: Update ETL run status
      UPDATE [ops].[ETLRun]
      SET    [Status] = N'COMPLETE', [RunEnd] = SYSUTCDATETIME(), [RowsProcessed] = @@ROWCOUNT
      WHERE  [RunID] = @RunID;
    sources:
      - raw.InboundOrder
      - ops.ExchangeRate
      - stg.Order
      - stg.OrderLine
      - dbo.DimCustomer
    targets:
      - stg.Order
      - stg.OrderLine
      - dbo.OrderFact
      - dbo.OrderLineFact
      - dbo.DimCustomer
      - ops.ETLRun
    exec:
      - dbo.usp_ValidateOrder
  - id: fixture-multi-dml-02-if-else-branches
    description: 'Targeted fixture: multi_dml_02_if_else_branches.sql'
    sql: |-
      -- MULTI-DML Pattern 02: IF/ELSE branches with different tables per branch
      -- All branches are visible to static parser — all tables in all branches must be captured

      DECLARE @LoadType   NVARCHAR(20);
      DECLARE @LastLoad   DATETIME2;
      DECLARE @RowsLoaded INT = 0;

      SELECT
          @LoadType = [Value],
          @LastLoad = CAST([Value2] AS DATETIME2)
      FROM [dbo].[Config]
      WHERE [Key] = N'DW_LOAD_MODE';

      IF @LoadType = N'INCREMENTAL'
      BEGIN
          -- Branch 1: Incremental load from delta table
          INSERT INTO [dbo].[DataWarehouse] (
              [ID],[CustomerID],[DataDate],[Value],[LoadType],[LoadedAt]
          )
          SELECT
              id.[ID],
              id.[CustomerID],
              id.[DataDate],
              id.[Value],
              N'INCREMENTAL',
              GETUTCDATE()
          FROM [dbo].[IncrementalData] AS id
          JOIN [dbo].[Customer]        AS c  ON c.[CustomerID] = id.[CustomerID]
          WHERE id.[ChangedDate] > @LastLoad
            AND id.[IsDeleted]   = 0;

          SET @RowsLoaded = @@ROWCOUNT;
      END
      ELSE IF @LoadType = N'FULL'
      BEGIN
          -- Branch 2: Full reload — archive old data first
          INSERT INTO [dbo].[DataWarehouseArchive] ([ID],[CustomerID],[DataDate],[Value],[ArchivedAt])
          SELECT [ID],[CustomerID],[DataDate],[Value],GETUTCDATE()
          FROM   [dbo].[DataWarehouse];

          TRUNCATE TABLE [dbo].[DataWarehouse];

          -- Reload from full dataset
          INSERT INTO [dbo].[DataWarehouse] (
              [ID],[CustomerID],[DataDate],[Value],[LoadType],[LoadedAt]
          )
          SELECT
              fd.[ID],
              fd.[CustomerID],
              fd.[DataDate],
              fd.[Value],
              N'FULL',
              GETUTCDATE()
          FROM [dbo].[FullData]  AS fd
          JOIN [dbo].[Customer]  AS c ON c.[CustomerID] = fd.[CustomerID];

          SET @RowsLoaded = @@ROWCOUNT;
      END;

      -- Log outcome regardless of branch taken
      INSERT INTO [ops].[LoadLog] ([LoadType],[RowsLoaded],[LoadedAt])
      VALUES (@LoadType, @RowsLoaded, GETUTCDATE());
    sources:
      - dbo.Config
      - dbo.Customer
      - dbo.DataWarehouse
      - dbo.FullData
      - dbo.IncrementalData
    targets:
      - dbo.DataWarehouse
      - dbo.DataWarehouseArchive
      - ops.LoadLog
  - id: fixture-multi-exec-01-chain
    description: 'Targeted fixture: multi_exec_01_chain.sql'
    sql: |-
      -- MULTI-EXEC Pattern 01: Long chain of sequential EXEC calls — all captured

      DECLARE @RunID    BIGINT;
      DECLARE @RunStart DATETIME2 = SYSUTCDATETIME();

      INSERT INTO [ops].[PipelineRun] ([PipelineName],[RunStart],[Status])
      VALUES (N'DailyETLPipeline', @RunStart, N'RUNNING');
      SET @RunID = SCOPE_IDENTITY();

      -- Phase 1: Extract
      EXEC [etl].[usp_ExtractRaw]        @RunID = @RunID, @IncrementalOnly = 1;

      -- Phase 2: Validate
      EXEC [etl].[usp_ValidateStage]     @RunID = @RunID, @ThrowOnError = 1;

      -- Phase 3: Transform dimensions
      EXEC [etl].[usp_TransformCustomer] @RunID = @RunID;
      EXEC [etl].[usp_TransformOrder]    @RunID = @RunID;
      EXEC [etl].[usp_TransformProduct]  @RunID = @RunID;

      -- Phase 4: Load dimensions first, then facts
      EXEC [etl].[usp_LoadDimCustomer]   @RunID = @RunID;
      EXEC [etl].[usp_LoadDimProduct]    @RunID = @RunID;
      EXEC [etl].[usp_LoadFactOrder]     @RunID = @RunID;

      -- Phase 5: Update aggregates
      EXEC [etl].[usp_UpdateAggregates]  @RunID = @RunID, @FullRecalc = 0;

      UPDATE [ops].[PipelineRun]
      SET    [Status] = N'COMPLETE', [RunEnd] = SYSUTCDATETIME()
      WHERE  [RunID] = @RunID;

      EXEC [dbo].[usp_SendCompletion]    @RunID = @RunID, @Channel = N'slack';
    targets:
      - ops.PipelineRun
    exec:
      - etl.usp_ExtractRaw
      - etl.usp_ValidateStage
      - etl.usp_TransformCustomer
      - etl.usp_TransformOrder
      - etl.usp_TransformProduct
      - etl.usp_LoadDimCustomer
      - etl.usp_LoadDimProduct
      - etl.usp_LoadFactOrder
      - etl.usp_UpdateAggregates
      - dbo.usp_SendCompletion
  - id: fixture-nav-style-01-brackets-with-spaces
    description: 'Targeted fixture: nav_style_01_brackets_with_spaces.sql'
    sql: |-
      -- NAV/Dynamics Style Pattern 01: Identifiers with spaces and $ inside bracket quotes
      -- Tests bracket-aware splitting: dots inside [...] are NOT separators

      -- In Microsoft Dynamics NAV / Business Central, all objects are prefixed
      -- with the company name: [Company Name$Table Name]
      -- This exercises splitSqlName() which must preserve dots inside brackets

      INSERT INTO [dbo].[CRONUS International Ltd_$Sales Line] (
          [Document Type],
          [Document No_],
          [Line No_],
          [Sell-to Customer No_],
          [Type],
          [No_],
          [Description],
          [Quantity],
          [Unit Price],
          [Line Amount]
      )
      SELECT
          sl.[Document Type],
          sl.[Document No_],
          sl.[Line No_],
          c.[No_],
          sl.[Type],
          sl.[No_],
          sl.[Description],
          sl.[Quantity],
          sl.[Unit Price],
          sl.[Quantity] * sl.[Unit Price]
      FROM [dbo].[CRONUS International Ltd_$Sales Header] AS sl
      JOIN [dbo].[CRONUS International Ltd_$Customer]    AS c
          ON c.[No_] = sl.[Sell-to Customer No_]
      WHERE sl.[Status] = 1  -- Released
        AND sl.[Posting Date] = CAST(GETDATE() AS DATE);

      EXEC [dbo].[CRONUS International Ltd_$Check Credit Limit]
          @CustomerNo  = N'10000',
          @DocType     = 1,
          @Amount      = 5000.00;
    sources:
      - dbo.CRONUS International Ltd_$Customer
      - dbo.CRONUS International Ltd_$Sales Header
    targets:
      - dbo.CRONUS International Ltd_$Sales Line
    exec:
      - dbo.CRONUS International Ltd_$Check Credit Limit
  - id: fixture-nav-style-02-multi-company
    description: 'Targeted fixture: nav_style_02_multi_company.sql'
    sql: |-
      -- NAV/Dynamics Style Pattern 02: Multi-company NAV with complex bracketed names containing dots
      -- Key test: [spLoadCase4.5] style names (dot inside brackets = part of name)

      -- Note: table names contain dots inside brackets (e.g. version numbers like Case4.5)
      -- splitSqlName must NOT split [dbo].[Fabrikam Inc_$Item Ledger Entry] into more than 2 parts

      DECLARE @PostingDate DATE = CAST(GETDATE() AS DATE);
      DECLARE @InvoiceNo   NVARCHAR(20);

      -- Create posted invoice header
      INSERT INTO [dbo].[Fabrikam Inc_$Posted Sales Invoice] (
          [No_],
          [Sell-to Customer No_],
          [Bill-to Customer No_],
          [Posting Date],
          [Document Date],
          [External Document No_],
          [Currency Code],
          [Amount],
          [Amount Including VAT]
      )
      SELECT
          N'INV-' + CONVERT(NVARCHAR, NEWID(), 32),
          c.[No_],
          c.[No_],
          @PostingDate,
          @PostingDate,
          N'',
          c.[Currency Code],
          SUM(ile.[Sales Amount (Actual)]),
          SUM(ile.[Sales Amount (Actual)]) * 1.2
      FROM [dbo].[Fabrikam Inc_$Customer]          AS c
      JOIN [dbo].[Fabrikam Inc_$Item Ledger Entry] AS ile
          ON ile.[Source No_] = c.[No_]
      WHERE ile.[Posting Date] = @PostingDate
        AND ile.[Entry Type]   = 1  -- Sale
      GROUP BY c.[No_], c.[Currency Code];

      -- Create posted invoice lines from item ledger
      INSERT INTO [dbo].[Fabrikam Inc_$Posted Sales Invoice Line] (
          [Document No_],
          [Line No_],
          [Type],
          [No_],
          [Description],
          [Quantity],
          [Unit Price],
          [Line Amount]
      )
      SELECT
          N'INV-PLACEHOLDER',
          ile.[Entry No_],
          2,   -- Item type
          i.[No_],
          i.[Description],
          ABS(ile.[Quantity]),
          i.[Unit Price],
          ABS(ile.[Quantity]) * i.[Unit Price]
      FROM [dbo].[Fabrikam Inc_$Item Ledger Entry] AS ile
      JOIN [dbo].[Fabrikam Inc_$Item]              AS i
          ON i.[No_] = ile.[Item No_]
      WHERE ile.[Posting Date] = @PostingDate
        AND ile.[Entry Type]   = 1;
    sources:
      - dbo.Fabrikam Inc_$Customer
      - dbo.Fabrikam Inc_$Item
      - dbo.Fabrikam Inc_$Item Ledger Entry
    targets:
      - dbo.Fabrikam Inc_$Posted Sales Invoice
      - dbo.Fabrikam Inc_$Posted Sales Invoice Line
  - id: fixture-nested-subquery-01
    description: 'Targeted fixture: nested_subquery_01.sql'
    sql: |-
      -- NESTED SUBQUERY Pattern 01: Deep nested subqueries — all referenced base tables captured

      INSERT INTO [dbo].[SalesRanking] (
          [RankDate],
          [SalesPersonID],
          [SalesPersonName],
          [TerritoryName],
          [YTDAmount],
          [QuotaAmount],
          [QuotaAttainment],
          [Rank],
          [Percentile]
      )
      SELECT
          CAST(GETDATE() AS DATE),
          sp_ranked.[SalesPersonID],
          sp_ranked.[SalesPersonName],
          sp_ranked.[TerritoryName],
          sp_ranked.[YTDAmount],
          sp_ranked.[QuotaAmount],
          sp_ranked.[YTDAmount] / NULLIF(sp_ranked.[QuotaAmount],0) * 100,
          RANK() OVER (ORDER BY sp_ranked.[YTDAmount] DESC),
          PERCENT_RANK() OVER (ORDER BY sp_ranked.[YTDAmount])
      FROM (
          -- Level 2: Join sales aggregates with quota
          SELECT
              agg.[SalesPersonID],
              agg.[SalesPersonName],
              agg.[TerritoryName],
              agg.[YTDAmount],
              ISNULL(q.[QuotaAmount], 0) AS QuotaAmount
          FROM (
              -- Level 3: Aggregate orders by salesperson
              SELECT
                  sp.[BusinessEntityID]              AS SalesPersonID,
                  sp.[FirstName] + N' ' + sp.[LastName] AS SalesPersonName,
                  t.[Name]                           AS TerritoryName,
                  ISNULL(SUM(so.[TotalDue]), 0)      AS YTDAmount
              FROM      [sales].[SalesPerson]  AS sp
              LEFT JOIN [dbo].[Territory]      AS t  ON t.[TerritoryID]       = sp.[TerritoryID]
              LEFT JOIN (
                  -- Level 4: Filter orders for current year only
                  SELECT [SalesPersonID], [TotalDue]
                  FROM   [dbo].[SalesOrder]
                  WHERE  YEAR([OrderDate]) = YEAR(GETDATE())
                    AND  [Status] = 5   -- Shipped
              ) AS so ON so.[SalesPersonID] = sp.[BusinessEntityID]
              LEFT JOIN [dbo].[Customer] AS c ON c.[TerritoryID] = t.[TerritoryID]
              GROUP BY sp.[BusinessEntityID], sp.[FirstName], sp.[LastName], t.[Name]
          ) AS agg
          LEFT JOIN (
              -- Level 3b: Get annual quota
              SELECT [SalesPersonID], SUM([SalesQuota]) AS QuotaAmount
              FROM   [dbo].[SalesQuota]
              WHERE  YEAR([QuotaDate]) = YEAR(GETDATE())
              GROUP BY [SalesPersonID]
          ) AS q ON q.[SalesPersonID] = agg.[SalesPersonID]
      ) AS sp_ranked;
    sources:
      - dbo.SalesOrder
      - dbo.Customer
      - dbo.Territory
      - dbo.SalesQuota
      - sales.SalesPerson
    targets:
      - dbo.SalesRanking
  - id: fixture-output-into-01-insert
    description: 'Targeted fixture: output_into_01_insert.sql'
    sql: |-
      -- OUTPUT INTO Pattern 01: INSERT with OUTPUT INTO catalog table (archive pattern)

      INSERT INTO [dbo].[ProcessedMessage] (
          [MessageID],
          [Source],
          [Payload],
          [ReceivedAt],
          [ProcessedAt],
          [Status]
      )
      OUTPUT
          INSERTED.[MessageID],
          INSERTED.[Source],
          INSERTED.[Payload],
          INSERTED.[ReceivedAt],
          INSERTED.[ProcessedAt],
          INSERTED.[Status],
          GETUTCDATE()  AS [ArchivedAt]
      INTO [dbo].[MessageArchive] (
          [MessageID],
          [Source],
          [Payload],
          [ReceivedAt],
          [ProcessedAt],
          [Status],
          [ArchivedAt]
      )
      SELECT
          m.[MessageID],
          m.[Source],
          m.[Payload],
          m.[ReceivedAt],
          GETUTCDATE(),
          N'PROCESSED'
      FROM [dbo].[InboundMessage] AS m
      WHERE m.[Status] = N'PENDING'
        AND m.[ReceivedAt] < DATEADD(MINUTE, -5, GETUTCDATE());
    sources:
      - dbo.InboundMessage
    targets:
      - dbo.ProcessedMessage
      - dbo.MessageArchive
  - id: fixture-output-into-02-update-archive
    description: 'Targeted fixture: output_into_02_update_archive.sql'
    sql: |-
      -- OUTPUT INTO Pattern 02: UPDATE with OUTPUT DELETED/INSERTED into audit table

      DECLARE @EffectiveDate DATE = CAST(GETUTCDATE() AS DATE);

      UPDATE [dbo].[Account]
      SET
          [StatusCode]    = N'SUSPENDED',
          [SuspendedDate] = @EffectiveDate,
          [ModifiedDate]  = GETUTCDATE()
      OUTPUT
          DELETED.[AccountID],
          DELETED.[StatusCode]    AS [OldStatus],
          INSERTED.[StatusCode]   AS [NewStatus],
          DELETED.[CreditLimit]   AS [OldCreditLimit],
          INSERTED.[CreditLimit]  AS [NewCreditLimit],
          SUSER_SNAME()           AS [ChangedBy],
          GETUTCDATE()            AS [ChangeDate],
          N'SUSPEND_OVERDUE'      AS [ChangeReason]
      INTO [audit].[AccountChangeLog] (
          [AccountID],
          [OldStatus],
          [NewStatus],
          [OldCreditLimit],
          [NewCreditLimit],
          [ChangedBy],
          [ChangeDate],
          [ChangeReason]
      )
      WHERE [StatusCode] = N'ACTIVE'
        AND [DueDate]    < DATEADD(DAY, -90, @EffectiveDate)
        AND [BalanceDue]  > 0;
    targets:
      - dbo.Account
      - audit.AccountChangeLog
  - id: fixture-output-into-03-delete
    description: 'Targeted fixture: output_into_03_delete.sql'
    sql: |-
      -- OUTPUT INTO Pattern 03: DELETE with OUTPUT DELETED into tombstone table
      -- Session is the DELETE source (row-removal, no column data contributed) — not a lineage target.
      -- ExpiredSession receives the deleted rows via OUTPUT INTO — that IS a data-contributing write.

      -- Archive and delete expired sessions atomically
      DELETE FROM [dbo].[Session]
      OUTPUT
          DELETED.[SessionID],
          DELETED.[UserID],
          DELETED.[LoginTime],
          DELETED.[LastActivityTime],
          DELETED.[IPAddress],
          DELETED.[UserAgent],
          GETUTCDATE() AS [ExpiredAt]
      INTO [dbo].[ExpiredSession] (
          [SessionID],
          [UserID],
          [LoginTime],
          [LastActivityTime],
          [IPAddress],
          [UserAgent],
          [ExpiredAt]
      )
      WHERE [LastActivityTime] < DATEADD(HOUR, -8, GETUTCDATE())
         OR [IsForceExpired]   = 1;
    targets:
      - dbo.ExpiredSession
    sources:
      - dbo.Session
  - id: fixture-output-into-04-merge
    description: 'Targeted fixture: output_into_04_merge.sql'
    sql: |-
      -- OUTPUT INTO Pattern 04: MERGE with OUTPUT INTO result tracking table
      -- @changes is a @tablevar — must NOT be captured

      DECLARE @changes TABLE (
          [Action]    NVARCHAR(10),
          [ProductID] INT,
          [OldQty]    INT,
          [NewQty]    INT
      );

      MERGE INTO [wh].[Inventory] AS tgt
      USING [staging].[InventoryFeed] AS src
          ON tgt.[ProductID]  = src.[ProductID]
          AND tgt.[LocationID] = src.[LocationID]
      WHEN MATCHED THEN
          UPDATE SET
              tgt.[QtyOnHand]  = src.[QtyOnHand],
              tgt.[LastCounted] = src.[CountDate]
      WHEN NOT MATCHED BY TARGET THEN
          INSERT ([ProductID],[LocationID],[QtyOnHand],[LastCounted])
          VALUES (src.[ProductID],src.[LocationID],src.[QtyOnHand],src.[CountDate])
      OUTPUT
          $action,
          COALESCE(INSERTED.[ProductID], DELETED.[ProductID]),
          DELETED.[QtyOnHand],
          INSERTED.[QtyOnHand]
      INTO @changes ([Action],[ProductID],[OldQty],[NewQty]);

      -- Persist run summary to catalog table (not @var)
      INSERT INTO [ops].[MergeRunLog] ([RunDate],[TableName],[Inserted],[Updated],[TotalRows])
      SELECT
          GETUTCDATE(),
          N'wh.Inventory',
          SUM(CASE WHEN [Action] = 'INSERT' THEN 1 ELSE 0 END),
          SUM(CASE WHEN [Action] = 'UPDATE' THEN 1 ELSE 0 END),
          COUNT(1)
      FROM @changes;
    sources:
      - staging.InventoryFeed
    targets:
      - wh.Inventory
      - ops.MergeRunLog
  - id: fixture-output-into-05-variable-only
    description: 'Targeted fixture: output_into_05_variable_only.sql'
    sql: |-
      -- OUTPUT INTO Pattern 05: OUTPUT INTO @tablevar ONLY — must NOT extract any target from OUTPUT
      -- NOTE: [dbo].[Order] is a UPDATE target (no FROM clause here → not a source).
      --       [dbo].[ProcessedOrder] is an INSERT target.
      --       @updatedIDs is a @table variable → correctly rejected by normalizeCaptured.

      DECLARE @updatedIDs TABLE ([OrderID] INT, [OldStatus] NVARCHAR(20), [NewStatus] NVARCHAR(20));

      UPDATE [dbo].[Order]
      SET
          [StatusCode]   = N'PROCESSING',
          [ModifiedDate] = GETUTCDATE()
      OUTPUT
          DELETED.[OrderID],
          DELETED.[StatusCode],
          INSERTED.[StatusCode]
      INTO @updatedIDs ([OrderID],[OldStatus],[NewStatus])
      WHERE [StatusCode] = N'SUBMITTED'
        AND [SubmittedDate] < DATEADD(HOUR,-1,GETUTCDATE());

      -- Now use the IDs to insert a summary record — THIS is the real catalog target
      INSERT INTO [dbo].[ProcessedOrder] ([OrderID],[ProcessedAt],[PreviousStatus])
      SELECT [OrderID], GETUTCDATE(), [OldStatus]
      FROM   @updatedIDs;
    targets:
      - dbo.Order
      - dbo.ProcessedOrder
  - id: fixture-select-into-01-fabric
    description: 'Targeted fixture: select_into_01_fabric.sql'
    sql: |-
      -- SELECT INTO Pattern 01: SELECT ... INTO (creates new table from SELECT, Fabric/Synapse pattern)

      -- Fabric/Synapse: SELECT INTO creates target table
      SELECT
          soh.[SalesOrderID],
          soh.[OrderDate],
          soh.[CustomerID],
          soh.[TerritoryID],
          soh.[TotalDue],
          soh.[Status],
          sod.[ProductID],
          p.[Name]          AS [ProductName],
          p.[ProductNumber],
          sod.[OrderQty],
          sod.[UnitPrice],
          sod.[LineTotal]
      INTO [dbo].[SalesSnapshot]
      FROM [dbo].[SalesOrderHeader] AS soh
      JOIN [dbo].[SalesOrderDetail] AS sod ON sod.[SalesOrderID] = soh.[SalesOrderID]
      JOIN [dbo].[Product]          AS p   ON p.[ProductID]      = sod.[ProductID]
      WHERE soh.[OrderDate] >= DATEADD(MONTH,-1,GETDATE())
        AND soh.[Status] IN (5,6);    -- shipped or cancelled
    sources:
      - dbo.SalesOrderHeader
      - dbo.SalesOrderDetail
      - dbo.Product
    targets:
      - dbo.SalesSnapshot
  - id: fixture-strings-01-sql-in-strings
    description: 'Targeted fixture: strings_01_sql_in_strings.sql'
    sql: |-
      -- STRINGS Pattern 01: String literals containing SQL keywords — must NOT be captured from strings

      DECLARE @Subject  NVARCHAR(500);
      DECLARE @Body     NVARCHAR(MAX);
      DECLARE @ErrorMsg NVARCHAR(MAX);

      -- These strings contain SQL-like text — must NOT trigger rule extraction
      SET @Subject = N'Daily ETL Alert: INSERT INTO [dbo].[FakeSrcTable] FROM [staging].[Source] completed';
      SET @Body    = N'Query executed: SELECT * FROM [dbo].[StringTarget] WHERE Active = 1 '
                   + N'and also UPDATE [dbo].[FakeSrcTable] SET Status = ''Done'' was run. '
                   + N'EXEC [dbo].[FakeProc] @Param = 1 also executed at ' + CONVERT(NVARCHAR,GETUTCDATE(),120);

      SET @ErrorMsg = N'Error in: INSERT INTO [dbo].[FakeSrcTable] SELECT * FROM [dbo].[StringTarget] -- failed';

      -- Read from real table
      INSERT INTO [dbo].[NotificationQueue] (
          [Subject],
          [Body],
          [Recipient],
          [CreatedAt],
          [Status]
      )
      SELECT
          @Subject,
          @Body,
          ae.[Email],
          GETUTCDATE(),
          N'PENDING'
      FROM [dbo].[AuditEvent] AS ae
      WHERE ae.[EventType] = N'ETL_COMPLETE'
        AND ae.[CreatedAt] >= DATEADD(HOUR,-1,GETUTCDATE());

      EXEC [dbo].[usp_SendEmail]
          @QueueID  = NULL,
          @Priority = N'HIGH';
    sources:
      - dbo.AuditEvent
    targets:
      - dbo.NotificationQueue
    exec:
      - dbo.usp_SendEmail
    absent:
      - dbo.FakeSrcTable
      - dbo.StringTarget
  - id: fixture-strings-02-nvarchar-max
    description: 'Targeted fixture: strings_02_nvarchar_max.sql'
    sql: |-
      -- STRINGS Pattern 02: Long NVARCHAR(MAX) strings with embedded SQL patterns — must NOT trigger rules

      DECLARE @Template    NVARCHAR(MAX);
      DECLARE @FinalDoc    NVARCHAR(MAX);
      DECLARE @TemplateKey NVARCHAR(100) = N'MONTHLY_REPORT';

      -- Load template content (contains SQL-like strings as document text, not as SQL)
      SELECT @Template = t.[TemplateBody]
      FROM   [dbo].[Template] AS t
      WHERE  t.[TemplateKey] = @TemplateKey;

      -- Apply substitutions — string manipulation, no SQL executed from strings
      SET @FinalDoc = REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(
          @Template,
          N'{{DATE}}',    CONVERT(NVARCHAR, GETDATE(), 106)),
          N'{{USER}}',    SUSER_SNAME()),
          N'SELECT_PLACEHOLDER', N''),   -- template contained SELECT keyword literally
          N'INSERT_PLACEHOLDER', N''),
          N'FROM_CLAUSE',         N'');

      -- Insert parameters (NVARCHAR columns contain SQL-like text but must not trigger)
      DECLARE @ParamText NVARCHAR(MAX) = (
          SELECT STRING_AGG(
              tp.[ParamName] + N' = ' + tp.[ParamValue], N'; '
          )
          FROM [dbo].[TemplateParameter] AS tp
          WHERE tp.[TemplateKey] = @TemplateKey
      );
      -- @ParamText might contain: "FROM = dbo.SomeTable; INSERT INTO = staging.Dest"
      -- but it's just a string value, never executed

      INSERT INTO [dbo].[RenderedDocument] (
          [TemplateKey],
          [RenderedContent],
          [Parameters],
          [RenderedAt],
          [RenderedBy]
      )
      VALUES (
          @TemplateKey,
          @FinalDoc,
          @ParamText,
          GETUTCDATE(),
          SUSER_SNAME()
      );
    sources:
      - dbo.Template
      - dbo.TemplateParameter
    targets:
      - dbo.RenderedDocument
    absent:
      - anything that only appears in string literals
  - id: fixture-strings-03-dynamic-sql-exec
    description: 'Targeted fixture: strings_03_dynamic_sql_exec.sql'
    sql: |-
      -- STRINGS Pattern 03: Dynamic SQL via sp_executesql — static refs in config table captured, dynamic content not

      DECLARE @SQL       NVARCHAR(MAX);
      DECLARE @TableName NVARCHAR(256);
      DECLARE @SchemaName NVARCHAR(128);
      DECLARE @FullName  NVARCHAR(512);
      DECLARE @RowCount  INT;

      -- Read configuration from real table
      SELECT
          @TableName  = [TargetTable],
          @SchemaName = [TargetSchema],
          @SQL        = [SqlTemplate]
      FROM [dbo].[ETLConfig]
      WHERE [ConfigName] = N'DailyLoad'
        AND [IsEnabled]  = 1;

      -- @SQL might now contain: 'INSERT INTO [dbo].[DynamicTarget] SELECT * FROM [stg].[DynamicSource]'
      -- but this is a runtime string — we cannot statically resolve it
      SET @FullName = QUOTENAME(@SchemaName) + N'.' + QUOTENAME(@TableName);

      -- Replace placeholder in template
      SET @SQL = REPLACE(@SQL, N'{{TARGET}}', @FullName);

      -- Execute dynamic SQL — parser cannot see inside @SQL string
      EXEC sp_executesql
          @SQL,
          N'@RowCount INT OUTPUT',
          @RowCount = @RowCount OUTPUT;
    sources:
      - dbo.ETLConfig
    absent:
      - dbo.DynamicTarget
      - stg.DynamicSource
  - id: fixture-temp-heavy-01
    description: 'Targeted fixture: temp_heavy_01.sql'
    sql: |-
      -- TEMP TABLE HEAVY Pattern 01: Many #tempTables — none should appear in extracted deps
      -- #temp tables: #RawOrders, #AggByProduct, #AggByCustomer, #Regional — must NOT be captured

      -- Stage 1: Pull raw data into temp
      CREATE TABLE #RawOrders (
          [OrderID]     INT,
          [CustomerID]  INT,
          [ProductID]   INT,
          [OrderDate]   DATE,
          [Quantity]    INT,
          [UnitPrice]   DECIMAL(18,4),
          [LineTotal]   DECIMAL(18,4),
          [RegionCode]  NVARCHAR(10)
      );

      INSERT INTO #RawOrders
      SELECT
          sol.[SalesOrderID],
          soh.[CustomerID],
          sol.[ProductID],
          CAST(soh.[OrderDate] AS DATE),
          sol.[OrderQty],
          sol.[UnitPrice],
          sol.[LineTotal],
          r.[RegionCode]
      FROM [dbo].[SalesOrder]      AS soh
      JOIN [dbo].[SalesOrderLine]  AS sol ON sol.[SalesOrderID] = soh.[SalesOrderID]
      JOIN [dbo].[Customer]        AS c   ON c.[CustomerID]     = soh.[CustomerID]
      JOIN [ref].[Region]          AS r   ON r.[RegionID]       = c.[RegionID]
      WHERE MONTH(soh.[OrderDate]) = MONTH(GETDATE())
        AND YEAR(soh.[OrderDate])  = YEAR(GETDATE());

      -- Stage 2: Aggregate by product
      CREATE TABLE #AggByProduct (
          [ProductID]    INT,
          [CategoryID]   INT,
          [CategoryName] NVARCHAR(100),
          [TotalQty]     INT,
          [TotalRevenue] DECIMAL(18,2)
      );

      INSERT INTO #AggByProduct
      SELECT
          r.[ProductID],
          pc.[ProductCategoryID],
          pc.[Name],
          SUM(r.[Quantity]),
          SUM(r.[LineTotal])
      FROM #RawOrders             AS r
      JOIN [dbo].[Product]        AS p  ON p.[ProductID]        = r.[ProductID]
      JOIN [dbo].[ProductCategory] AS pc ON pc.[ProductCategoryID] = p.[ProductCategoryID]
      GROUP BY r.[ProductID], pc.[ProductCategoryID], pc.[Name];

      -- Stage 3: Aggregate by customer
      CREATE TABLE #AggByCustomer (
          [CustomerID]   INT,
          [RegionCode]   NVARCHAR(10),
          [OrderCount]   INT,
          [TotalRevenue] DECIMAL(18,2)
      );

      INSERT INTO #AggByCustomer
      SELECT [CustomerID], [RegionCode], COUNT(DISTINCT [OrderID]), SUM([LineTotal])
      FROM   #RawOrders
      GROUP BY [CustomerID], [RegionCode];

      -- Stage 4: Regional rollup
      CREATE TABLE #Regional (
          [RegionCode]   NVARCHAR(10),
          [OrderCount]   INT,
          [TotalRevenue] DECIMAL(18,2),
          [AvgOrderValue] DECIMAL(18,2)
      );

      INSERT INTO #Regional
      SELECT [RegionCode], COUNT(*), SUM([TotalRevenue]), AVG([TotalRevenue])
      FROM   #AggByCustomer
      GROUP BY [RegionCode];

      -- Final: Load cube from temp data
      INSERT INTO [reporting].[MonthlySalesCube] (
          [ReportMonth],[ReportYear],[ProductID],[CategoryID],[CategoryName],
          [CustomerID],[RegionCode],[OrderCount],[TotalQty],[TotalRevenue],[LoadedAt]
      )
      SELECT
          MONTH(GETDATE()),
          YEAR(GETDATE()),
          p.[ProductID],
          p.[CategoryID],
          p.[CategoryName],
          c.[CustomerID],
          c.[RegionCode],
          1,
          SUM(r.[Quantity]),
          SUM(r.[LineTotal]),
          GETUTCDATE()
      FROM #RawOrders      AS r
      JOIN #AggByProduct   AS p ON p.[ProductID]  = r.[ProductID]
      JOIN #AggByCustomer  AS c ON c.[CustomerID] = r.[CustomerID]
      GROUP BY MONTH(GETDATE()),YEAR(GETDATE()),p.[ProductID],p.[CategoryID],p.[CategoryName],c.[CustomerID],c.[RegionCode];

      DROP TABLE #RawOrders, #AggByProduct, #AggByCustomer, #Regional;
    sources:
      - dbo.SalesOrder
      - dbo.SalesOrderLine
      - dbo.Product
      - dbo.Customer
      - ref.Region
      - dbo.ProductCategory
    targets:
      - reporting.MonthlySalesCube
  - id: fixture-try-catch-01-deep-nesting
    description: 'Targeted fixture: try_catch_01_deep_nesting.sql'
    sql: |-
      -- TRY/CATCH Pattern 01: Triple-nested TRY/CATCH with tables in each level

      BEGIN TRANSACTION;

      BEGIN TRY

          -- Outer try: full order processing
          DECLARE @OrderID    INT;
          DECLARE @ProductID  INT;
          DECLARE @CustomerID INT;
          DECLARE @Qty        INT;
          DECLARE @UnitPrice  DECIMAL(18,2);

          SELECT TOP 1
              @OrderID    = [OrderID],
              @ProductID  = [ProductID],
              @CustomerID = [CustomerID],
              @Qty        = [Quantity],
              @UnitPrice  = [UnitPrice]
          FROM [dbo].[OrderQueue]
          WHERE [Status] = N'PENDING'
          ORDER BY [Priority] DESC, [CreatedAt] ASC;

          BEGIN TRY

              -- Inner try: product/customer validation
              DECLARE @StockQty   INT;
              DECLARE @CreditLimit DECIMAL(18,2);

              SELECT @StockQty = [StockQty]
              FROM   [dbo].[Product]
              WHERE  [ProductID] = @ProductID;

              SELECT @CreditLimit = [CreditLimit]
              FROM   [dbo].[Customer]
              WHERE  [CustomerID] = @CustomerID;

              IF @StockQty < @Qty
                  THROW 50001, 'Insufficient stock', 1;

              IF @CreditLimit < (@Qty * @UnitPrice)
                  THROW 50002, 'Credit limit exceeded', 1;

              BEGIN TRY
                  -- Innermost try: atomic write
                  INSERT INTO [dbo].[ProcessedOrder] (
                      [OrderID],[ProductID],[CustomerID],[Quantity],[UnitPrice],[ProcessedAt],[Status]
                  )
                  VALUES (
                      @OrderID,@ProductID,@CustomerID,@Qty,@UnitPrice,GETUTCDATE(),N'SUCCESS'
                  );

                  UPDATE [dbo].[OrderQueue]
                  SET    [Status] = N'DONE', [ProcessedAt] = GETUTCDATE()
                  WHERE  [OrderID] = @OrderID;

              END TRY
              BEGIN CATCH
                  -- Innermost catch: log transient write error
                  INSERT INTO [dbo].[OrderError] ([OrderID],[ErrorCode],[ErrorMsg],[OccurredAt],[Severity])
                  VALUES (@OrderID, ERROR_NUMBER(), ERROR_MESSAGE(), GETUTCDATE(), N'WRITE_FAIL');
                  THROW;
              END CATCH;

          END TRY
          BEGIN CATCH
              -- Inner catch: validation error
              INSERT INTO [dbo].[OrderError] ([OrderID],[ErrorCode],[ErrorMsg],[OccurredAt],[Severity])
              VALUES (@OrderID, ERROR_NUMBER(), ERROR_MESSAGE(), GETUTCDATE(), N'VALIDATION');
              THROW;
          END CATCH;

          COMMIT TRANSACTION;

      END TRY
      BEGIN CATCH

          -- Outer catch: fatal error handling
          IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;

          INSERT INTO [dbo].[FatalError] ([Context],[OrderID],[ErrorCode],[ErrorMsg],[OccurredAt])
          VALUES (N'ProcessOrder', @OrderID, ERROR_NUMBER(), ERROR_MESSAGE(), GETUTCDATE());

          -- A procedure parameter value must be a constant or a variable, never a function call.
          DECLARE @FatalMsg NVARCHAR(4000) = ERROR_MESSAGE();

          EXEC [dbo].[usp_NotifyOps]
              @Severity = N'CRITICAL',
              @Message  = @FatalMsg,
              @OrderID  = @OrderID;

      END CATCH;
    sources:
      - dbo.OrderQueue
      - dbo.Product
      - dbo.Customer
    targets:
      - dbo.FatalError
      - dbo.OrderError
      - dbo.OrderQueue
      - dbo.ProcessedOrder
    exec:
      - dbo.usp_NotifyOps
  - id: fixture-try-catch-02-xact-retry
    description: 'Targeted fixture: try_catch_02_xact_retry.sql'
    sql: |-
      -- TRY/CATCH Pattern 02: Transaction with retry logic and XACT_ABORT

      SET NOCOUNT ON;
      SET XACT_ABORT ON;

      DECLARE @MaxRetries  INT         = 3;
      DECLARE @RetryCount  INT         = 0;
      DECLARE @RetryDelay  VARCHAR(8)  = N'00:00:02';
      DECLARE @TransferID  BIGINT;
      DECLARE @FromAccount INT;
      DECLARE @ToAccount   INT;
      DECLARE @Amount      DECIMAL(18,4);
      -- A procedure parameter value must be a constant or a variable, never an expression.
      DECLARE @Debit       DECIMAL(18,4);

      SELECT TOP 1
          @TransferID  = [TransferID],
          @FromAccount = [FromAccountID],
          @ToAccount   = [ToAccountID],
          @Amount      = [Amount]
      FROM [dbo].[TransferRequest]
      WHERE [Status] = N'QUEUED'
      ORDER BY [Priority] DESC, [RequestedAt] ASC;

      WHILE @RetryCount <= @MaxRetries
      BEGIN
          BEGIN TRY
              BEGIN TRANSACTION;

              -- Validate both accounts exist and are active
              IF NOT EXISTS (SELECT 1 FROM [dbo].[Account] WHERE [AccountID] = @FromAccount AND [IsActive] = 1)
                  THROW 50010, 'Source account not active', 1;
              IF NOT EXISTS (SELECT 1 FROM [dbo].[Account] WHERE [AccountID] = @ToAccount   AND [IsActive] = 1)
                  THROW 50011, 'Target account not active', 1;

              -- Debit source
              SET @Debit = @Amount * -1;

              EXEC [dbo].[usp_UpdateBalance]
                  @AccountID = @FromAccount,
                  @Delta     = @Debit,
                  @Reason    = N'TRANSFER_OUT';

              -- Credit target
              EXEC [dbo].[usp_UpdateBalance]
                  @AccountID = @ToAccount,
                  @Delta     = @Amount,
                  @Reason    = N'TRANSFER_IN';

              -- Record transaction
              INSERT INTO [dbo].[AccountTransaction] ([TransferID],[AccountID],[Direction],[Amount],[PostedAt])
              VALUES (@TransferID, @FromAccount, N'DR', @Amount, SYSUTCDATETIME()),
                     (@TransferID, @ToAccount,   N'CR', @Amount, SYSUTCDATETIME());

              UPDATE [dbo].[TransferRequest]
              SET    [Status] = N'COMPLETE', [CompletedAt] = SYSUTCDATETIME()
              WHERE  [TransferID] = @TransferID;

              INSERT INTO [dbo].[TransferLog] ([TransferID],[Attempt],[Result],[LoggedAt])
              VALUES (@TransferID, @RetryCount + 1, N'SUCCESS', SYSUTCDATETIME());

              COMMIT TRANSACTION;
              BREAK;  -- success — exit retry loop

          END TRY
          BEGIN CATCH
              IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
              SET @RetryCount += 1;

              INSERT INTO [dbo].[TransferLog] ([TransferID],[Attempt],[Result],[ErrorMsg],[LoggedAt])
              VALUES (@TransferID, @RetryCount, N'RETRY', ERROR_MESSAGE(), SYSUTCDATETIME());

              IF @RetryCount > @MaxRetries
              BEGIN
                  UPDATE [dbo].[TransferRequest]
                  SET    [Status] = N'FAILED', [FailedAt] = SYSUTCDATETIME(), [LastError] = ERROR_MESSAGE()
                  WHERE  [TransferID] = @TransferID;
                  THROW;
              END;

              WAITFOR DELAY @RetryDelay;
          END CATCH;
      END;
    sources:
      - dbo.TransferRequest
      - dbo.Account
    targets:
      - dbo.AccountTransaction
      - dbo.TransferRequest
      - dbo.TransferLog
    exec:
      - dbo.usp_UpdateBalance
  - id: fixture-udf-heavy-01
    description: 'Targeted fixture: udf_heavy_01.sql'
    sql: |-
      -- UDF HEAVY Pattern 01: Multiple inline scalar UDF calls — all schema-qualified UDFs captured as sources

      INSERT INTO [reporting].[InvoiceSummary] (
          [InvoiceID],
          [CustomerID],
          [CustomerTier],
          [FormattedDate],
          [NetAmount],
          [TaxAmount],
          [GrossAmountUSD],
          [FormattedGross],
          [GeneratedAt]
      )
      SELECT
          o.[OrderID],
          c.[CustomerID],
          [dbo].[udf_GetCustomerTier](c.[CustomerID], c.[TotalSpend]),
          [dbo].[udf_FormatDate](o.[OrderDate], N'MMMM dd, yyyy'),
          o.[NetAmount],
          [dbo].[udf_CalcTax](o.[NetAmount], o.[TaxCode], o.[StateCode]),
          o.[NetAmount] * [finance].[udf_ExchangeRate](o.[CurrencyCode], N'USD', o.[OrderDate]),
          [dbo].[udf_FormatCurrency](
              o.[NetAmount] * [finance].[udf_ExchangeRate](o.[CurrencyCode], N'USD', o.[OrderDate]),
              N'USD'
          ),
          GETUTCDATE()
      FROM [dbo].[Order]    AS o
      JOIN [dbo].[Customer] AS c ON c.[CustomerID] = o.[CustomerID]
      WHERE o.[Status] = N'POSTED'
        AND o.[OrderDate] >= DATEADD(DAY,-7,GETDATE());
    sources:
      - dbo.Order
      - dbo.Customer
      - dbo.udf_FormatCurrency
      - dbo.udf_GetCustomerTier
      - dbo.udf_CalcTax
      - dbo.udf_FormatDate
      - finance.udf_ExchangeRate
    targets:
      - reporting.InvoiceSummary
  - id: fixture-update-01-alias-from
    description: 'Targeted fixture: update_01_alias_from.sql'
    sql: |-
      -- UPDATE alias pattern 01: UPDATE alias SET ... FROM schema.table AS alias
      -- extract_update_alias_target rule (priority 17)

      UPDATE a
      SET    a.Amount = a.Amount * 1.1
      FROM   [dbo].[RealTable] AS a
      WHERE  a.IsActive = 1
    sources:
      - dbo.RealTable
    targets:
      - dbo.RealTable
  - id: fixture-update-alias-01-basic
    description: 'Targeted fixture: update_alias_01_basic.sql'
    sql: |-
      -- UPDATE ALIAS Pattern 01: UPDATE alias SET ... FROM schema.table alias — regression guard for e7214ee fix
      -- This SP is a bidirectional pattern: Customer is both read (JOIN) and written (UPDATE)

      UPDATE c
      SET
          c.[TotalOrders]    = agg.[OrderCount],
          c.[TotalSpend]     = agg.[TotalAmount],
          c.[LastOrderDate]  = agg.[MaxOrderDate],
          c.[CustomerTier]   = CASE
                                  WHEN agg.[TotalAmount] >= 50000 THEN N'PLATINUM'
                                  WHEN agg.[TotalAmount] >= 10000 THEN N'GOLD'
                                  WHEN agg.[TotalAmount] >= 1000  THEN N'SILVER'
                                  ELSE N'BRONZE'
                               END,
          c.[ModifiedDate]   = GETUTCDATE()
      FROM [dbo].[Customer] AS c
      JOIN (
          SELECT
              o.[CustomerID],
              COUNT(o.[OrderID])       AS OrderCount,
              SUM(o.[TotalAmount])     AS TotalAmount,
              MAX(o.[OrderDate])       AS MaxOrderDate
          FROM [dbo].[Customer] AS cInner
          JOIN [dbo].[Order]    AS o ON o.[CustomerID] = cInner.[CustomerID]
          WHERE o.[Status] = N'COMPLETE'
          GROUP BY o.[CustomerID]
      ) AS agg ON agg.[CustomerID] = c.[CustomerID];
    sources:
      - dbo.Customer
      - dbo.Order
    targets:
      - dbo.Customer
  - id: fixture-update-alias-02-multi-join
    description: 'Targeted fixture: update_alias_02_multi_join.sql'
    sql: |-
      -- UPDATE ALIAS Pattern 02: UPDATE with multi-table JOIN, alias is not the first table in FROM
      -- OrderLine is both source (read for join) and target (written)

      UPDATE ol
      SET
          ol.[UnitPrice]      = ph.[NewPrice],
          ol.[DiscountAmount] = ol.[Quantity] * (ph.[NewPrice] - ph.[OldPrice]) * 0.1,
          ol.[LineTotal]      = ol.[Quantity] * ph.[NewPrice],
          ol.[PriceAdjusted]  = 1,
          ol.[AdjustedDate]   = GETUTCDATE()
      FROM        [dbo].[OrderLine]   AS ol
      JOIN        [dbo].[Product]     AS p   ON p.[ProductID]  = ol.[ProductID]
      JOIN        [dbo].[PriceHistory] AS ph ON ph.[ProductID] = p.[ProductID]
                                             AND ph.[EffectiveDate] = CAST(GETUTCDATE() AS DATE)
      WHERE ol.[PriceAdjusted] = 0
        AND ol.[OrderDate]     >= ph.[EffectiveDate];
    sources:
      - dbo.OrderLine
      - dbo.Product
      - dbo.PriceHistory
    targets:
      - dbo.OrderLine
  - id: fixture-update-alias-03-cte-update
    description: 'Targeted fixture: update_alias_03_cte_update.sql'
    sql: |-
      -- UPDATE ALIAS Pattern 03: UPDATE via CTE (CTE names must NOT be captured as targets)
      -- The CTE joins one base table to a GROUP BY derived table, which cannot be written through, so
      -- the write lands on the base table; the CTE name itself is never a target.

      WITH InventoryWithSales AS (
          SELECT
              inv.[ProductID],
              inv.[LocationID],
              inv.[QtyOnHand],
              inv.[ReorderLevel],
              inv.[LastUpdated],
              ISNULL(sold.[QtySold30d], 0) AS QtySold30d
          FROM [dbo].[Inventory] AS inv
          LEFT JOIN (
              SELECT [ProductID], SUM([Quantity]) AS QtySold30d
              FROM   [dbo].[SalesOrderLine]
              WHERE  [OrderDate] >= DATEADD(DAY,-30,GETDATE())
                AND  [Status] = N'SHIPPED'
              GROUP BY [ProductID]
          ) AS sold ON sold.[ProductID] = inv.[ProductID]
      )
      UPDATE InventoryWithSales
      SET    [QtyOnHand]   = [QtyOnHand] - [QtySold30d],
             [LastUpdated] = GETUTCDATE()
      WHERE  [QtyOnHand]   > 0
        AND  [QtySold30d]  > 0;
    sources:
      - dbo.Inventory
      - dbo.SalesOrderLine
    targets:
      - dbo.Inventory
    absent:
      - InventoryWithSales
      - dbo.InventoryWithSales
  - id: fixture-variable-table-01
    description: 'Targeted fixture: variable_table_01.sql'
    sql: |-
      -- VARIABLE TABLE Pattern: @tbl TABLE variables — must NOT be captured as deps
      -- @LineItems, @Discounts, @TaxRates are @table variables — must NOT appear in results

      DECLARE @LineItems TABLE (
          [OrderID]    INT,
          [ProductID]  INT,
          [Qty]        INT,
          [UnitPrice]  DECIMAL(18,2),
          [LineTotal]  DECIMAL(18,2)
      );

      DECLARE @Discounts TABLE (
          [ProductID]    INT,
          [DiscountPct]  DECIMAL(5,2)
      );

      DECLARE @TaxRates TABLE (
          [StateCode]  NVARCHAR(5),
          [Rate]       DECIMAL(5,4)
      );

      -- Populate @table vars from catalog tables
      INSERT INTO @LineItems ([OrderID],[ProductID],[Qty],[UnitPrice],[LineTotal])
      SELECT o.[OrderID], ol.[ProductID], ol.[Quantity], ol.[UnitPrice], ol.[Quantity]*ol.[UnitPrice]
      FROM   [dbo].[Order]     AS o
      JOIN   [dbo].[OrderLine] AS ol ON ol.[OrderID] = o.[OrderID]
      WHERE  o.[Status] = N'DRAFT';

      INSERT INTO @Discounts ([ProductID],[DiscountPct])
      SELECT [ProductID], [DiscountPct]
      FROM   [dbo].[Product]
      WHERE  [HasPromotion] = 1;

      -- Apply discounts (SP modifies @LineItems in-memory — no catalog dep)
      EXEC [dbo].[usp_ApplyDiscounts] @Lines = @LineItems;

      -- Write final invoice to catalog table
      INSERT INTO [dbo].[InvoiceDraft] ([OrderID],[TotalLines],[GrossAmount],[DiscountAmount],[TaxAmount],[NetAmount],[CreatedAt])
      SELECT
          li.[OrderID],
          COUNT(li.[ProductID]),
          SUM(li.[LineTotal]),
          SUM(li.[LineTotal] * ISNULL(d.[DiscountPct],0) / 100),
          0,
          SUM(li.[LineTotal] * (1 - ISNULL(d.[DiscountPct],0)/100)),
          GETUTCDATE()
      FROM @LineItems AS li
      LEFT JOIN @Discounts AS d ON d.[ProductID] = li.[ProductID]
      GROUP BY li.[OrderID];
    sources:
      - dbo.Order
      - dbo.OrderLine
      - dbo.Product
    targets:
      - dbo.InvoiceDraft
    exec:
      - dbo.usp_ApplyDiscounts
