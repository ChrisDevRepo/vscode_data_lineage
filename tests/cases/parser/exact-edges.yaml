    case_modes: [ci, cs]
    mutations: *delete_alias_mutations
    graph: *delete_alias_graph
  - id: delete-target-alias-top
    sql: "DELETE TOP (5) FROM T FROM dbo.T AS T WHERE T.ID = 1;"
    sources: [dbo.T]
    case_modes: [ci, cs]
    mutations: *delete_alias_mutations
    graph: *delete_alias_graph
  - id: delete-target-alias-quoted
    sql: "DELETE FROM [T] FROM [dbo].[T] AS [T] WHERE [T].ID = 1;"
    sources: [dbo.T]
    case_modes: [ci, cs]
    mutations: *delete_alias_mutations
    graph: *delete_alias_graph
  - id: delete-target-alias-block-comments
    sql: "DELETE /* target */ FROM T /* source */ FROM dbo.T AS T WHERE T.ID = 1;"
    sources: [dbo.T]
