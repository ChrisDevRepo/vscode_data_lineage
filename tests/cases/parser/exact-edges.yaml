  - id: unterminated-unqualified-update-before-an-aliased-update
    description: unterminated unqualified UPDATE before an aliased UPDATE
    sql: |-
      UPDATE a SET x=1 WHERE y=2
      UPDATE b SET z=1 FROM dbo.T b
    sources:
      - dbo.T
    targets:
      - dbo.T
  - id: unaliased-target-followed-by-a-transaction-or-control-flow-statement
    description: unaliased target followed by a transaction or control-flow statement
    sql: |-
      BEGIN TRAN
      UPDATE A SET c=1 FROM dbo.A
      COMMIT TRAN
      UPDATE B SET c=1 FROM dbo.B
      ROLLBACK TRAN
      UPDATE C SET c=1 FROM dbo.C
      PRINT 'x'
      UPDATE D SET c=1 FROM dbo.D
      IF @@ROWCOUNT = 0 RETURN
      UPDATE E SET c=1 FROM dbo.E
      WHILE @i < 3 BEGIN UPDATE F SET c=1 FROM dbo.F
      BREAK END
      UPDATE G SET c=1 FROM dbo.G
      GOTO done
      UPDATE H SET c=1 FROM dbo.H
      RAISERROR('x', 16, 1)
      UPDATE I SET c=1 FROM dbo.I
      WAITFOR DELAY '00:00:01'
    sources:
      - dbo.A
      - dbo.B
      - dbo.C
      - dbo.D
      - dbo.E
      - dbo.F
      - dbo.G
      - dbo.H
      - dbo.I
    targets:
      - dbo.A
      - dbo.B
      - dbo.C
      - dbo.D
      - dbo.E
      - dbo.F
      - dbo.G
      - dbo.H
      - dbo.I
  - id: unaliased-target-followed-by-a-block-end-cursor-or-session-statement
    description: unaliased target followed by a block end, cursor or session statement
    sql: |-
      IF @a = 1 BEGIN UPDATE A SET c=1 FROM dbo.A
      END ELSE UPDATE B SET c=1 FROM dbo.B
      ELSE UPDATE C SET c=1 FROM dbo.C
      RETURN
      UPDATE D SET c=1 FROM dbo.D
      DECLARE @x int
      UPDATE E SET c=1 FROM dbo.E
      SET @x = 1
      UPDATE F SET c=1 FROM dbo.F
      EXEC dbo.uspA
      UPDATE G SET c=1 FROM dbo.G
      OPEN cur
      UPDATE H SET c=1 FROM dbo.H
      FETCH NEXT FROM cur INTO @x
      UPDATE I SET c=1 FROM dbo.I
      CLOSE cur
      UPDATE J SET c=1 FROM dbo.J
      DEALLOCATE cur
    sources:
      - dbo.A
      - dbo.B
      - dbo.C
      - dbo.D
      - dbo.E
      - dbo.F
      - dbo.G
      - dbo.H
      - dbo.I
      - dbo.J
    targets:
      - dbo.A
      - dbo.B
      - dbo.C
      - dbo.D
      - dbo.E
      - dbo.F
      - dbo.G
      - dbo.H
      - dbo.I
      - dbo.J
    exec:
      - dbo.uspA
