  - id: edge-outer-apply-captures-the-table-and-the-applied-function
    description: OUTER APPLY captures the table and the applied function
    sql: SELECT * FROM [dbo].[A] OUTER APPLY [dbo].[TVF](A.id)
    sources: [dbo.a, dbo.tvf]
  - id: edge-from-separated-by-newlines
