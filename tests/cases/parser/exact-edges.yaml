    case_modes: [ci, cs]
    mutations: *delete_alias_mutations
    graph: *delete_alias_graph
  - id: delete-target-alias-linebreaks-without-as
    sql: "DELETE\nFROM T\nFROM dbo.T\tT\nWHERE T.ID = 1;"
