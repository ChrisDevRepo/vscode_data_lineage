    description: Comment markers inside an actual path literal remain part of its URL
    sql: SELECT * FROM OPENROWSET(BULK 'https://real.blob.core.windows.net/container/a/*b--c.csv', SINGLE_CLOB) AS r;
    external: [{url: https://real.blob.core.windows.net/container/a/*b--c.csv, kind: openrowset}]
  - id: comment-token-boundary-plain
    description: Comments separate SQL tokens for reads, writes and calls
    sql: SELECT * FROM/* note */dbo.Source; INSERT/* note */INTO/* note */dbo.Target SELECT 1; EXEC/* note */dbo.Callee;
    sources: [dbo.Source]
    targets: [dbo.Target]
    exec: [dbo.Callee]
  - id: comment-token-boundary-nested
    description: Comments separate SQL tokens for reads, writes and calls
    sql: >-
      SELECT * FROM/* outer /* inner */ still comment */dbo.Source; INSERT/* outer /* inner */ still comment */INTO/* outer /* inner */
      still comment */dbo.Target SELECT 1; EXEC/* outer /* inner */ still comment */dbo.Callee;
    sources: [dbo.Source]
    targets: [dbo.Target]
    exec: [dbo.Callee]
  - id: comment-token-boundary-multiline
    description: Comments separate SQL tokens for reads, writes and calls
    sql: "SELECT * FROM/* note\nFROM dbo.Ghost\r\n*/dbo.Source; INSERT/* note\nFROM dbo.Ghost\r\n*/INTO/* note\nFROM dbo.Ghost\r\n*/dbo.Target SELECT 1; EXEC/* note\nFROM dbo.Ghost\r\n*/dbo.Callee;"
    sources: [dbo.Source]
    targets: [dbo.Target]
    exec: [dbo.Callee]
  - id: comment-token-identifier-boundary
    description: Comment removal cannot join identifier and trailing alias text
    sql: SELECT * FROM dbo.Foo/* note */Bar;
    sources: [dbo.Foo]
  - id: go-between-two-source-statements
    description: A FROM after GO remains a source alongside the preceding batch source
    sql: "SELECT * FROM dbo.A\nGO\nSELECT * FROM dbo.B"
    sources: [dbo.A, dbo.B]
  - id: go-between-insert-and-source-statement
    description: A FROM after GO remains a source alongside the preceding batch target
    sql: "INSERT INTO dbo.Log(Msg) VALUES (1)\nGO\nSELECT * FROM dbo.T"
    sources: [dbo.T]
    targets: [dbo.Log]
  - id: unquoted-cetas-standalone
    description: An unquoted external table created from a SELECT retains its own source and target
    sql: CREATE EXTERNAL TABLE ext.T WITH (LOCATION='/x', DATA_SOURCE=ds, FILE_FORMAT=ff) AS SELECT * FROM dbo.S
    sources: [dbo.S]
    targets: [ext.T]
  - id: exec-bracketed-procedure-name-with-a-dot
    description: A dot inside a bracketed procedure name is part of the identifier
    sql: EXEC [dbo].[spLoad_Case4.5]
    exec: ['[dbo].[spLoad_Case4.5]']
  - id: getancestor-on-a-bracketed-unqualified-cte
    description: A mixed-bracket GetAncestor CLR call on an unqualified CTE is no reference
    sql: INNER JOIN [EMP_cte] ON [EMP_cte].[OrganizationNode].GetAncestor(1) = e.OrganizationNode
  - id: doubled-bracket-name-before-a-block-comment
    description: A doubled bracket inside a bracketed name does not swallow the comment or the statement after it
    sql: SELECT * FROM [dbo].[a]]b] /* FROM dbo.GhostTable */; INSERT INTO dbo.Dim SELECT 1;
    sources: ['[dbo].[a]]b]']
    targets: [dbo.Dim]
  - id: plain-create-table-before-an-unrelated-ctas
    description: A plain CREATE TABLE followed by an unrelated CTAS does not claim the first table
    sql: CREATE TABLE dbo.Plain (id INT); CREATE TABLE dbo.Derived WITH (DISTRIBUTION = ROUND_ROBIN) AS SELECT id FROM dbo.Src;
    sources: [dbo.Src]
    targets: [dbo.Derived]
  - id: several-sibling-ctes-are-excluded
    description: Every CTE name is excluded when several sibling CTEs are joined beside a real table
    sql: WITH A AS (SELECT 1), B AS (SELECT 2) SELECT * FROM A JOIN B ON 1=1 JOIN [dbo].[T1] ON 1=1
    sources: ['[dbo].[T1]']
