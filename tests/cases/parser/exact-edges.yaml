    sql: INSERT TOP (SELECT COUNT(*) FROM dbo.C) INTO dbo.T SELECT * FROM dbo.S; INSERT TOP ((SELECT COUNT(*) FROM dbo.D)) dbo.U SELECT * FROM dbo.S; INSERT TOP (dbo.fnN(1)) PERCENT INTO dbo.V SELECT * FROM dbo.S
