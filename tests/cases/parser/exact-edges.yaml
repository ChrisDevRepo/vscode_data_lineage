cases:
  - id: inner-left-right-full-cross-joins
    sql: SELECT * FROM dbo.A a INNER JOIN dbo.B b ON 1=1 LEFT OUTER JOIN dbo.C c ON 1=1 RIGHT JOIN dbo.D d ON 1=1 FULL JOIN dbo.E e ON 1=1 CROSS JOIN dbo.F
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E, dbo.F]
  - id: join-hints
    sql: SELECT * FROM dbo.A a INNER HASH JOIN dbo.B b ON 1=1 LEFT LOOP JOIN dbo.C c ON 1=1
    sources: [dbo.A, dbo.B, dbo.C]
  - id: parenthesised-joined-tables
    sql: SELECT * FROM (dbo.A a JOIN dbo.B b ON a.id=b.id); SELECT * FROM ((dbo.C c JOIN dbo.D d ON 1=1) LEFT JOIN dbo.E e ON 1=1); SELECT * FROM dbo.F f JOIN (dbo.G g JOIN dbo.H h ON 1=1) ON 1=1; SELECT * FROM(dbo.I i CROSS JOIN dbo.J j)
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E, dbo.F, dbo.G, dbo.H, dbo.I, dbo.J]
  - id: a-parenthesised-derived-table-or-values-list-is-not-a-table-name
    sql: SELECT * FROM (SELECT x FROM dbo.A) d JOIN (VALUES (1)) v(x) ON 1=1 JOIN ((SELECT y FROM dbo.B)) e ON 1=1
    sources: [dbo.A, dbo.B]
  - id: cross-outer-apply-of-a-tvf-and-a-subquery
    sql: SELECT * FROM dbo.A a CROSS APPLY dbo.fnRows(a.id) f OUTER APPLY (SELECT TOP 1 * FROM dbo.B b WHERE b.id=a.id) x
    sources: [dbo.A, dbo.fnRows, dbo.B]
  - id: in-exists-and-scalar-subqueries
    sql: SELECT (SELECT MAX(x) FROM dbo.C) m FROM dbo.A WHERE id IN (SELECT id FROM dbo.B) AND EXISTS (SELECT 1 FROM dbo.D)
    sources: [dbo.A, dbo.B, dbo.C, dbo.D]
  - id: nested-derived-tables
    sql: SELECT * FROM (SELECT * FROM dbo.A) d JOIN (SELECT * FROM (SELECT * FROM dbo.B) i) e ON 1=1
    sources: [dbo.A, dbo.B]
  - id: union-except-intersect
    sql: SELECT a FROM dbo.A UNION SELECT a FROM dbo.B EXCEPT SELECT a FROM dbo.C INTERSECT SELECT a FROM dbo.D
    sources: [dbo.A, dbo.B, dbo.C, dbo.D]
  - id: ansi-89-comma-list
    sql: SELECT * FROM dbo.A a, dbo.B b, dbo.C c WHERE a.id=b.id
    sources: [dbo.A, dbo.B, dbo.C]
  - id: ansi-89-comma-list-with-a-derived-table-as-middle-member
    sql: SELECT * FROM dbo.A a, (SELECT x FROM dbo.B) d, dbo.C c WHERE a.id=c.id
    sources: [dbo.A, dbo.B, dbo.C]
  - id: ansi-89-comma-list-with-a-table-valued-function-as-middle-member
    sql: SELECT * FROM dbo.A a, dbo.fnRows(1, 2) f, dbo.C c
    sources: [dbo.A, dbo.fnRows, dbo.C]
  - id: ansi-89-comma-list-with-openrowset-as-middle-member
    sql: SELECT * FROM dbo.A a, OPENROWSET(BULK 'f.csv', SINGLE_CLOB) r, dbo.C c
    sources: [dbo.A, dbo.C]
  - id: ansi-89-comma-list-with-a-with-nolock-hint-on-a-member
    sql: SELECT * FROM dbo.A a WITH (NOLOCK), dbo.B b WITH (NOLOCK, INDEX(ix1)), dbo.C c
    sources: [dbo.A, dbo.B, dbo.C]
  - id: ansi-89-comma-list-keeps-window-and-output-as-alias-or-schema
    sql: SELECT * FROM dbo.A AS window, dbo.B b; SELECT * FROM output.T o, dbo.C c
    sources: [dbo.A, dbo.B, output.T, dbo.C]
  - id: ansi-89-comma-list-ends-at-its-clause-commas-of-later-clauses-and
    description: ANSI-89 comma list ends at its clause; commas of later clauses and nested calls are no members
    sql: SELECT * FROM dbo.A a, dbo.B b WHERE a.id IN (SELECT id FROM dbo.C c, dbo.D d) GROUP BY a.x, b.y ORDER BY a.x, COALESCE(a.y, 0)
    sources: [dbo.A, dbo.B, dbo.C, dbo.D]
  - id: a-deleted-row-output-list-is-no-comma-list-of-tables
    sql: DELETE FROM dbo.T OUTPUT deleted.a, deleted.b INTO dbo.L
    sources: [dbo.T]
    targets: [dbo.L]
  - id: pivot-and-unpivot
    sql: SELECT * FROM (SELECT k, v FROM dbo.A) s PIVOT (SUM(v) FOR k IN ([x],[y])) p; SELECT * FROM dbo.B UNPIVOT (v FOR k IN (c1, c2)) u
    sources: [dbo.A, dbo.B]
  - id: top-and-window-functions
    sql: SELECT TOP (10) PERCENT a, ROW_NUMBER() OVER (PARTITION BY b ORDER BY c) rn FROM dbo.A
    sources: [dbo.A]
  - id: table-hints-option-tablesample-and-temporal-for-system-time
    sql: SELECT * FROM dbo.A WITH (NOLOCK) JOIN dbo.B b (NOLOCK) ON 1=1 JOIN dbo.C WITH (INDEX(ix1), FORCESEEK) ON 1=1 OPTION (RECOMPILE, LABEL = 'x'); SELECT * FROM dbo.D TABLESAMPLE (10 PERCENT); SELECT * FROM dbo.E FOR SYSTEM_TIME AS OF '2020-01-01'
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E]
  - id: nested-bracketed-and-three-part-parenthesised-joined-tables-also-inside
    description: nested, bracketed and three-part parenthesised joined tables, also inside INSERT ... SELECT
    sql: SELECT * FROM (((dbo.A a JOIN dbo.B b ON 1=1))); SELECT * FROM ( dbo.C c LEFT JOIN ( dbo.D d JOIN dbo.E e ON 1=1 ) ON 1=1 ); SELECT * FROM ([dbo].[F] f JOIN [dbo].[G] g ON 1=1); SELECT * FROM (OtherDb.dbo.H h JOIN dbo.I i ON 1=1); INSERT INTO dbo.T SELECT * FROM (dbo.J j JOIN dbo.K k ON 1=1)
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E, dbo.F, dbo.G, dbo.I, dbo.J, dbo.K]
    targets: [dbo.T]
    cross_db_sources: [otherdb.dbo.h]
  - id: values-constructor-openjson-string-split-and-xml-nodes-are-not-catalog
    description: VALUES constructor, OPENJSON, STRING_SPLIT and XML nodes are not catalog objects
    sql: SELECT * FROM (VALUES (1)) v(x) JOIN dbo.A a ON 1=1 CROSS APPLY OPENJSON(a.js) WITH (x int) j CROSS APPLY STRING_SPLIT(@s, ',') s CROSS APPLY a.doc.nodes('/r') t(n)
    sources: [dbo.A]
  - id: the-from-of-is-not-distinct-from-and-of-trim-names-no-table
    sql: SELECT * FROM dbo.T t WHERE t.a IS DISTINCT FROM (t.b) AND t.c IS NOT DISTINCT FROM t.d; SELECT TRIM('x' FROM (u.name)), TRIM(LEADING u.pad FROM u.name), TRIM(BOTH CHAR(9) FROM u.code) FROM dbo.U u
    sources: [dbo.T, dbo.U]
  - id: a-variable-named-distinct-before-from-leaves-the-from-clause-intact
    sql: SELECT o.id, @distinct FROM dbo.Orders o JOIN dbo.Lines l ON l.id = o.id; SELECT @trim, x FROM dbo.M
    sources: [dbo.Orders, dbo.Lines, dbo.M]
  - id: ansi-89-comma-list-continues-after-a-pivot-or-unpivot-clause
    sql: SELECT * FROM dbo.A a PIVOT (SUM(a.v) FOR a.k IN ([x],[y])) p, dbo.B b; SELECT * FROM dbo.C UNPIVOT (v FOR k IN (c1, c2)) u, dbo.D d, dbo.E
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E]
  - id: a-join-or-cross-apply-after-a-pivot-clause-keeps-both-reads
    sql: SELECT * FROM dbo.A PIVOT (SUM(v) FOR k IN ([x])) AS p JOIN dbo.C c ON 1=1; SELECT * FROM dbo.F PIVOT (SUM(v) FOR k IN ([x])) q CROSS APPLY dbo.fn(q.x) f
    sources: [dbo.A, dbo.C, dbo.F, dbo.fn]
  - id: grant-deny-and-revoke-on-an-object-with-or-without-a-column-list-move
    description: GRANT, DENY and REVOKE on an object, with or without a column list, move no data
    sql: GRANT SELECT ON dbo.T (c1, c2) TO u1; GRANT SELECT ON dbo.T(c1) TO u1, u2; GRANT SELECT, UPDATE (c3) ON dbo.U (c1) TO u1; DENY UPDATE ON dbo.V (c1) TO u1; REVOKE SELECT ON OBJECT::dbo.W (c1) FROM u1; GRANT EXECUTE ON dbo.usp_X TO u1;
  - id: update-through-a-cte-that-joins-writes-no-target-both-tables-are-read
    sql: ;WITH c AS (SELECT i.Qty, s.Delta FROM dbo.Inventory i JOIN dbo.Shipments s ON s.ItemID = i.ItemID) UPDATE c SET Qty = Qty + Delta;
    sources: [dbo.Inventory, dbo.Shipments]
  - id: update-through-a-single-table-cte-writes-that-table-delete-through-it
    description: UPDATE through a single-table CTE writes that table; DELETE through it only reads
    sql: ;WITH c AS (SELECT * FROM dbo.Inventory WHERE x=1) UPDATE c SET Qty = 0; ;WITH d AS (SELECT * FROM dbo.Old) DELETE FROM d; ;WITH e AS (SELECT * FROM dbo.Gone) DELETE e;
    sources: [dbo.Inventory, dbo.Old, dbo.Gone]
    targets: [dbo.Inventory]
  - id: a-revoke-deny-principal-list-is-no-comma-list-of-tables
    sql: REVOKE SELECT ON dbo.T FROM u1, u2; DENY SELECT ON dbo.T TO u1; REVOKE EXECUTE FROM u1, u2;
  - id: ansi-89-comma-lists-after-distinct-from-trim-from-and-datediff-in-the
    description: ANSI-89 comma lists after DISTINCT FROM, TRIM(... FROM) and DATEDIFF in the select list
    sql: SELECT IIF(a.x IS DISTINCT FROM b.y, 1, 0), c.z FROM dbo.A a, dbo.B b, dbo.C c; SELECT TRIM(' ' FROM a.n), DATEDIFF(day, a.d, b.d) FROM dbo.D a, dbo.E b
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E]
  - id: ansi-89-comma-list-with-a-hinted-member-and-an-aliased-member-with-a
    description: ANSI-89 comma list with a hinted member and an aliased member with a nested INDEX hint
    sql: SELECT * FROM dbo.A a WITH (NOLOCK), dbo.B AS b WITH (INDEX(ix1), NOLOCK), dbo.C
    sources: [dbo.A, dbo.B, dbo.C]
  - id: ansi-89-comma-list-with-a-derived-table-whose-own-from-is-a-comma-list
    sql: SELECT * FROM dbo.A a, (SELECT id FROM dbo.B, dbo.C) d, dbo.D
    sources: [dbo.A, dbo.B, dbo.C, dbo.D]
  - id: update-alias-target-with-an-ansi-89-comma-list-in-from
    sql: UPDATE a SET a.x = b.x FROM dbo.A a, dbo.B b WHERE a.id = b.id
    sources: [dbo.A, dbo.B]
    targets: [dbo.A]
  - id: a-inside-a-string-a-line-comment-or-a-block-comment-opens-no-bracket
    description: a [ inside a string, a line comment or a block comment opens no bracket name
    sql: |-
      SELECT '[' + a.n FROM dbo.A a, dbo.B b; -- see [dbo.X
      SELECT * FROM dbo.C; /* see [dbo.Y */
      SELECT * FROM dbo.D
    sources: [dbo.A, dbo.B, dbo.C, dbo.D]
  - id: an-unterminated-after-a-valid-statement-keeps-that-statement-s-source
    sql: SELECT * FROM dbo.A; SELECT [oops FROM dbo.B
    sources: [dbo.A]
  - id: glued-update-dbo-t-set-with-from-dbo-s-s
    sql: UPDATE[dbo].[T]SET x=1 FROM[dbo].[S][s]
    sources: [dbo.S]
    targets: [dbo.T]
  - id: openquery-and-openrowset-invent-no-edge
    sql: SELECT * FROM OPENQUERY(LinkSrv, 'SELECT * FROM dbo.Remote') q JOIN OPENROWSET(BULK 'https://h/f.parquet', FORMAT='PARQUET') r ON 1=1 JOIN dbo.A a ON 1=1
    sources: [dbo.A]
  - id: multiple-ctes-feeding-an-insert
    sql: WITH c1 AS (SELECT * FROM dbo.A), c2 AS (SELECT * FROM c1 JOIN dbo.B ON 1=1) INSERT INTO dbo.T SELECT * FROM c2
    sources: [dbo.A, dbo.B]
    targets: [dbo.T]
  - id: recursive-cte-into-select-into
    sql: WITH r AS (SELECT id FROM dbo.A UNION ALL SELECT a.id FROM dbo.A a JOIN r ON r.id=a.pid) SELECT * INTO dbo.T FROM r
    sources: [dbo.A]
    targets: [dbo.T]
  - id: cte-name-shadowing-a-real-table
    sql: WITH Orders AS (SELECT * FROM dbo.Orders) SELECT * FROM Orders
    sources: [dbo.Orders]
  - id: update-through-a-cte-writes-its-base-table
    sql: WITH c AS (SELECT * FROM dbo.T WHERE x=1) UPDATE c SET x=2
    sources: [dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-joined-to-a-source
    sql: WITH c AS (SELECT * FROM dbo.T) UPDATE c SET x=s.x FROM c JOIN dbo.S s ON s.id=c.id
    sources: [dbo.T, dbo.S]
    targets: [dbo.T]
  - id: a-cte-joined-into-the-update-under-an-alias-writes-its-base-table
    sql: WITH c AS (SELECT * FROM dbo.T) UPDATE x SET v=s.v FROM dbo.S s JOIN c x ON x.id=s.id
    sources: [dbo.T, dbo.S]
    targets: [dbo.T]
  - id: update-through-a-cte-with-a-table-hint-writes-its-base-table
    sql: WITH c AS (SELECT * FROM dbo.T) UPDATE c WITH (ROWLOCK) SET x=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: with-xmlnamespaces-before-the-cte-list
    sql: WITH XMLNAMESPACES ('u' AS ns), c AS (SELECT * FROM dbo.T) UPDATE c SET x=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: chained-ctes-and-a-bracketed-cte-name-resolve-to-the-base-table
    sql: WITH a AS (SELECT * FROM dbo.T), b AS (SELECT * FROM a WHERE x=1) UPDATE b SET x=2; WITH [c] AS (SELECT * FROM [dbo].[U]) UPDATE [c] SET x=1
    sources: [dbo.T, dbo.U]
    targets: [dbo.T, dbo.U]
  - id: update-of-an-alias-bound-to-a-cte-in-from
    sql: WITH c AS (SELECT * FROM dbo.T) UPDATE x SET v=1 FROM c x
    sources: [dbo.T]
    targets: [dbo.T]
  - id: cte-with-top-order-by-a-window-function-and-table-hints
    sql: WITH c AS (SELECT TOP (10) * FROM dbo.T ORDER BY id) UPDATE c SET x=1; WITH d AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY a ORDER BY b) rn FROM dbo.U WITH (UPDLOCK, READPAST)) UPDATE d SET x=rn WHERE rn=1
    sources: [dbo.T, dbo.U]
    targets: [dbo.T, dbo.U]
  - id: an-unqualified-or-temp-table-in-a-cte-writes-nothing
    sql: 'WITH c AS (SELECT * FROM T) UPDATE c SET x=1; WITH d AS (SELECT * FROM #t) UPDATE d SET x=1'
  - id: a-three-part-name-in-a-cte-is-a-cross-database-read-and-write
    sql: WITH c AS (SELECT * FROM OtherDb.dbo.T) UPDATE c SET x=1
    cross_db_sources: [otherdb.dbo.t]
    cross_db_targets: [otherdb.dbo.t]
  - id: self-referencing-and-mutually-recursive-ctes-terminate-and-write-nothing
    sql: WITH c AS (SELECT * FROM c) UPDATE c SET x=1; WITH a AS (SELECT * FROM b), b AS (SELECT * FROM a) UPDATE b SET x=1
  - id: delete-through-a-cte-reads-its-base-table-and-marks-no-write-known
    description: DELETE through a CTE reads its base table and marks no write (known boundary)
    sql: WITH c AS (SELECT * FROM dbo.T) DELETE FROM c WHERE x=1
    sources: [dbo.T]
  - id: insert-through-a-cte-resolves-no-write-target-known-boundary
    sql: WITH c AS (SELECT a FROM dbo.T) INSERT INTO c (a) SELECT a FROM dbo.S
    sources: [dbo.T, dbo.S]
  - id: merge-into-a-cte-resolves-no-write-target-known-boundary
    sql: WITH c AS (SELECT * FROM dbo.T WHERE p=1) MERGE c AS t USING dbo.S s ON t.id=s.id WHEN MATCHED THEN DELETE;
    sources: [dbo.T, dbo.S]
  - id: cte-as-merge-source
    sql: WITH s AS (SELECT * FROM dbo.S) MERGE dbo.T t USING s ON t.id=s.id WHEN MATCHED THEN DELETE;
    sources: [dbo.S]
    targets: [dbo.T]
  - id: a-later-insert-into-a-table-named-like-an-earlier-cte-writes-no-cte
    description: a later INSERT into a table named like an earlier CTE writes no CTE source
    sql: WITH Stage AS (SELECT * FROM dbo.Src) SELECT * FROM Stage; INSERT INTO Stage SELECT * FROM dbo.X
    sources: [dbo.Src, dbo.X]
  - id: a-later-merge-into-a-table-named-like-an-earlier-cte-writes-no-cte
    description: a later MERGE into a table named like an earlier CTE writes no CTE source
    sql: WITH Stage AS (SELECT * FROM dbo.Src) SELECT * FROM Stage; MERGE Stage AS t USING dbo.X s ON t.id=s.id WHEN MATCHED THEN DELETE;
    sources: [dbo.Src, dbo.X]
  - id: merge-into-a-joining-cte-writes-no-single-table
    sql: WITH c AS (SELECT * FROM dbo.A a JOIN dbo.B b ON a.id=b.id) MERGE c AS t USING dbo.S s ON t.id=s.id WHEN MATCHED THEN DELETE;
    sources: [dbo.A, dbo.B, dbo.S]
  - id: update-through-a-cte-over-a-derived-table-writes-its-base-table
    sql: WITH c AS (SELECT * FROM (SELECT * FROM dbo.T) d) UPDATE c SET x=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-filtered-by-a-subquery-writes-the-cte-base-table
    sql: WITH c AS (SELECT * FROM dbo.T WHERE id IN (SELECT id FROM dbo.S)) UPDATE c SET x=1
    sources: [dbo.T, dbo.S]
    targets: [dbo.T]
  - id: update-through-a-cte-filtered-by-is-distinct-from-writes-its-base-table
    sql: WITH c AS (SELECT x FROM dbo.T WHERE a IS DISTINCT FROM b) UPDATE c SET x=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-with-a-column-list-writes-its-base-table
    sql: WITH c (a) AS (SELECT a FROM dbo.T) UPDATE c SET a=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-with-a-select-list-subquery-writes-the-outer-table
    sql: WITH c AS (SELECT x, (SELECT MAX(v) FROM dbo.Y) m FROM dbo.X) UPDATE c SET x=1
    sources: [dbo.X, dbo.Y]
    targets: [dbo.X]
  - id: update-through-a-joining-cte-writes-no-single-table
    sql: WITH c AS (SELECT a.x, b.y FROM dbo.A a JOIN dbo.B b ON a.id=b.id) UPDATE c SET y=1
    sources: [dbo.A, dbo.B]
  - id: update-through-a-cte-joining-one-table-to-a-group-by-derived-table
    description: UPDATE through a CTE joining one table to a GROUP BY derived table writes that table
    sql: WITH c AS (SELECT t.x, g.n FROM dbo.T t LEFT JOIN (SELECT id, COUNT(*) n FROM dbo.S GROUP BY id) g ON g.id=t.id) UPDATE c SET x=n
    sources: [dbo.S, dbo.T]
    targets: [dbo.T]
    graph:
      tables: [dbo.T, dbo.S]
      metadata: [dbo.T, dbo.S]
      edges:
        - {source: "[dbo].[S]", target: "[gen].[Subject]", type: body}
        - {source: "[dbo].[T]", target: "[gen].[Subject]", type: body}
        - {source: "[gen].[Subject]", target: "[dbo].[T]", type: body}
  - id: update-through-a-cte-joining-a-distinct-derived-table-to-one-table
    description: UPDATE through a CTE joining a DISTINCT derived table to one table writes that table
    sql: WITH c AS (SELECT t.x FROM (SELECT DISTINCT id FROM dbo.S) d JOIN dbo.T t ON t.id=d.id) UPDATE c SET x=1
    sources: [dbo.S, dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-joining-one-table-to-a-union-derived-table-writes
    description: UPDATE through a CTE joining one table to a UNION derived table writes that table
    sql: WITH c AS (SELECT t.x FROM dbo.T t JOIN (SELECT id FROM dbo.S UNION ALL SELECT id FROM dbo.R) d ON d.id=t.id) UPDATE c SET x=1
    sources: [dbo.R, dbo.S, dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-joining-one-table-to-a-writable-derived-table
    description: UPDATE through a CTE joining one table to a writable derived table writes no single table
    sql: WITH c AS (SELECT t.x, d.y FROM dbo.T t JOIN (SELECT id, y FROM dbo.S) d ON d.id=t.id) UPDATE c SET y=1
    sources: [dbo.S, dbo.T]
  - id: update-through-a-cte-joining-one-table-to-a-top-derived-table-writes-no
    description: UPDATE through a CTE joining one table to a TOP derived table writes no single table
    sql: WITH c AS (SELECT t.x, d.y FROM dbo.T t JOIN (SELECT TOP 1 id, y FROM dbo.S ORDER BY id) d ON d.id=t.id) UPDATE c SET y=2
    sources: [dbo.S, dbo.T]
  - id: update-through-a-cte-joining-a-table-function-to-a-group-by-derived
    description: UPDATE through a CTE joining a table function to a GROUP BY derived table writes no single table
    sql: WITH c AS (SELECT f.x FROM dbo.F(1) f JOIN (SELECT id FROM dbo.S GROUP BY id) g ON g.id=f.id) UPDATE c SET x=1
    sources: [dbo.F, dbo.S]
  - id: update-through-a-cte-whose-derived-member-is-aliased-window-joined-to
    description: UPDATE through a CTE whose derived member is aliased window, joined to two tables, writes no single table
    sql: WITH c AS (SELECT t.x, u.z FROM dbo.T t JOIN (SELECT DISTINCT id FROM dbo.S) AS window ON window.id=t.id JOIN dbo.U u ON u.id=t.id) UPDATE c SET z=99
    sources: [dbo.S, dbo.T, dbo.U]
  - id: update-through-a-cte-joining-a-table-aliased-window-to-a-second-table
    description: UPDATE through a CTE joining a table aliased window to a second table writes no single table
    sql: WITH c AS (SELECT u.z FROM dbo.T AS window JOIN dbo.U u ON u.id=window.id) UPDATE c SET z=1
    sources: [dbo.T, dbo.U]
  - id: update-through-a-cte-with-a-window-clause-over-one-table-writes-that
    description: UPDATE through a CTE with a WINDOW clause over one table writes that table
    sql: WITH c AS (SELECT t.x, SUM(t.x) OVER w AS total FROM dbo.T t WINDOW w AS (PARTITION BY t.id)) UPDATE c SET x=1
    sources: [dbo.T]
    targets: [dbo.T]
  - id: update-through-a-cte-listing-one-table-and-a-distinct-derived-table
    description: UPDATE through a CTE listing one table and a DISTINCT derived table with a comma writes that table
    sql: WITH c AS (SELECT t.x FROM dbo.T t, (SELECT DISTINCT id FROM dbo.S) d WHERE d.id=t.id) UPDATE c SET x=1
    sources: [dbo.S, dbo.T]
    targets: [dbo.T]
  - id: update-through-a-comma-joining-cte-writes-no-single-table
    sql: WITH c AS (SELECT a.x, b.y FROM dbo.A a, dbo.B b WHERE a.id=b.id) UPDATE c SET y=1
    sources: [dbo.A, dbo.B]
  - id: update-through-a-union-cte-writes-no-single-table
    sql: WITH c AS (SELECT * FROM dbo.A UNION ALL SELECT * FROM dbo.B) UPDATE c SET x=1
