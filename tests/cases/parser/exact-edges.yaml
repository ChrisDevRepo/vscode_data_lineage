    description: MERGE INTO captures the target and the USING source
    sql: MERGE INTO [dbo].[Target] USING [dbo].[Source] ON 1=1 WHEN NOT MATCHED THEN INSERT(col) VALUES(1);
    sources: [dbo.source]
    targets: [dbo.target]
  - id: edge-select-into-captures-the-new-table-as-a-target
