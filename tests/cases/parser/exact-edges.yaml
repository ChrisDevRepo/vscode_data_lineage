      ELSE UPDATE C SET c=1 FROM dbo.C
      RETURN
      UPDATE D SET c=1 FROM dbo.D
      DECLARE @x int
      UPDATE E SET c=1 FROM dbo.E
      SET @x = 1
      UPDATE F SET c=1 FROM dbo.F
      EXEC dbo.uspA
      UPDATE G SET c=1 FROM dbo.G
      OPEN cur
      UPDATE H SET c=1 FROM dbo.H
      FETCH NEXT FROM cur INTO @x
      UPDATE I SET c=1 FROM dbo.I
      CLOSE cur
      UPDATE J SET c=1 FROM dbo.J
      DEALLOCATE cur
    sources: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E, dbo.F, dbo.G, dbo.H, dbo.I, dbo.J]
    targets: [dbo.A, dbo.B, dbo.C, dbo.D, dbo.E, dbo.F, dbo.G, dbo.H, dbo.I, dbo.J]
    exec: [dbo.uspA]
