    description: An unaliased UPDATE table remains resolvable before cross-apply
    sql: UPDATE Target SET col = 1 FROM dbo.Target CROSS APPLY dbo.Other(Target.id) f
    sources: [dbo.Target, dbo.Other]
    targets: [dbo.Target]
  - id: update-boundary-reserved-alias
    description: A bracketed reserved word remains a valid UPDATE alias
    sql: UPDATE [left] SET col = 1 FROM dbo.Target [left] JOIN dbo.Other o ON o.id = [left].id
