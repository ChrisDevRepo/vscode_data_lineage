  - id: fixture-apply-02-outer-apply
    description: 'Targeted fixture: apply_02_outer_apply.sql'
    sql: |-
      -- CROSS/OUTER APPLY Pattern 02: OUTER APPLY — preserves rows with no TVF match

      INSERT INTO [dbo].[CustomerActivity] (
          [CustomerID],
          [CustomerName],
