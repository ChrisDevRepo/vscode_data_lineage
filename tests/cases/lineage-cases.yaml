# One catalog. The scripted, headless, Electron, and Playwright runners each loop
# the rows tagged for them. Prompts, commands, and expected results live only here.
# Scripted rows test backend contracts with supplied mappings, not model inference.
# Rows with contract: stored-arrival share the producer/table/receiver fixture.
# Host expect fields are graph, phase, and terminal (turn outcome ok, error, or cancelled).
# Prompt sentences are not scripted rows.
cases:
  # Shared topology/expectations exercise the same command in both modes.
  - id: self-prune-unvisited-diamond
    story: Removing current cuts both unvisited arms, their join and the tail after the diamond.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    route: inherited
    graph:
      edges: [[Origin, Current], [Current, Left], [Current, Right], [Left, Join], [Right, Join], [Join, Tail]]
    expect:
      eligible: true
      unvisited: [Left, Right, Join, Tail]
      pruned: ["[d].[Current]", "[d].[Join]", "[d].[Left]", "[d].[Right]", "[d].[Tail]"]
      inspected: []
      kept: [Origin]
      edges: []

  - id: self-prune-diamond-with-live-bypass
    story: Current and its exclusive arms leave, while the sibling bypass retains the join and its tail.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    route: inherited
    graph:
      edges: [[Origin, Current], [Origin, Sibling], [Current, Left], [Current, Right], [Left, Join], [Right, Join], [Sibling, Join], [Join, Tail]]
    expect:
      eligible: true
      unvisited: [Left, Right, Sibling, Join, Tail]
      pruned: ["[d].[Current]", "[d].[Left]", "[d].[Right]"]
      inspected: [Sibling, Join, Tail]
      kept: [Origin, Sibling, Join, Tail]
      edges: [[Origin, Sibling], [Sibling, Join], [Join, Tail]]

  - id: self-prune-two-unvisited-diamonds
    story: A cut before two consecutive diamonds removes both joins and every exclusive unvisited continuation.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    route: inherited
    graph:
      edges: [[Origin, Current], [Current, Left], [Current, Right], [Left, Join], [Right, Join], [Join, LowerLeft], [Join, LowerRight], [LowerLeft, FinalJoin], [LowerRight, FinalJoin], [FinalJoin, Tail]]
    expect:
      eligible: true
      unvisited: [Left, Right, Join, LowerLeft, LowerRight, FinalJoin, Tail]
      pruned: ["[d].[Current]", "[d].[FinalJoin]", "[d].[Join]", "[d].[Left]", "[d].[LowerLeft]", "[d].[LowerRight]", "[d].[Right]", "[d].[Tail]"]
      inspected: []
      kept: [Origin]
      edges: []

  - id: upstream-self-prune-unvisited-diamond
    story: An unrelated writer is removed along with both exclusive upstream arms, their common source and its source.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    direction: upstream
    route: inherited
    graph:
      edges: [[Current, Origin], [Left, Current], [Right, Current], [Join, Left], [Join, Right], [Tail, Join]]
    expect:
      eligible: true
      unvisited: [Left, Right, Join, Tail]
      pruned: ["[d].[Current]", "[d].[Join]", "[d].[Left]", "[d].[Right]", "[d].[Tail]"]
      inspected: []
      kept: [Origin]
      edges: []

  - id: passthrough-self-prune-exclusive-tail
    story: An irrelevant reader removes itself and its unvisited exclusive tail.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    route: inherited
    graph:
      edges: [[Origin, Current], [Current, Tail]]
    expect: &exclusive_tail_expect
      eligible: true
      unvisited: [Tail]
      pruned: ["[d].[Current]", "[d].[Tail]"]
      inspected: []
      kept: [Origin]
      edges: []

  - id: upstream-passthrough-writer-self-prune
    story: An unrelated writer removes itself and its exclusive upstream source.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    direction: upstream
    route: inherited
    graph:
      edges: [[Current, Origin], [Tail, Current]]
    expect: *exclusive_tail_expect

  - id: passthrough-self-prune-shared-descendant
    story: A sibling still supports the unvisited shared descendant after current is removed.
    runners: [scripted]
    contract: self-prune
    mode: [bb, ct]
    route: inherited
    graph:
      edges: [[Origin, Current], [Current, Tail], [Origin, Sibling], [Sibling, Tail]]
    expect:
      eligible: true
      unvisited: [Sibling, Tail]
      pruned: ["[d].[Current]"]
      inspected: [Sibling, Tail]
      kept: [Origin, Sibling, Tail]
      edges: [[Origin, Sibling], [Sibling, Tail]]

  - id: bb-authored-question-cannot-self-prune
    story: A directly analyzed route offers no self-prune command.
    runners: [scripted]
    contract: self-prune
    mode: bb
    route: authored
    graph:
      edges: [[Origin, Current], [Current, Tail]]
    expect: { eligible: false, pruned: [] }

  - id: bb-origin-cannot-self-prune
    story: The approved origin cannot remove itself.
    runners: [scripted]
    contract: self-prune
    mode: bb
    route: root
    graph:
      edges: [[Origin, Current], [Current, Tail]]
    expect: { eligible: false, pruned: [] }

  - id: bb-authored-question-after-passthrough-can-self-prune
    story: An explicit question does not block whole-node pruning after passthrough routing.
    runners: [scripted]
    contract: self-prune
    mode: bb
    route: authored
    through_storage: true
    graph:
      edges: [[Origin, Current], [Current, Tail]]
    expect: *exclusive_tail_expect

  - id: ct-accepted-terminal-cannot-self-prune
    story: A mapped endpoint that is final stays in the trace.
    runners: [scripted]
    contract: self-prune
    mode: ct
    route: mapped
    graph:
      edges: [[Current, Origin], [Tail, Current]]
    expect: { eligible: false, pruned: [] }

  - id: ct-mapped-node-after-passthrough-cannot-self-prune
    story: Whole-node pruning after passthrough is refused while a committed column mapping names the node.
    runners: [scripted]
    contract: self-prune
    mode: ct
    route: mapped
    through_storage: true
    graph:
      edges: [[Current, Origin], [Tail, Current]]
    expect: { eligible: false, pruned: [] }

  - id: ct-function-obligation-cannot-self-prune
    story: A direct function investigation without passthrough offers no self-prune command.
    runners: [scripted]
    contract: self-prune
    mode: ct
    route: function
    graph:
      edges: [[Current, Origin]]
    expect: { eligible: false, pruned: [] }

  - id: bb-merged-direct-and-storage-arrival-cannot-self-prune
    story: A direct authored arrival protects a node even when storage also forwards a candidate.
    runners: [scripted]
    contract: self-prune
    mode: bb
    route: mixed
    graph:
      edges: [[Origin, Left], [Origin, Right], [Left, Current], [Right, Current], [Current, Tail]]
    expect: { eligible: false, unvisited: [Tail], pruned: [] }

  - id: ct-held-mapping-after-passthrough-can-self-prune
    story: Whole-node pruning after passthrough clears held findings and cuts the unvisited tail.
    runners: [scripted]
    contract: self-prune
    mode: ct
    route: held-mapping
    graph:
      edges: [[Origin, Current], [Current, Tail]]
    expect: *exclusive_tail_expect

  - id: bb-cycle-after-passthrough-can-self-prune
    story: Current is cut while the independent origin route keeps the unvisited sibling in the cycle.
    runners: [scripted]
    contract: self-prune
    mode: bb
    route: pending-sender
    graph:
      edges: [[Origin, Current], [Origin, Sibling], [Current, Sibling], [Sibling, Current], [Current, Tail]]
    expect: { eligible: true, unvisited: [Sibling, Tail], pruned: ["[d].[Current]", "[d].[Tail]"], inspected: [Sibling], kept: [Origin, Sibling], edges: [[Origin, Sibling]] }

  - id: ct-function-after-passthrough-can-self-prune
    story: A scalar function reached through passthrough uses the same whole-node prune command.
    runners: [scripted]
    contract: self-prune
    mode: ct
    route: function
    through_storage: true
    graph:
      edges: [[Current, Origin]]
    expect: { eligible: true, unvisited: [], pruned: ["[d].[Current]"], inspected: [], kept: [Origin], edges: [] }

  - id: ct-stored-procedure-all-used
    runners: [scripted]
    contract: stored-arrival
    receiver_type: procedure
    sql: INSERT d.Sink(ResultX,ResultY) SELECT X,Y FROM d.Stored;
    receiver_columns: []
    sink_columns: [ResultX, ResultY]
    column_flow:
      - { out_node: "[d].[Sink]", out_col: ResultX, upstream_columns: [{ node: "[d].[Stored]", col: X }] }
      - { out_node: "[d].[Sink]", out_col: ResultY, upstream_columns: [{ node: "[d].[Stored]", col: Y }] }
    expect:
      mapped_inputs: [X, Y]
      receiver_rows: [X, ResultX, Y, ResultY]
      sink_mode: ct
      sink_columns: [ResultX, ResultY]

  - id: ct-stored-procedure-one-unused
    runners: [scripted]
    contract: stored-arrival
    receiver_type: procedure
    sql: INSERT d.Sink(ResultX) SELECT X FROM d.Stored;
    receiver_columns: []
    sink_columns: [ResultX]
    column_flow:
      - { out_node: "[d].[Sink]", out_col: ResultX, upstream_columns: [{ node: "[d].[Stored]", col: X }] }
    expect:
      mapped_inputs: [X]
      receiver_rows: [X, ResultX]
      sink_mode: ct
      sink_columns: [ResultX]

  - id: ct-stored-procedure-all-unused
    runners: [scripted]
    contract: stored-arrival
    receiver_type: procedure
    sql: INSERT d.Sink(Unrelated) SELECT 42 FROM d.Stored;
    receiver_columns: []
    sink_columns: [Unrelated]
    column_flow: []
    expect:
      mapped_inputs: []
      receiver_rows: []
      sink_mode: bb
      sink_columns: []

  - id: ct-stored-view-all-used
    runners: [scripted]
    contract: stored-arrival
    receiver_type: view
    sql: CREATE VIEW d.Receiver AS SELECT X AS ResultX,Y AS ResultY FROM d.Stored;
    receiver_columns: [ResultX, ResultY]
    sink_columns: [ResultX, ResultY]
    column_flow:
      - { out_col: ResultX, upstream_columns: [{ node: "[d].[Stored]", col: X }] }
      - { out_col: ResultY, upstream_columns: [{ node: "[d].[Stored]", col: Y }] }
    expect:
      mapped_inputs: [X, Y]
      receiver_rows: [ResultX, ResultY]
      sink_mode: ct
      sink_columns: [ResultX, ResultY]

  - id: ct-stored-view-one-unused
    runners: [scripted]
    contract: stored-arrival
    receiver_type: view
    sql: CREATE VIEW d.Receiver AS SELECT X AS ResultX FROM d.Stored;
    receiver_columns: [ResultX]
    sink_columns: [ResultX]
    column_flow:
      - { out_col: ResultX, upstream_columns: [{ node: "[d].[Stored]", col: X }] }
    expect:
      mapped_inputs: [X]
      receiver_rows: [ResultX]
      sink_mode: ct
      sink_columns: [ResultX]

  - id: ct-stored-view-all-unused
    runners: [scripted]
    contract: stored-arrival
    receiver_type: view
    sql: CREATE VIEW d.Receiver AS SELECT 42 AS Unrelated FROM d.Stored;
    receiver_columns: [Unrelated]
    sink_columns: [Unrelated]
    column_flow: []
    expect:
      mapped_inputs: []
      receiver_rows: []
      sink_mode: bb
      sink_columns: []

  - id: ct-literal-not-a-column
    runners: [scripted]
    active: [Currency]
    nodes:
      - { id: rpt, type: view, columns: [Currency] }
      - { id: fx, type: view, columns: [Rate] }
      - { id: bare, type: view, columns: [] }
    focus: rpt
    out: Currency
    direction: upstream
    matrix:
      - { node: fx, col: "'EUR'" }
      - { node: fx, col: "N'EUR'" }
      - { node: fx, col: "0" }
      - { node: fx, col: "1.5" }
      - { node: bare, col: "'EUR'" }
      - { node: bare, col: "N'EUR'" }
      - { node: bare, col: "0" }
      - { node: bare, col: "1.5" }
    expect:
      edges: []
      invalid_kind: bad_contributor_col

  - id: ct-row-role-stored-as-declared
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total] }
      - { id: src, type: view, columns: [Amount, IsOpen, StoreId] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: Amount, transforms: [aggregate] }
      - { node: src, col: IsOpen, transforms: [filter], note: "WHERE IsOpen = 1" }
      - { node: src, col: StoreId, transforms: [combine, filter] }
    expect:
      edges: [Amount, IsOpen, StoreId]

  - id: ct-row-role-keeps-value-and-filter
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total] }
      - { id: src, type: view, columns: [Amount, IsOpen, StoreId] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: Amount, transforms: [compute, filter] }
    expect:
      edges: [Amount]

  - id: ct-row-role-keeps-unclassified-column
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total] }
      - { id: src, type: view, columns: [Amount, IsOpen, StoreId] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: Amount }
    expect:
      edges: [Amount]

  - id: ct-row-role-only-stored
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total] }
      - { id: src, type: view, columns: [Amount, IsOpen, StoreId] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: IsOpen, transforms: [filter] }
    expect:
      edges: [IsOpen]

  - id: ct-row-role-missing-key-column
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total] }
      - { id: src, type: view, columns: [Amount, IsOpen, StoreId] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: Missing, transforms: [filter] }
    expect:
      invalid_kind: bad_contributor_col

  - id: ct-detached-entry-stages-no-edge
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total, Other] }
      - { id: src, type: view, columns: [Amount] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Other }]
    upstream:
      - { node: src, col: Amount }
    expect:
      edges: [Amount]
      invalid: []

  - id: ct-extra-sibling-many-to-many
    runners: [scripted]
    active: [Total]
    nodes:
      - { id: rpt, type: view, columns: [Total, Sibling] }
      - { id: src, type: view, columns: [Amount, Other] }
    focus: rpt
    out: Total
    direction: upstream
    roots: [{ node: rpt, col: Total }]
    upstream:
      - { node: src, col: Amount }
    extra:
      - out: Sibling
        upstream:
          - { node: src, col: Other, note: "Sibling stays in the narrative." }
    expect:
      edges: [Amount, Other]
      invalid: []

  # Rows with contract: walk drive the hop loop through the registered tools. Decisions are semantic (map, ask, prune,
  # refuse); the adapter in tests/unit/backend/helpers/walkRows.ts owns the wire shape. Edges are [source, target]. Expected
  # nodes, edges and column edges are authored here, never read from a run.
  - id: walk-bb-chain-to-storage
    story: A view chain ends at a table, which is recorded without a SQL hop of its own.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: Out
      nodes: { Out: view, Mid: view, Src: table }
      columns: [X]
      edges: [[Src, Mid], [Mid, Out]]
    hops:
      - { at: Out, decide: { ask: [Mid] } }
      - { at: Mid, decide: { ask: [Src] } }
    expect:
      nodes: [Out, Mid, Src]
      edges: [[Src, Mid], [Mid, Out]]

  - id: walk-bb-diamond-shared-join-asked-twice
    story: Both branches ask the shared join; it is visited once and the table behind it is reached.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: view, B: view, J: view, T: table }
      columns: [X]
      edges: [[A, O], [B, O], [J, A], [J, B], [T, J]]
    hops:
      - { at: O, decide: { ask: [A, B] } }
      - { at: A, decide: { ask: [J] } }
      - { at: B, decide: { ask: [J] } }
      - { at: J, decide: { ask: [T] } }
    expect:
      nodes: [O, A, B, J, T]
      edges: [[A, O], [B, O], [J, A], [J, B], [T, J]]

  - id: walk-bb-diamond-unanimous-prune
    story: When every branch votes the shared join off the answer, the join and the table behind it are cut.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: view, B: view, J: view, T: table }
      columns: [X]
      edges: [[A, O], [B, O], [J, A], [J, B], [T, J]]
    hops:
      - { at: O, decide: { ask: [A, B] } }
      - { at: A, decide: { prune: [J] } }
      - { at: B, decide: { prune: [J] } }
    expect:
      nodes: [O, A, B]
      edges: [[A, O], [B, O]]

  - id: walk-bb-excluded-neighbor-offers-no-prune
    story: The only open neighbor is excluded from the run, so nothing is prunable; it is asked as a follow-up and stays out of the graph.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: view, Ext: table }
      columns: [X]
      edges: [[A, O], [Ext, A]]
      excluded: [Ext]
    hops:
      - { at: O, decide: { ask: [A] } }
      - { at: A, decide: { ask: [Ext] } }
    expect:
      nodes: [O, A]
      edges: [[A, O]]

  - id: walk-bb-depth-one-defers-the-next-level
    story: With one level approved, the question to the neighbor past the border becomes a follow-up and the graph stops there.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: view, B: table }
      columns: [X]
      edges: [[A, O], [B, A]]
      levels: 1
    hops:
      - { at: O, decide: { ask: [A] } }
      - { at: A, decide: { ask: [B] } }
    expect:
      nodes: [O, A]
      edges: [[A, O]]

  - id: walk-bb-prune-visited-neighbor-refused
    story: A neighbor already visited cannot be pruned; the correction names the prune field only.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, M: view, S: table }
      columns: [X]
      edges: [[S, M], [M, O]]
    hops:
      - { at: O, decide: { ask: [M] } }
      - at: M
        refuse: { prune: [O], ask: [S], kind: invalid_input, field: prune_neighbors.0.id, issue: prune_target }
        decide: { ask: [S] }
    expect:
      nodes: [O, M, S]
      edges: [[S, M], [M, O]]

  - id: walk-bb-undecided-neighbor-refused
    story: Every open neighbor needs one decision; the correction adds the missing one.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: table, B: table }
      columns: [X]
      edges: [[A, O], [B, O]]
    hops:
      - at: O
        refuse: { ask: [A], kind: route_validation_failed, field: "", issue: neighbor_undecided }
        decide: { ask: [A, B] }
    expect:
      nodes: [O, A, B]
      edges: [[A, O], [B, O]]

  - id: walk-ct-chain-map
    story: Each view maps the traced column from its source; the table source needs no hop.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: Out
      nodes: { Out: view, Mid: view, Src: table }
      columns: [X]
      edges: [[Src, Mid], [Mid, Out]]
    hops:
      - { at: Out, decide: { map: [{ col: X, from: [{ node: Mid, col: X }] }] } }
      - { at: Mid, decide: { map: [{ col: X, from: [{ node: Src, col: X }] }] } }
    expect:
      nodes: [Out, Mid, Src]
      edges: [[Src, Mid], [Mid, Out]]
      column_edges: [[Mid, X, Out, X], [Src, X, Mid, X]]

  - id: walk-ct-stored-column-loaded-by-procedure
    story: The view asks nothing; the continuation reaches the loading procedure through the stored table, which maps what it writes there.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: V
      nodes: { V: view, T: table, P: procedure, S: table }
      columns: [X]
      edges: [[T, V], [P, T], [S, P]]
    hops:
      - { at: V, decide: { map: [{ col: X, from: [{ node: T, col: X }] }] } }
      - { at: P, decide: { map: [{ col: X, to: T, from: [{ node: S, col: X }] }] } }
    expect:
      nodes: [V, T, P, S]
      edges: [[T, V], [P, T], [S, P]]
      column_edges: [[S, X, T, X], [T, X, V, X]]

  - id: walk-ct-out-of-scope-write-refused
    story: A write to a destination outside the approved scope is refused at out_node; the correction omits the entry and asks the destination instead.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: downstream
    graph:
      origin: P
      nodes: { P: procedure, R: table, S: table }
      columns: [X]
      edges: [[R, P], [P, S]]
      excluded: [S]
    hops:
      - at: P
        refuse: { map: [{ col: X, to: S, from: [{ node: P, col: X }] }], kind: invalid_input, field: column_flow.0.out_node, issue: column_out_of_scope }
        decide: { map: [], ask: [S] }
    expect:
      nodes: [P]
      edges: []

  - id: walk-ct-downstream-procedure-write
    story: Downstream, a consumer maps the traced column from the object that feeds it, and a procedure maps what it writes into the table it loads.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: downstream
    graph:
      origin: Root
      nodes: { Root: view, C1: view, W: procedure, T: table }
      columns: [X]
      edges: [[Root, C1], [C1, W], [W, T]]
    hops:
      - { at: Root, decide: { map: [{ col: X, from: [] }], ask: [C1] } }
      - { at: C1, decide: { map: [{ col: X, from: [{ node: Root, col: X }] }], ask: [W] } }
      - { at: W, decide: { map: [{ col: X, to: T, from: [{ node: C1, col: X }] }], ask: [T] } }
    expect:
      nodes: [Root, C1, W, T]
      edges: [[Root, C1], [C1, W], [W, T]]
      column_edges: [[C1, X, T, X], [Root, X, C1, X]]

  # Qualified continuation, procedure outputs and bidirectional sides (ENG-08 I4). `node_columns` gives single objects their own declared columns,
  # `pass` names user pass objects, a hop's `mode` states a hand-over to a BB hop and `deferred` the follow-up questions kept for unvisited objects.
  - id: walk-ct-rename-continues-from-qualified-endpoint
    story: A mapped contributor is continued from its own qualified column, not from the traced column's name.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: V
      nodes: { V: view, A: view, Src: table }
      columns: [Amount]
      node_columns: { A: [Net], Src: [Raw] }
      edges: [[A, V], [Src, A]]
    hops:
      - { at: V, decide: { map: [{ col: Amount, from: [{ node: A, col: Net }] }] } }
      - { at: A, arrives: [{ node: A, col: Net, side: upstream }], decide: { map: [{ col: Net, from: [{ node: Src, col: Raw }] }] } }
    expect:
      nodes: [V, A, Src]
      edges: [[A, V], [Src, A]]
      column_edges: [[A, Net, V, Amount], [Src, Raw, A, Net]]

  - id: walk-ct-mapping-past-depth-border-refused
    story: With one level approved a mapping from the object past the border is refused at the supplier; the correction ends the column and keeps the question as a follow-up.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: V
      nodes: { V: view, A: view, S1: view, S2: view }
      columns: [Amount]
      edges: [[A, V], [S1, A], [S2, A]]
      levels: 1
    hops:
      - { at: V, decide: { map: [{ col: Amount, from: [{ node: A, col: Amount }] }] } }
      - at: A
        arrives: [{ node: A, col: Amount, side: upstream }]
        refuse: { map: [{ col: Amount, from: [{ node: S1, col: Amount }] }], kind: invalid_input, field: column_flow.0.upstream_columns.0.node, issue: column_out_of_scope }
        decide: { map: [{ col: Amount, from: [] }], ask: [S1] }
    expect:
      nodes: [V, A]
      edges: [[A, V]]
      column_edges: [[A, Amount, V, Amount]]
      deferred: [S1]

  - id: walk-ct-unresolved-arrival-keeps-stored-endpoint
    story: The arriving stored column is not an output of its producer; the hop cannot name it as a local output, so it prunes the producer's input and no edge touches the producer.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: Origin
      nodes: { Origin: view, Carrier: table, Producer: view, Source: table }
      columns: [Net]
      node_columns: { Carrier: [Raw], Source: [Input] }
      edges: [[Carrier, Origin], [Producer, Carrier], [Source, Producer]]
    hops:
      - { at: Origin, decide: { map: [{ col: Net, from: [{ node: Carrier, col: Raw }] }] } }
      - at: Producer
        arrives: [{ node: Carrier, col: Raw, side: upstream }]
        refuse: { map: [{ col: Raw, from: [] }], prune: [Source], kind: invalid_input, field: column_flow.0.out_col, issue: unknown_column }
        decide: { map: [], prune: [Source] }
    expect:
      nodes: [Origin, Carrier, Producer]
      edges: [[Carrier, Origin], [Producer, Carrier]]
      column_edges: [[Carrier, Raw, Origin, Net]]

  - id: walk-ct-user-pass-node-continues-as-bb-question
    story: A column continuation that reaches a user pass object stays a question on its source; the next hop is a BB hop and only the authored pair is delivered.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: V
      nodes: { V: view, P: view, T: table, W: procedure, Src: table }
      columns: [Amount]
      node_columns: { Src: [Raw] }
      edges: [[T, P], [P, V], [W, T], [Src, W]]
      pass: [P]
    hops:
      - { at: V, decide: { map: [{ col: Amount, from: [{ node: P, col: Amount }] }] } }
      - { at: W, mode: bb, arrives: [], decide: { ask: [Src] } }
    expect:
      nodes: [V, P, T, W, Src]
      edges: [[T, P], [P, V], [W, T], [Src, W]]
      column_edges: [[P, Amount, V, Amount]]

  - id: walk-ct-delete-only-writer-adds-no-edge
    story: A writer that only deletes from the stored table maps nothing; its stored column as its own source is refused (a column cannot be its own upstream source), and the loading procedure's pair is the only column edge.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: Root
      nodes: { Root: view, Owed: table, Other: table, Source: table, ArchiveWriter: procedure, Producer: procedure }
      columns: [Amount]
      edges: [[Owed, Root], [ArchiveWriter, Owed], [Owed, ArchiveWriter], [ArchiveWriter, Other], [Source, Producer], [Producer, Owed]]
    hops:
      - { at: Root, decide: { map: [{ col: Amount, from: [{ node: Owed, col: Amount }] }] } }
      - at: ArchiveWriter
        arrives: [{ node: Owed, col: Amount, side: upstream }]
        refuse: { map: [{ col: Amount, to: Owed, from: [{ node: Owed, col: Amount }] }], kind: column_self_loop, field: column_flow.0.upstream_columns.0, issue: self_loop }
        decide: { map: [] }
      - { at: Producer, arrives: [{ node: Owed, col: Amount, side: upstream }], decide: { map: [{ col: Amount, to: Owed, from: [{ node: Source, col: Amount }] }] } }
    expect:
      nodes: [Root, Owed, ArchiveWriter, Producer, Source]
      edges: [[Owed, Root], [ArchiveWriter, Owed], [Owed, ArchiveWriter], [Source, Producer], [Producer, Owed]]
      column_edges: [[Owed, Amount, Root, Amount], [Source, Amount, Owed, Amount]]

  - id: walk-bb-delete-only-writer-same-objects
    story: The BB walk of the same graph reaches the same objects and edges as the CT walk.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: Root
      nodes: { Root: view, Owed: table, Other: table, Source: table, ArchiveWriter: procedure, Producer: procedure }
      columns: [Amount]
      edges: [[Owed, Root], [ArchiveWriter, Owed], [Owed, ArchiveWriter], [ArchiveWriter, Other], [Source, Producer], [Producer, Owed]]
    hops:
      - { at: Root, decide: { ask: [Owed] } }
      - { at: ArchiveWriter, decide: {} }
      - { at: Producer, decide: { ask: [Source] } }
    expect:
      nodes: [Root, Owed, ArchiveWriter, Producer, Source]
      edges: [[Owed, Root], [ArchiveWriter, Owed], [Owed, ArchiveWriter], [Source, Producer], [Producer, Owed]]

  - id: walk-ct-bidirectional-consumer-writes-destination
    story: Traced both ways, a consumer procedure downstream of the origin maps the origin column into the table it loads.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: bidirectional
    graph:
      origin: Origin
      nodes: { Origin: view, Source: table, Consumer: procedure, Destination: table }
      columns: [Discount]
      node_columns: { Source: [Amount] }
      edges: [[Source, Origin], [Origin, Consumer], [Consumer, Destination]]
    hops:
      - { at: Origin, decide: { map: [{ col: Discount, from: [{ node: Source, col: Amount }] }], ask: [Consumer] } }
      - { at: Consumer, arrives: [{ node: Origin, col: Discount, side: downstream }], decide: { map: [{ col: Discount, to: Destination, from: [{ node: Origin, col: Discount }] }] } }
    expect:
      nodes: [Origin, Source, Consumer, Destination]
      edges: [[Source, Origin], [Origin, Consumer], [Consumer, Destination]]
      column_edges: [[Source, Amount, Origin, Discount], [Origin, Discount, Destination, Discount]]

  - id: walk-ct-bidirectional-exec-reader-is-bb-hop
    story: A procedure's result set is not a graph column; the object that reads it is served a BB hop, and only the write into the stored table is a column edge.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: bidirectional
    graph:
      origin: Origin
      nodes: { Origin: view, Writer: procedure, Saved: table, Reader: procedure, Buffer: table }
      columns: [Discount]
      node_columns: { Saved: [Amount], Buffer: [Discount] }
      edges: [[Origin, Writer], [Writer, Saved], [Writer, Reader], [Reader, Buffer]]
    hops:
      - { at: Origin, decide: { map: [{ col: Discount, from: [] }], ask: [Writer] } }
      - { at: Writer, arrives: [{ node: Origin, col: Discount, side: downstream }], decide: { map: [{ col: Amount, to: Saved, from: [{ node: Origin, col: Discount }] }], ask: [Reader] } }
      - { at: Reader, mode: bb, arrives: [], decide: { ask: [Buffer] } }
    expect:
      nodes: [Origin, Writer, Saved, Reader, Buffer]
      edges: [[Origin, Writer], [Writer, Saved], [Writer, Reader], [Reader, Buffer]]
      column_edges: [[Origin, Discount, Saved, Amount]]

  - id: walk-ct-bidirectional-shared-writer-both-sides
    story: A writer reached from both sides maps its two destinations from the origin column and prunes the input that supplies nothing.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: bidirectional
    graph:
      origin: Origin
      nodes: { Origin: view, Owed: table, Writer: procedure, Other: table, Foreign: table }
      columns: [Discount]
      edges: [[Owed, Origin], [Origin, Writer], [Writer, Owed], [Writer, Other], [Foreign, Writer]]
    hops:
      - { at: Origin, decide: { map: [{ col: Discount, from: [{ node: Owed, col: Discount }] }], ask: [Writer] } }
      - at: Writer
        arrives: [{ node: Owed, col: Discount, side: upstream }, { node: Origin, col: Discount, side: downstream }]
        decide:
          map:
            - { col: Discount, to: Owed, from: [{ node: Origin, col: Discount }] }
            - { col: Discount, to: Other, from: [{ node: Origin, col: Discount }] }
          prune: [Foreign]
    expect:
      nodes: [Origin, Owed, Writer, Other]
      edges: [[Owed, Origin], [Origin, Writer], [Writer, Owed], [Writer, Other]]
      column_edges: [[Owed, Discount, Origin, Discount], [Origin, Discount, Owed, Discount], [Origin, Discount, Other, Discount]]

  - id: walk-ct-bidirectional-terminal-input-ends-at-writer
    story: A writer that stores only literals ends the arriving input there; its stored destination is asked, and the reader behind it gets a BB hop.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: bidirectional
    graph:
      origin: Origin
      nodes: { Origin: view, Owed: table, Writer: procedure, Other: table, Reader: view, Sink: table }
      columns: [Discount]
      edges: [[Owed, Origin], [Origin, Writer], [Writer, Owed], [Writer, Other], [Other, Reader], [Reader, Sink]]
    hops:
      - { at: Origin, decide: { map: [{ col: Discount, from: [{ node: Owed, col: Discount }] }], ask: [Writer] } }
      - { at: Writer, arrives: [{ node: Owed, col: Discount, side: upstream }, { node: Origin, col: Discount, side: downstream }], decide: { map: [{ col: Discount, to: Owed, from: [] }], ask: [Other] } }
      - { at: Reader, mode: bb, arrives: [], decide: { ask: [Sink] } }
    expect:
      nodes: [Origin, Owed, Writer, Other, Reader, Sink]
      edges: [[Owed, Origin], [Origin, Writer], [Writer, Owed], [Writer, Other], [Other, Reader], [Reader, Sink]]
      column_edges: [[Owed, Discount, Origin, Discount]]

  - id: walk-ct-bidirectional-each-side-keeps-its-leg
    story: Each side of a bidirectional trace continues on its own qualified leg, and every delivered edge chains back to the origin.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: bidirectional
    graph:
      origin: O
      nodes: { O: view, A: view, Raw: table, C: view, D: view, Sink: table }
      columns: [Amount]
      node_columns: { C: [Total], D: [Total], Sink: [Total] }
      edges: [[Raw, A], [A, O], [O, C], [C, D], [D, Sink]]
    hops:
      - { at: O, decide: { map: [{ col: Amount, from: [{ node: A, col: Amount }] }], ask: [C] } }
      - { at: A, arrives: [{ node: A, col: Amount, side: upstream }], decide: { map: [{ col: Amount, from: [{ node: Raw, col: Amount }] }] } }
      - { at: C, arrives: [{ node: O, col: Amount, side: downstream }], decide: { map: [{ col: Total, from: [{ node: O, col: Amount }] }], ask: [D] } }
      - { at: D, arrives: [{ node: C, col: Total, side: downstream }], decide: { map: [{ col: Total, from: [{ node: C, col: Total }] }], ask: [Sink] } }
    expect:
      nodes: [O, A, Raw, C, D, Sink]
      edges: [[Raw, A], [A, O], [O, C], [C, D], [D, Sink]]
      column_edges: [[A, Amount, O, Amount], [Raw, Amount, A, Amount], [O, Amount, C, Total], [C, Total, D, Total]]

  # Walk rows whose refusal is malformed on the wire (`wire`): the dispatcher refuses them before the handler (notation, no tool call) or the handler names the field (cut-off JSON).
  - id: walk-bb-text-only-reply-refused
    story: A reply with plain text and no tool call is refused as a missing call and leaves the hop untouched; the next reply commits it.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: table }
      columns: [X]
      edges: [[A, O]]
    hops:
      - at: O
        refuse: { kind: missing_required_tool_call, field: "", issue: no_tool_call, wire: text_only }
        decide: { ask: [A] }
    expect:
      nodes: [O, A]
      edges: [[A, O]]

  - id: walk-bb-tool-call-notation-in-text-refused
    story: Tool-call notation inside a text argument is refused at that field before the engine sees the call; the corrected resend commits the hop.
    runners: [scripted]
    contract: walk
    mode: bb
    direction: upstream
    graph:
      origin: O
      nodes: { O: view, A: table }
      columns: [X]
      edges: [[A, O]]
    hops:
      - at: O
        refuse: { ask: [A], kind: tool_call_notation, field: summary, issue: tool_call_notation, wire: notation }
        decide: { ask: [A] }
    expect:
      nodes: [O, A]
      edges: [[A, O]]

  - id: walk-ct-cut-off-json-sections-refused
    story: A structured argument delivered as cut-off JSON text is refused at its field by name; the correction sends it as an object.
    runners: [scripted]
    contract: walk
    mode: ct
    direction: upstream
    graph:
      origin: Out
      nodes: { Out: view, Src: table }
      columns: [X]
      edges: [[Src, Out]]
    hops:
      - at: Out
        refuse: { map: [{ col: X, from: [{ node: Src, col: X }] }], kind: invalid_input, field: sections, issue: json_text, wire: cut_off_json }
        decide: { map: [{ col: X, from: [{ node: Src, col: X }] }] }
    expect:
      nodes: [Out, Src]
      edges: [[Src, Out]]
      column_edges: [[Src, X, Out, X]]

  - id: playwright-open-demo
    runners: [playwright]
    command: "Data Lineage: Open Demo"
    expect:
      graph: true

  - id: electron-fixture-trace
    runners: [electron]
    prompt: "@lineage /trace [dbo].[ufnGetProductDealerPrice]"
    expect:
      phase: awaiting_gate

  - id: headless-summary
    runners: [headless]
    dacpac: assets/demo.dacpac
    prompt: "Summarize the loaded database and its main dependencies."
    followup:
      - "What are the most connected hub tables in this database?"
    expect:
      terminal: ok
      preview_chars_min: 150
      must_contain: ["Production", "Sales"]

  - id: headless-procedure-dependencies
    runners: [headless]
    dacpac: assets/demo.dacpac
    prompt: "@lineage /trace [dbo].[uspGetBillOfMaterials]"
    gate:
      - kind: approve
    expect:
      terminal: ok
      preview_chars_min: 100

  - id: headless-view-chain
    runners: [headless]
    dacpac: assets/demo.dacpac
    prompt: "/trace Show dependencies for [Sales].[vSalesPerson]."
    gate:
      - kind: approve
    expect:
      terminal: ok
      preview_chars_min: 100

