# ──────────────────────────────────────────────────────────────────────────────
# AI Output Specification — what @lineage writes, and how.
#
# EDIT `instruction:` — it is the only text sent to the AI. In every block below:
#   instruction:  sent to the AI. Change this to change the output.
#   stages:       label only. Routing is decided in code; editing it does nothing.
#   example:      sample for you to read. Never sent to the AI.
# Neither ignored field warns you. No `instruction:` changed = nothing changed.
#
# The three stages, and which blocks fire in each:
#
#   discovery   first chat reply, no exploration — trivial questions only
#               → discovery_chat, general
#
#   active      per-hop analysis. Each fired *_capture writes ONE section:
#               business → 1, technical → 1, both → 2. Blocks are independent.
#               → business_capture, technical_capture, structural_summary,
#                 column_trace_capture (column-trace mode only)
#
#   synthesis   final document. The AI writes these parts; the engine assembles,
#               numbers, and decorates them — do not template what the engine builds.
#               → summary, title, intro, closing, highlights, notes, general,
#                 loading_pattern (technical only)
#
# Your own copy: set `dataLineageViz.ai.outputTemplateFile`. It merges over this
# file and your keys win — but only while its `schemaVersion` matches the one
# below. On a mismatch it is skipped with a warning in the Output channel; re-run
# "Data Lineage: Create AI Output Templates" and re-apply your edits.
#
# Per-key reference: docs/AI_PROMPTS.md
# ──────────────────────────────────────────────────────────────────────────────

schemaVersion: 2

# ── Discovery (chat-only) — editable via overlay ─────────────────────────────

discovery_chat:
  stages: [discovery]
  instruction: >
    Markdown. Lead with the direct answer to the user's question, then explain
    the lineage as a coherent flow: what each relevant object contributes and
    why it matters before adding technical evidence.


    Preserve every substantive fact supported by the loaded data, including
    transformations and column mappings, filters and predicates, read/write
    distinctions, validation or deduplication rules, error and audit paths, and
    notable inconsistencies or risks. Use canonical object and column names.
    If evidence is missing, state what is unavailable instead of inferring it.


    Keep internal tool names, call syntax, and payload fields out of the answer.
    Organize multi-object answers by the question's flow and group simple source
    or pass-through objects when helpful. Show a raw node/edge inventory only
    when the user explicitly asks for one. Use headings, bullets, tables, or SQL
    fences only when they make the answer clearer.

# ── Card + top of the document ───────────────────────────────────────────────

summary:
  stages: [synthesis]
  instruction: >
    One-line graph purpose — aim for ~120 chars. Shown in the info card. This is
    prose, not a fixed-width label: write the full purpose; avoid padding or clipping to a number.
  example: "Revenue lineage from raw orders through price calculation to FactTableA."

title:
  stages: [synthesis]
  instruction: >
    Optional. Aim for ≤80 chars (hard cap 120 — over-length titles are rejected
    and re-asked). Names the analysis subject and its key finding:
    "[Subject] — [key computation, pattern, or finding]". Include the final
    output object if space allows. Omit step counts and numbers.
    GOOD: "NetAmountA — QtyA × PriceA, 6-hop chain to FactTableA"
  example: "NetAmountA — QtyA × PriceA, 6-hop ETL to FactTableA"

intro:
  stages: [synthesis]
  instruction: >
    2–4 sentences of narrative prose as a standalone paragraph before the
    sections. Open with the direct answer to the user's stated question —
    name the origin, the key relationship, or the finding the user asked
    for — then set architectural context. Refer to shared state by role
    ("central scratch-pad table", "terminal publication step") rather than
    by listing its columns. Schema details (column names, data types,
    nullability) belong in the later sections.
  example: >
    Read as a business-driven view: NetAmountA is the product of QtyA
    and PriceA — both computed independently before joining at
    spBuildFactA. QtyA originates in raw order imports; PriceA is
    derived from supplier margins with a markup formula.

# Section assembly (lift + group + label) is governed by buildSynthesisPrompt()
# in src/ai/prompting/prompts.ts — kept there to avoid duplication with the synthesis cue.
# This file documents only the parts the AI writes from scratch.

closing:
  stages: [synthesis]
  instruction: >
    Required whenever this template appears — the engine renders it only
    for results large enough to need a wrap-up.
    After the sections, separated by a `---` divider, write a brief
    closing block:
    (1) one-paragraph through-line that names the overall pipeline answer
    in the lens the user requested.
    Add a risk callout block carrying every ⚠️ callout from the captured
    evidence that no section already placed — significance was settled at
    capture, so carry each one through rather than re-judging it. In
    business-only missions, keep callouts business-facing (impact/scope),
    not technical internals.
    Write complete sentences and finish the closing cleanly.
  example: |
    The spBuildFactA pipeline reloads from staging each run, applies a
    four-stage cascade (order staging → price calculation → discount
    application → fact write), and lands USD-converted totals in FactTableA.

    | Risk | Scope |
    |---|---|
    | ⚠️ NULL PriceA in OrderDetailA collapses NetAmountA | All revenue rows |
    | ⚠️ Missing DimCurrency rows produce NULL CurrencyTotal | Final fact load |

# `description` is engine output (built by orderAndAssemble in src/ai/tools/presentResult.ts
# from title + intro + sections[] + closing) — NOT an AI-writeable field.
# No instruction template here, by design.

# ── Graph-side decorations ───────────────────────────────────────────────────

highlights:
  stages: [synthesis]
  instruction: >
    Colors and labels are two different channels, both relative to the USER
    QUESTION. Colors (highlight_groups) mark importance: the question's data
    Sources, its Target, and the important transformations — nodes that CREATE
    or CHANGE the answer's values (formula, condition, classification, status
    transition). Carry-through plumbing (renames, SELECT * bridges, movement
    procs, plain storage tables, row filters) stays uncolored — the graph is a
    map: colored landmarks on a plain background. Highlight selectively:
    emphasis, not the full node list; the linked sections already carry the
    complete set. Pick one scheme: Lineage (source/transform/target) or
    Diagnostic (good/warn/fail). Keep one scheme. Lineage colors follow DATA
    FLOW, not question direction: `source` = the deepest data origins the trace
    reached (raw/base feeds), `target` = where the data lands — in an upstream
    trace that is the queried object itself.

notes:
  stages: [synthesis]
  instruction: >
    Per-node captions (node_id, text). ONE short sentence under each node —
    what it does specifically in this flow, not a generic description. Keep
    it terse; ~120 chars typical. No SQL snippets, no formulas, no multi-line
    captions. Detail belongs in the section body, not in the graph caption.
    Glancing at graph + notes should tell the story; deeper logic lives in
    the description.
    If the node is a passthrough, name what it passes or filters in one
    short clause ("Passthrough — IsValid filter").
    GOOD: "Computes NetAmountA at INSERT"
    BAD : "Computes NetAmountA = QtyA × PriceA at INSERT\nAlso computes
    AdjustedAmountA" (multi-line + formula belongs in the section body).
  example: "Aggregates monthly invoices"

# ── Per-hop capture (active phase) ───────────────────────────────────────────
# Each fired *_capture template produces ONE section into submit_findings.sections[].
# Submit shape: { angle: 'business' | 'technical', text: '<body>' }.
# Independent specs — no cross-references between templates. Each section is
# self-contained; synthesis groups across nodes at the next phase.

business_capture:
  stages: [active]
  instruction: |
    <purpose>
    Capture this node's BUSINESS LOGIC from current DDL so a business analyst
    can understand: what changes, why the rule exists, how the rule is decided,
    and what assumptions/effects exist both upstream and downstream.
    </purpose>

    ⛔ STRICT GROUNDING — analyze only `bb_ddl` from the focus node. Use only
    rules, formulas, thresholds, and relationships present in DDL. If a
    construct is absent from the DDL text, treat it as out of scope — a
    commented-out or documented-but-inactive branch is present, not absent,
    and is reported as inactive. Quoted SQL witnesses must be exact
    substrings of that DDL — never paraphrased SQL.
    When the DDL proves the mechanism but not the intent, prevalence, or
    runtime impact, state `not established from the available SQL` — never
    fill a gap with a plausible inference.

    <scope_relevance>
    System/backend logging is not part of the business answer — prune it
    (verdict: prune). That covers any sink that records who ran what and when
    rather than business values: ETL load logs, error-capture tables,
    run/audit-of-procedure logs, retention bookkeeping, and the procedures whose
    only job is to write them. Decide by its columns — event type, object name,
    procedure name, row counts, messages, timestamps means backend logging.
    A business audit trail is the exception: it stores the traced column's own
    values, as a before/after or as-of history of that column. Keep it as a
    consumer, with a one-line caption, and do not prune it.
    Either way, when the question is specifically about logging, errors,
    auditing or retention, keep the sink and analyze it. Keep any node that
    transforms or carries a value on the answer path.
    </scope_relevance>

    Submit one section: `{ angle: "business", text: "<body>" }`. The
    archive has no length cap and synthesis lifts your text verbatim —
    write at the depth the node's role in answering the user's question
    warrants. Nodes that directly address the question get full depth;
    context nodes in scope but tangential to the question get a brief
    functional note. Brevity here becomes brevity in the final report.
    A node central to the question typically needs several paragraphs
    covering every rule and branch visible in its DDL — a 2–3 sentence
    summary is under-depth for such a node.

    <emphasis>
    Highest-value content, in order:
    1. **Business outcome** — what changes for users, reporting, or decisions.
    2. **Business intent (why)** — the decision objective this rule serves.
    3. **Decision rules (how)** — what condition triggers the change and what outcome it drives.
    4. **Lifecycle impact** — business status/phase transitions when present.
    5. **Audit-trail meaning** — what business event each audit entry represents.
    6. **Material risks** — add ⚠️ only for significant, decision-impacting
       data-quality issues grounded in the loaded evidence.
    7. **Technical evidence** — formulas, predicates, thresholds, and key column references
       used to explain business logic.
    </emphasis>

    <body_recipe>
    1. Open with one sentence naming the domain role ("computes revenue
       at INSERT") and the decision objective ("why this rule exists").
    2. Walk through business rules in plain language first. Name what
       changes for the business when each rule fires.
    3. When the DDL declares a mode, status, or strategy switch — a
       parameter with an allowed-value list, a CASE ladder, or an IF
       branch set — name every declared value and what each one does. A
       value whose implementation is commented out or absent is reported
       as declared but not active, never omitted.
    4. For EVERY computed or derived expression in the DDL (arithmetic,
       CASE result, COALESCE fallback, aggregation), write the formula as
       a `$$ … $$` block and explain the business meaning of its terms
       briefly. A `$$ … $$` block must preserve the DDL expression term
       for term: left side the declared target (column or variable),
       right side its declared expression, with no operator added,
       dropped, or reordered — when a faithful rendering is not possible,
       quote the SQL instead.
    5. Capture both **upstream assumptions** and **downstream effects** when
       evidenced in current DDL context.
    6. Express status-enum lifecycles as numbered transitions
       ("1. New → 2. Approved → 3. Shipped"). Capture the business
       state change, not the SQL UPDATE that effects it.
    7. Add ⚠️ only when the issue is significant and decision-impacting.
       If no material issue exists, omit risk callouts.
    8. For SELECT-only views (no INSERT/UPDATE/DELETE): describe what data
       this view makes queryable and its business meaning — not how the
       SELECT is structured.
    9. Wrap column and object names in `\`backticks\`` only when used.
    </body_recipe>
  example: |
    `spCalcA` computes `NetAmountA` at the final INSERT into
    `FactTableA`, only for rows with `Status = 'CONFIRMED'`.

    $$
    NetAmountA = QtyA \times PriceA
    $$

    1. `QtyA` is line-item quantity sold, renamed from `RawQtyA` in
       `CTE_Orders`.
    2. `PriceA` is list price after markup:

       $$
       PriceA = BaseCostA \times (1 + UpliftPctA)
       $$
    3. The fact row is INSERTed with `NetAmountA` populated.

    | From | To | Business meaning |
    |------|----|------------------|
    | RawQtyA | QtyA | line-item quantity sold |
    | ListPriceA | PriceA (pre-markup) | sticker price |
    | UpliftPctA | PriceA (component) | supplier-specific uplift |

    ⚠️ Null `UpliftPctA` collapses `PriceA` to `BaseCostA` — verify
    supplier coverage before each run. Consumer impact: every revenue
    dashboard reads `NetAmountA` directly; this rule defines the
    dashboard's accuracy.

technical_capture:
  stages: [active]
  instruction: |
    <purpose>
    Capture HOW this node runs — execution mechanics, query shape, loading
    pattern, performance affordances and traps.
    </purpose>

    ⛔ STRICT GROUNDING — analyze only `bb_ddl` from the focus node. Make
    claims only about indexes, partitioning, performance issues, or references
    present in DDL. Tie performance claims to visible SQL constructs (JOIN,
    WHERE, DISTINCT, subquery). If it is absent from DDL, it is out of scope.
    Quoted SQL witnesses must be exact substrings of that DDL — never
    paraphrased SQL. When the DDL shows a pattern but not its runtime effect,
    state `not established from the available SQL` rather than inferring it.

    Submit one section: `{ angle: "technical", text: "<body>" }`. The
    archive has no length cap; synthesis lifts your text verbatim. Write
    as deeply as the node's implementation warrants.

    <body_recipe>
    1. SQL evidence — quote the key expressions verbatim: JOIN predicates,
       CASE conditions, COALESCE fallbacks, computed-column formulas, the
       window-function partition clause. Snippet only, not the full
       INSERT/SELECT statement.
    2. Loading pattern (procedures only) — decide from the statement that
       clears the target table, quotable verbatim from `bb_ddl`: `reload`
       only when a `TRUNCATE` or an unfiltered `DELETE` against the
       target is present; `append` when the target is only ever inserted
       into (temp-table `#…` writes and audit/log writes do not count);
       `upsert` (MERGE or UPDATE + conditional INSERT); `historization`
       (versioned history); `purge` (DELETE-only, no INSERT to the
       target); `orchestration` (EXECs other SPs, no mutation). No
       quotable clearing or inserting statement decides the shape — use
       `not established from the available SQL`. Coarse only —
       sub-variants (SCD1/SCD2/CDC) belong in prose if relevant. Omit
       when the focus is a view, UDF, or table.
    3. Computed columns — the formula as a `$$ … $$` block alongside its
       snippet.
    4. Relationship role labels — "reads lookup from `DimProduct`",
       "writes via MERGE to `FactTableA`", "triggered by `spLoadA`".
    5. Join types when hinted (HASH / MERGE / LOOP); flag Cartesian risk
       with ⚠️.
    6. Antipatterns — excessive DISTINCT, OR in join predicates,
       correlated subqueries in SELECT, scalar UDFs in WHERE.
    7. Distribution / indexing hints — partition key, hash-distribution
       column, clustered-index column order.
    8. Datatype declarations — call out non-default precisions
       (`DECIMAL(19,4)` vs `DECIMAL(18,2)`), nullability surprises, and
       casts that change semantics (`CAST AS DATE` truncating time).
    9. Execution-plan candidates visible in the SQL text — flag as
       candidates requiring validation, never as confirmed behavior:
       sargability, parameter sniffing, and statistics effects need
       schema metadata or plan evidence beyond this DDL.
    10. DDL comments and version annotations — author intent that would be
       lost after this hop.
    </body_recipe>

    Format with markdown — no `#`/`##` headings (the engine owns section
    headings; open with a bold label instead), SQL in ```sql fences
    (snippet only), join steps as ordered lists, ⚠️ inline at risks.

    Each capture is independent — synthesis detects sibling variants
    across nodes and emits comparison tables at assembly time.
  example: >
    Loading: TRUNCATE + INSERT — full reload, no delta tracking.

    ```sql
    INSERT INTO dbo.FactTableA (NetAmountA, ProductId, QtyA)
    SELECT o.RawQtyA * p.PriceA, o.ProductId, o.RawQtyA
    FROM CTE_Orders o
    INNER HASH JOIN DimProduct p ON o.ProductId = p.ProductId
    LEFT JOIN vwPriceA pl ON o.ProductId = pl.ProductId
    WHERE o.IsActive = 1
    ```

    Filters: `WHERE IsActive = 1` — plain equality predicate; index
    support is unknown from this DDL (schema metadata required).
    `INNER HASH JOIN` on `ProductId` — explicit hash-join hint in the
    source; fit for the actual table sizes needs plan evidence.
    `LEFT JOIN vwPriceA` on `ProductId` — ⚠️ unmatched rows produce NULL
    downstream; no ISNULL guard before the INSERT.
    Candidate: an index covering `(ProductId, OrderDate)` may help the
    downstream aggregation — validate against existing indexes first.

# ── Reduced capture for non-bodied starting points ───────────────────────────

structural_summary:
  stages: [active]
  instruction: >
    Fires only when the focus node has no DDL body (table/non-bodied).
    For this hop only, it replaces `business_capture` and `technical_capture`. It replaces the
    recipes but not the section count: submit one section per angle the mission requires, each
    carrying this same body, because the locked classification decides how many sections a hop
    must contain and the focus type does not change it.

    Describe what this node **is**; point to the surrounding procedures for
    what it **does**. Non-bodied nodes carry structure, not behaviour.

    ⛔ STRICT GROUNDING — use only `focus_node` data. Use only columns,
    objects, neighbors, and relationships present in that data. If a field is
    missing/empty, output the explicit empty-case text below.

    Required parts, in this order, each opened with a bold label on its own line:

    **Purpose**
    One short sentence naming the role of this node in the pipeline.
    Source: node id / type from focus_node.

    **Columns**
    From `cols[]` only, render a `| Column | Type | Role / ⚠️ |` table. Role is a short phrase
    (key / dim / metric / audit / computed). Flag nullable columns with ⚠️.
    If `cols[]` is absent: write "Column metadata not available in current model."

    **Upstream sources**
    Populate from `in[]` in focus_node — these are the nodes that write TO
    this table. One line per entry: node id + one-sentence role.
    If `in[]` is empty or absent: write "No upstream sources found in graph."

    **Downstream consumers**
    Populate from `out[]` in focus_node — these are the nodes that read FROM
    this table. One line per entry: node id + one-sentence role.
    If `out[]` is empty or absent: write "No downstream consumers found in graph."

    **Grain / keys**
    Derive from PK-flagged columns in `cols[]` and `fks[]` in focus_node only.
    If neither is present: write "Key information not available in current model."

    Scope: structure and relationships only — the surrounding procedure slots carry all transform logic.

# ── Column Trace capture (active phase, CT mode only) ────────────────────────
# Fires additively alongside business_capture / technical_capture when the
# session has targetColumns set. Instructs the AI to fill out the column_flow
# JSON per hop. CT-mode-gated in templateRenderer.ts → CT_MODE_GATED.
# sections[].text (semantic channel) should cover business/technical logic only —
# NOT re-state column flow; that belongs exclusively in column_flow.

column_trace_capture:
  stages: [active]
  instruction: |
    <purpose>
    Account for EVERY active tracked column — each gets one explicit decision:
      → Continue it:  a column_flow entry mapping it to its upstream source column(s) + route upstream.
      → It ends here: a column_flow entry with upstream_columns: [] (terminal — produced here, no upstream real column).
    If this node carries NONE of the tracked columns, submit column_flow: [] — it is off-trace and
    the engine excludes it from the result.

    A tracked column you leave out of column_flow is rejected as column_chain_incomplete —
    account for it (continue / terminal). column_flow is engine-validated:
    omitting the field returns ct_field_required; column_flow: [] means "no columns accounted"
    and is valid only when this node has no active tracked columns (off-trace).
    </purpose>

    ## Before submitting — verify
    □ Every active tracked column appears as an out_col in column_flow (continued, or terminal with upstream_columns: []). If the node has no tracked columns, submit column_flow: [] (off-trace).
    □ Each upstream_columns entry is a real INPUT to `out_col`'s value — it appears in `out_col`'s producing expression (the formula / CASE / SELECT clause that computes it). A column that sits on the same source but feeds a different output is off-trace for this `out_col`: omit it. Trace only the columns that derive the tracked target and its sub-questions.
    □ sections[].text — this hop's narrative body — explains the context of the flow, including HOW the value is computed (formula / CASE / COALESCE / rename); that narrative never goes into column_flow fields.
    □ sections[].text: open with focus node as subject — "[schema].[FocusNode] is ..." not "This node is the builder for `OtherNode`".
    □ When an out_col is produced by a computed expression (arithmetic, CASE, COALESCE, aggregation), sections[].text includes the producing expression as a `$$ … $$` block.

    ## Example — column interacts (Revenue computed at vw_Sales)
    column_flow: [
      { out_col: "Revenue",
        upstream_columns: [
          { node: "fact_orders", col: "Qty" },
          { node: "fact_orders", col: "PriceA" }
        ]}
    ]
    verdict: "analyze"

    ## Example — this node is off-trace (carries none of the tracked columns)
    column_flow: []    ← the engine excludes this node from the result

    ## Verdict — choose based on how the node interacts with tracked columns
    - `analyze`: the node transforms or is the terminal source of a target column.
      Fill column_flow for each active column.
      Terminal (no upstream possible): upstream_columns: [] — stored base column,
      hardcoded literal, or system function (GETDATE(), NEWID()). Empty
      upstream_columns signals the branch ends here.
    - `passthrough`: column flows through unchanged; the upstream writer is not yet visited.
      Fill column_flow naming the upstream column, then add route_requests to visit it.
      The edge is recorded here; full attribution resolves at the routed node.
    - Off-trace: if the node carries none of the tracked columns, submit
      column_flow: [] — the engine excludes it from the trace.

    ## Non-bodied table focus (TABLE written by a procedure)
    When the focus node is a TABLE (no DDL — only schema metadata), the procedure that
    writes to it is upstream. Use verdict='passthrough'; use the column name as it appears in the table.
    column_flow: [{ out_col: "OrderTotal", upstream_columns: [{ node: "[schema].[spWriter]", col: "OrderTotal" }] }]
    Leave route_requests empty — the CT engine queues upstream_columns[] automatically.

    ## column_flow fields per entry
    - out_col: column name being produced. For PROCEDURE focus: the column name in the target table (same as writes_to.col).
    - upstream_columns[]: real upstream source column(s), each { node, col }. One entry per upstream input.
      Formula / CASE / COALESCE with multiple inputs: list each input separately.
    - writes_to: set when the focus node is a PROCEDURE that writes to a table.
      Must be an OBJECT: { node: "[schema].[TargetTable]", col: "ColumnName" }.
      NOT a string. out_col = the column name being written; upstream_columns = upstream inputs.
      When the focus does not write to a table, omit writes_to entirely — do not send null.

    ## Common patterns
    - Rename (upstream col name ≠ out_col): same data, different name — note the rename in sections[].text.
    - One source feeding two output columns: two entries, same upstream column.
    - Computed expression from two columns: two upstream_columns entries.
    - Filter/lookup-only column (WHERE / JOIN-ON only, no value contribution): NOT an
      upstream_columns entry — explain it in sections[].text when it matters.

# Per-angle section assembly (business / technical / both) is governed by
# buildSynthesisPrompt() in src/ai/prompting/prompts.ts. No separate per-angle templates
# here — the lift+group+label rule is identical for both angles and lives in
# the synthesis cue to avoid duplication.

# ── Cross-section rendering at synthesis ─────────────────────────────────────
# Always-on at synthesis. Describes HOW captured content renders consistently
# across every section in the assembled document. Conditional triggers — each
# rule fires only when the captured slot bodies contain the underlying
# material; the AI does NOT invent tables / formulas / fences without source.

general:
  stages: [discovery, synthesis]
  instruction: >
    Apply this rendering set across every assembled section so the document
    reads consistently end-to-end. Prioritize business clarity; include
    technical formatting only when needed to clarify business meaning:

    - **Formulas**: every calculation present in the captured bodies that
      bears on the asked question appears exactly once as a `$$ … $$`
      block in its most relevant section; ground every formula in
      captured content.
    - **Column renames**: render as a `| From | To | Business meaning |`
      table only when the rename pattern is central to business understanding.
    - **Source guards** (WHERE / JOIN / MERGE predicates that filter or key
      the data): quote short SQL snippets only when needed for business
      clarification; use fenced ```sql blocks with short snippets, not full
      statements.
    - **Status-enum lifecycles**: express as numbered transitions
      ("1. New → 2. Approved → 3. Shipped").
    - **Risks / data-quality flags**: every ⚠️ callout present in the
      captured bodies appears exactly once as a ⚠️ line in its most
      relevant section; significance was settled at capture, so carry each
      one through rather than re-judging it. In business-only missions,
      phrase risk in business terms first; add technical detail only when
      it clarifies impact.
    - **Scope**: answer ONLY what was asked. Side branches the question did
      not ask about (audit, logging, retention, error-handling paths) get at
      most a one-line note, not their own section or highlight — a captured
      ⚠️ on such a branch is that one line, never a deletion. In a
      column trace, sections and highlights follow the value chain of the
      traced column and its terminal sources.

    These rules apply only when the captured body has the underlying material.
    Use sourced tables, formulas, and fences only.
  example: >
    $$NetAmountA = QtyA \times PriceA \times (1 - DiscountA)$$

    | From | To | Business meaning |
    | --- | --- | --- |
    | RawQtyA | QtyA | Units sold per order line |
    | ListPriceA | PriceA | Price after supplier markup |

    ```sql
    WHERE o.IsActive = 1 AND o.OrderDate >= DATEADD(YEAR, -2, GETDATE())
    ```

    Status flow: 1. New → 2. Reviewed → 3. Approved → 4. Shipped → 5. Closed.

    ⚠️ Null `DiscountA` collapses NetAmountA to QtyA × PriceA — verify input.

# ── Big-picture ETL closing — TECHNICAL angle only ───────────────────────────
# Classification-gated to ['technical', 'both'] in templateRenderer.ts.
# Skips entirely on business-only missions because business framing names
# domain consequences, not load shapes.

loading_pattern:
  stages: [synthesis]
  instruction: |
    Technical-angle closing addition, gated by a hard precondition: write
    the closing sentence only when every bodied procedure analyzed in
    this scope was assigned the same load shape by the `technical_capture`
    decision rule, and that shape is not `not established from the available
    SQL`. Otherwise emit nothing for this slot — do not enumerate mixed
    shapes and do not average them into one sentence.

    When the precondition holds, name the shared shape once — in `closing`
    if a closing is requested, otherwise in the section that covers the load
    — because it is one statement about the whole pipeline, not per section.
    Recognized shapes (coarse — no SCD1/SCD2/CDC sub-variants):

    - `reload`        TRUNCATE + INSERT / full refresh
    - `append`        INSERT-only, no UPDATE or DELETE
    - `upsert`        MERGE or UPDATE + conditional INSERT
    - `historization` versioned history / change tracking
    - `purge`         DELETE-only / retention
    - `orchestration` EXECs other SPs, no data mutation on the target

    Skip entirely when the analysis spans non-bodied origins only, or
    when classification is `business`.
  example: >
    Loading pattern: every bodied procedure in this chain uses TRUNCATE +
    INSERT — each run rebuilds `FactTableA` from scratch with no
    delta tracking. Downstream consumers must tolerate full-replace
    semantics; there is no incremental-load fallback.
