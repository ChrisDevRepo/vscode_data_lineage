# ──────────────────────────────────────────────────────────────────────────────
# AI Output Specification — what @lineage writes, and how.
#
# EDIT `instruction:` — it is the only text sent to the AI. In every block below:
#   instruction:  sent to the AI. Change this to change the output.
#   stages:       label only. Routing is decided in code; editing it does nothing.
#   example:      sample for you to read. Never sent to the AI.
# Neither ignored field warns you. No `instruction:` changed = nothing changed.
#
# The three stages, and which blocks fire in each:
#
#   discovery   first chat reply, no exploration — trivial questions only
#               → discovery_chat, general
#
#   active      per-hop analysis. Each fired *_capture writes ONE section:
#               business → 1, technical → 1, both → 2. Blocks are independent.
#               → business_capture, technical_capture, structural_callouts,
#                 structural_summary, column_trace_capture (column-trace mode only)
#
#   synthesis   final document. The AI writes these parts; the engine assembles,
#               numbers, and decorates them — do not template what the engine builds.
#               → summary, title, intro, closing, highlights, notes, general,
#                 loading_pattern (technical only)
#
# Your own copy: set `dataLineageViz.ai.outputTemplateFile`. It merges over this
# file and your keys win — but only while its `schemaVersion` matches the one
# below. On a mismatch it is skipped with a warning in the Output channel; re-run
# "Data Lineage: Create AI Output Templates" and re-apply your edits.
#
# Per-key reference: docs/AI_PROMPTS.md
# ──────────────────────────────────────────────────────────────────────────────

schemaVersion: 3

# ── Discovery (chat-only) — editable via overlay ─────────────────────────────

discovery_chat:
  stages: [discovery]
  instruction: >
    Markdown. Lead with the direct answer to the user's question, then explain
    the lineage as a coherent flow: what each relevant object contributes and
    why it matters before adding technical evidence.


    Preserve every substantive fact supported by the loaded data, including
    transformations and column mappings, filters and predicates, read/write
    distinctions, validation or deduplication rules, error and audit paths, and
    notable inconsistencies or risks. Use canonical object and column names.
    If evidence is missing, state what is unavailable instead of inferring it.


    Keep internal tool names, call syntax, and payload fields out of the answer.
    Organize multi-object answers by the question's flow and group simple source
    or pass-through objects when helpful. Show a raw node/edge inventory only
    when the user explicitly asks for one.

# ── Card + top of the document ───────────────────────────────────────────────

summary:
  stages: [synthesis]
  instruction: >
    One-line graph purpose for the info card — prose, ~120 chars: the subject
    of the analysis and where its data lands.
  example: "Revenue lineage from raw orders through price calculation to FactTableA."

title:
  stages: [synthesis]
  instruction: >
    Optional, ≤80 chars and hard-capped at 120:
    "[Subject] — [key computation, pattern, or finding]", ending on the final
    output object where it fits.
  example: "NetAmountA — QtyA × PriceA, 6-hop ETL to FactTableA"

intro:
  stages: [synthesis]
  instruction: >
    2–4 sentences of narrative prose as a standalone paragraph before the
    sections. Open with the direct answer to the user's stated question —
    name the origin, the key relationship, or the finding the user asked
    for — then set architectural context. Shared state is named by role
    ("central scratch-pad table", "terminal publication step").
  example: >
    Read as a business-driven view: NetAmountA is the product of QtyA
    and PriceA — both computed independently before joining at
    spBuildFactA. QtyA originates in raw order imports; PriceA is
    derived from supplier margins with a markup formula.

# Section assembly (lift + group + label) is governed by buildSynthesisPrompt()
# in src/ai/prompting/prompts.ts — kept there to avoid duplication with the synthesis cue.
# This file documents only the parts the AI writes from scratch.

closing:
  stages: [synthesis]
  instruction: >
    Required whenever this template appears — the engine renders it only
    for results large enough to need a wrap-up. After the sections,
    separated by a `---` divider, two parts: one paragraph naming the
    overall pipeline answer in the lens the user requested, then a risk
    block carrying the ⚠️ callouts from the captured evidence that no
    section placed — significance was settled at capture. A business
    mission states impact and scope; the mechanism stays in the sections.
    Complete sentences, finished cleanly.
  example: |
    The spBuildFactA pipeline reloads from staging each run, applies a
    four-stage cascade (order staging → price calculation → discount
    application → fact write), and lands USD-converted totals in FactTableA.

    | Risk | Scope |
    |---|---|
    | ⚠️ NULL PriceA in OrderDetailA collapses NetAmountA | All revenue rows |
    | ⚠️ Missing DimCurrency rows produce NULL CurrencyTotal | Final fact load |

# `description` is engine output (built by orderAndAssemble in src/ai/tools/presentResult.ts
# from title + intro + sections[] + closing) — NOT an AI-writeable field.
# No instruction template here, by design.

# ── Graph-side decorations ───────────────────────────────────────────────────

highlights:
  stages: [synthesis]
  instruction: >
    Colors and labels are two different channels, both relative to the USER
    QUESTION. Colors (highlight_groups) mark importance: the question's data
    Sources, its Target, and the important transformations — nodes that CREATE
    or CHANGE the answer's values (formula, condition, classification, status
    transition). Carry-through plumbing (renames, SELECT * bridges, movement
    procs, plain storage tables, row filters) stays uncolored — the graph is a
    map: colored landmarks on a plain background — emphasis, not the full
    node list; the linked sections already carry the complete set. One
    scheme per graph: Lineage (source/transform/target) or Diagnostic
    (good/warn/fail). Lineage colors follow DATA
    FLOW, not question direction: `source` = the deepest data origins the trace
    reached (raw/base feeds), `target` = where the data lands — in an upstream
    trace that is the queried object itself.

notes:
  stages: [synthesis]
  instruction: >
    Per-node captions (node_id, text). One sentence per node, ~120 chars,
    on a single line: what this node does in this flow. SQL, formulas and
    the deeper logic live in the section body — glancing at graph + notes
    tells the story. A passthrough names what it passes or filters
    ("Filters to IsActiveA rows"). In a column trace the caption also names
    the traced column here and any rename ("OrderAmt → NetAmountA") —
    column names, not the expression.
    GOOD: "Computes NetAmountA at INSERT"
  example: "Aggregates monthly invoices"

# ── Per-hop capture (active phase) ───────────────────────────────────────────
# Each fired *_capture template produces ONE section into submit_findings.sections[].
# Submit shape: { angle: 'business' | 'technical', text: '<body>' }.
# Independent specs — no cross-references between templates. Each section is
# self-contained; synthesis groups across nodes at the next phase.

business_capture:
  stages: [active]
  instruction: |
    <purpose>
    What this node does to the business meaning of the data, read from
    `bb_ddl`: the rules, the values they produce, and what changes downstream.
    Quoted SQL is an exact substring of that DDL; a mechanism shown without
    its intent, prevalence or runtime effect reads as `not established from
    the available SQL`.
    </purpose>

    <scope_relevance>
    A sink that records the run itself — which procedure ran, when, with
    what outcome — is backend logging: verdict `prune`, with the procedures
    whose only job is to write it. A sink holding the traced column's own
    values, before/after or as-of, is a business audit trail: a consumer
    with a one-line caption. Either is in scope when the question is about
    logging, errors, auditing or retention.
    </scope_relevance>

    Submit one section: `{ angle: "business", text: "<body>" }`. The archive
    has no length cap and synthesis lifts the text verbatim.

    <section_skeleton>
    A detailed business section, in this order:
    1. Purpose — the domain role in one line, and the decision the rule serves.
    2. Rules and branches — every declared value of a mode, status or strategy
       switch (parameter allow-list, CASE ladder, IF set) and what it changes
       for the business. A branch commented out or absent is declared but not
       active, and reads as that.
    3. Grain — the row that comes out ("one row per …"), and the predicates
       and join keys the rows arrive under.
    4. Formulas — per distinct assigned expression and its fallback default,
       write the formula as a `$$ … $$` block with the business meaning of
       its terms. A `$$ … $$` block must
       preserve the DDL expression term for term: declared target on the
       left, its declared expression on the right, no operator added,
       dropped, or reordered; when a faithful rendering is not possible,
       quote the SQL instead.
    5. Column mapping — a `| From | To | Business meaning |` row per rename
       or derivation.
    6. Lifecycle — status transitions as numbered steps ("1. New →
       2. Approved → 3. Shipped"), the business state change rather than the
       UPDATE or CASE that effects it; the ladder renders as those steps, not
       as a $$ block.
    7. Loading step — what the DML does to the target: truncate+insert,
       merge, append, purge.
    8. Error handling — what happens when a step fails, and what the rows
       carry afterwards.
    9. Upstream assumptions — the object it is about, and its `bb_ddl` reference.
    10. Gaps — what the DDL leaves open, as `not established from the available SQL`;
        never a verdict an earlier item already reached. An item that disagrees with an
        earlier one is reconciled against it before submitting, not sent as a second finding.

    The evidence for 3, 4, 7 and 8 is a short ```sql fence of the deciding
    expression.
    </section_skeleton>
  example: |
    `spCalcA` computes `NetAmountA` at the final INSERT into
    `FactTableA`, only for rows with `Status = 'CONFIRMED'`.

    $$
    NetAmountA = QtyA \times PriceA
    $$

    1. `QtyA` is line-item quantity sold, renamed from `RawQtyA` in
       `CTE_Orders`.
    2. `PriceA` is list price after markup:

       $$
       PriceA = BaseCostA \times (1 + UpliftPctA)
       $$
    3. The fact row is INSERTed with `NetAmountA` populated.

    | From | To | Business meaning |
    |------|----|------------------|
    | RawQtyA | QtyA | line-item quantity sold |
    | ListPriceA | PriceA (pre-markup) | sticker price |
    | UpliftPctA | PriceA (component) | supplier-specific uplift |

    ⚠️ Null `UpliftPctA` collapses `PriceA` to `BaseCostA` — verify
    supplier coverage before each run. Consumer impact: every revenue
    dashboard reads `NetAmountA` directly; this rule defines the
    dashboard's accuracy.

technical_capture:
  stages: [active]
  instruction: |
    <purpose>
    The DML this node runs, read from `bb_ddl`, and the mechanics that decide
    which rows survive. Quoted SQL is an exact substring of that DDL; a pattern
    whose runtime effect needs a plan or statistics reads as a candidate, `not
    established from the available SQL`. Columns, datatypes, keys, indexes and
    FKs are already on the node.
    </purpose>

    Submit one section: `{ angle: "technical", text: "<body>" }`. The archive
    has no length cap.

    <section_skeleton>
    A detailed technical section, in this order:
    1. Purpose — the execution role in one line.
    2. Rules and branches — each declared value of a parameter allow-list, CASE
       ladder or IF set, and the statement it runs; one commented out or absent
       is declared but not active.
    3. Join shape and grain — JOIN and WHERE predicates in a short ```sql
       fence, the join type where hinted (HASH / MERGE / LOOP), the row that
       comes out: "one row per …".
    4. Formulas — per distinct assigned expression and its fallback default, a
       `$$ … $$` block beside its snippet, with the source → target mapping
       where a rename happens.
    5. State transitions — the procedure's steps as a numbered walk.
    6. Loading step — the shape a statement against the target shows: `reload`
       (TRUNCATE or unfiltered DELETE + INSERT), `append` (inserts only),
       `upsert` (MERGE or UPDATE + conditional INSERT), `historization`,
       `purge`, `orchestration` (EXECs other procedures); coarse, SCD/CDC in
       prose. Absent, or a view/UDF focus: no shape.
    7. Error handling — TRY/CATCH, retry and lock behaviour, and the value the
       rows carry after a failure.
    8. Antipatterns — non-sargable or implicitly converting predicate,
       excessive DISTINCT, OR in a join predicate, correlated subquery or
       scalar UDF per row, unguarded UPDATE or DELETE, TRUNCATE outside a
       transaction, loading order that reads a target before it is written.
    </section_skeleton>

    Markdown; the engine owns `#`/`##` headings, so a bold label opens the
    body and SQL sits in ```sql fences as snippets.
  example: >
    Loading: TRUNCATE + INSERT — full reload, no delta tracking.

    ```sql
    INSERT INTO dbo.FactTableA (NetAmountA, ProductId, QtyA)
    SELECT o.RawQtyA * p.PriceA, o.ProductId, o.RawQtyA
    FROM CTE_Orders o
    INNER HASH JOIN DimProduct p ON o.ProductId = p.ProductId
    LEFT JOIN vwPriceA pl ON o.ProductId = pl.ProductId
    WHERE o.IsActive = 1
    ```

    Filters: `WHERE IsActive = 1` — plain equality predicate; index
    support is unknown from this DDL (schema metadata required).
    `INNER HASH JOIN` on `ProductId` — explicit hash-join hint in the
    source; fit for the actual table sizes needs plan evidence.
    `LEFT JOIN vwPriceA` on `ProductId` — ⚠️ unmatched rows produce NULL
    downstream; no ISNULL guard before the INSERT.
    Candidate: an index covering `(ProductId, OrderDate)` may help the
    downstream aggregation — validate against existing indexes first.

# ── Structural callouts (active phase, bodied focus) ─────────────────────────
# One contract for the ⚠️ findings every capture angle may raise. Fires once per
# bodied hop beside whichever capture recipes the classification fires, so the
# rule is sent once under `both` instead of once per angle.

structural_callouts:
  stages: [active]
  instruction: |
    ⚠️ lines this hop: a STRUCTURAL EXPOSURE the loaded DDL proves — quote the
    deciding statement and say what it does to the data, one line per mechanism
    per node. The exposures that matter most are the silent ones: where the
    statement discards, duplicates, overwrites or mis-keys data without raising
    an error.

    A value the statement hardcodes is reported as the literal it is, in the
    section it belongs to — never judged as good or bad.

    A comment is a claim about the statement, not evidence for it: where the
    statement implements the claim, answer in the comment's own terms; where it
    does not, the gap between them is the finding.
  example: >
    ⚠️ Rows silently dropped — `WHERE o.Region = r.Region` on nullable
    `Region` in `vwOrders`: an order with no region never reaches `FactSales`.

# ── Reduced capture for non-bodied starting points ───────────────────────────

structural_summary:
  stages: [active]
  instruction: >
    Fires only when the focus node has no DDL body (table/non-bodied), in place
    of the capture recipes for this hop. It replaces the recipes but not the
    section count: one section per angle the mission requires, each carrying
    this same body — the locked classification sets the count, the focus type
    does not.

    What this node **is**, read from `focus_node` alone; its columns, types and
    keys are on the node already, and the surrounding procedure slots carry
    what it **does**.

    The parts, in this order, each opened with a bold label on its own line:

    **Purpose**
    One sentence naming the node's role in the pipeline, from its id and type.

    **Upstream sources**
    One line per `in[]` entry — the nodes that write TO this table: node id and
    its role in one sentence.
    Empty or absent `in[]`: "No upstream sources found in graph."

    **Downstream consumers**
    One line per `out[]` entry — the nodes that read FROM this table: node id and
    its role in one sentence.
    Empty or absent `out[]`: "No downstream consumers found in graph."

# ── Column Trace capture (active phase, CT mode only) ────────────────────────
# Fires additively alongside business_capture / technical_capture when the
# session has targetColumns set. Instructs the AI to fill out the column_flow
# JSON per hop. CT-mode-gated in templateRenderer.ts → CT_MODE_GATED.
# sections[].text (semantic channel) should cover business/technical logic only —
# NOT re-state column flow; that belongs exclusively in column_flow.

column_trace_capture:
  stages: [active]
  instruction: |
    <purpose>
    Account for EVERY active tracked column — each gets one explicit decision:
      → Continue it:  a column_flow entry mapping it to its upstream source column(s) + route upstream.
      → It ends here: a column_flow entry with upstream_columns: [] (terminal — produced here, no upstream real column).
    </purpose>

    ## Before submitting — verify
    □ Every active tracked column appears as an out_col in column_flow (continued, or terminal with upstream_columns: []); off-trace nodes submit column_flow: [] (see Verdict).
    □ Each upstream_columns entry is a real INPUT to `out_col`'s value — it appears in `out_col`'s producing expression (the formula / CASE / SELECT clause that computes it). A column that sits on the same source but feeds a different output is off-trace for this `out_col`: omit it. Trace only the columns that derive the tracked target and its sub-questions.
    □ sections[].text — this hop's narrative body — explains the context of the flow, including HOW the value is computed (formula / CASE / COALESCE / rename); that narrative never goes into column_flow fields.
    □ sections[].text: open with focus node as subject — "[schema].[FocusNode] is ..." not "This node is the builder for `OtherNode`".
    □ When an out_col is produced by a computed expression (arithmetic, CASE, COALESCE, aggregation), sections[].text includes the producing expression as a `$$ … $$` block.

    ## Example — column interacts (Revenue computed at vw_Sales)
    column_flow: [
      { out_col: "Revenue",
        upstream_columns: [
          { node: "fact_orders", col: "Qty" },
          { node: "fact_orders", col: "PriceA" }
        ]}
    ]
    verdict: "analyze"

    ## Verdict — the Verdict Protocol above decides it; column_flow follows
    On `analyze`, column_flow carries each active column — upstream_columns: []
    where the value originates here (stored base column, hardcoded literal, system
    function such as GETDATE() or NEWID()). On `passthrough`, column_flow names the
    upstream column and route_requests visits its writer, where full attribution
    resolves.
    Off-trace (no tracked column here): column_flow: [] — the node stays for what it
    does to the rows, stated in sections[].text.

    ## Non-bodied table focus (TABLE written by a procedure)
    When the focus node is a TABLE (no DDL — only schema metadata), the procedure that
    writes to it is upstream. Use verdict='passthrough'; use the column name as it appears in the table.
    column_flow: [{ out_col: "OrderTotal", upstream_columns: [{ node: "[schema].[spWriter]", col: "OrderTotal" }] }]

    ## column_flow fields per entry
    - out_col: column name being produced. For PROCEDURE focus: the column name in the target table (same as writes_to.col).
    - upstream_columns[]: real upstream source column(s), each { node, col }. One entry per upstream input.
      Formula / CASE / COALESCE with multiple inputs: list each input separately.
    - writes_to: set when the focus node is a PROCEDURE that writes to a table.
      Must be an OBJECT: { node: "[schema].[TargetTable]", col: "ColumnName" }.
      NOT a string. out_col = the column name being written; upstream_columns = upstream inputs.

    ## Common patterns
    - Rename (upstream col name ≠ out_col): same data, different name — note the rename in sections[].text.
    - One source feeding two output columns: two entries, same upstream column.
    - Computed expression from two columns: two upstream_columns entries.

# Per-angle section assembly (business / technical / both) is governed by
# buildSynthesisPrompt() in src/ai/prompting/prompts.ts. No separate per-angle templates
# here — the lift+group+label rule is identical for both angles and lives in
# the synthesis cue to avoid duplication.

# ── Cross-section rendering at synthesis ─────────────────────────────────────
# Always-on at synthesis. Describes HOW captured content renders consistently
# across every section in the assembled document. Conditional triggers — each
# rule fires only when the captured slot bodies contain the underlying
# material; the AI does NOT invent tables / formulas / fences without source.

general:
  stages: [discovery, synthesis]
  instruction: >
    How the captured material renders across the assembled sections, business
    meaning first:

    - **Column renames**: a `| From | To | Business meaning |` row per rename
      or derivation the bodies carry.
    - **Source guards**: the WHERE / JOIN / MERGE predicates that filter or
      key the data, short rather than whole statements.
    - **Status-enum lifecycles**: numbered transitions ("1. New →
      2. Approved → 3. Shipped").
    - **Risks / data-quality flags**: every ⚠️ callout present in the captured
      or loaded bodies appears exactly once, in its most relevant section. A
      business mission states the impact first, the mechanism second.
    - **Scope**: the sections follow the question; a side branch it did not
      ask about is one line inside the section it hangs off, not a section or
      highlight of its own — a ⚠️ on such a branch is that one line, never a
      deletion. A column trace follows the value chain of the traced column
      and its terminal sources.

    Each bullet renders what the captured or loaded bodies contain; nothing is
    invented to fill one.
  example: >
    $$NetAmountA = QtyA \times PriceA \times (1 - DiscountA)$$

    | From | To | Business meaning |
    | --- | --- | --- |
    | RawQtyA | QtyA | Units sold per order line |
    | ListPriceA | PriceA | Price after supplier markup |

    ```sql
    WHERE o.IsActive = 1 AND o.OrderDate >= DATEADD(YEAR, -2, GETDATE())
    ```

    Status flow: 1. New → 2. Reviewed → 3. Approved → 4. Shipped → 5. Closed.

    ⚠️ Null `DiscountA` collapses NetAmountA to QtyA × PriceA — verify input.

# ── Big-picture ETL closing — TECHNICAL angle only ───────────────────────────
# Classification-gated to ['technical', 'both'] in templateRenderer.ts.
# Skips entirely on business-only missions because business framing names
# domain consequences, not load shapes.

loading_pattern:
  stages: [synthesis]
  instruction: |
    One statement about the whole pipeline, not per section: when every bodied
    procedure carried the same captured load shape, name that shape once — in
    `closing` if a closing is requested,
    otherwise in the section that covers the load, with what it means for
    consumers.

    Nothing at all when the shapes differ, when no shape was captured, or when
    the analysis spans non-bodied origins only.
  example: >
    Loading pattern: every bodied procedure in this chain uses TRUNCATE +
    INSERT — each run rebuilds `FactTableA` from scratch with no
    delta tracking. Downstream consumers must tolerate full-replace
    semantics; there is no incremental-load fallback.
