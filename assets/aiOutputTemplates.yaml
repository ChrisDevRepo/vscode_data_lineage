# ──────────────────────────────────────────────────────────────────────────────
# AI Output Specification — what @lineage writes, and how.
#
# EDIT `instruction:` — it is the only text sent to the AI. In every block below:
#   instruction:  sent to the AI. Change this to change the output.
#   stages:       label only. Routing is decided in code; editing it does nothing.
#   example:      sample for you to read. Never sent to the AI.
# Neither ignored field warns you. No `instruction:` changed = nothing changed.
#
# The three stages, and which blocks fire in each:
#
#   discovery   first chat reply, no exploration — bounded catalog and lineage
#               questions answered with the discovery read tools
#               → discovery_chat
#
#   active      per-hop analysis. Each fired *_capture writes ONE section:
#               business → 1, technical → 1, both → 2. Blocks are independent.
#               → business_capture, technical_capture, structural_callouts,
#                 structural_summary, column_trace_capture (column-trace mode only)
#
#   synthesis   final document. The AI writes these parts; the engine assembles,
#               numbers, and decorates them — do not template what the engine builds.
#               → summary, title, intro, closing, highlights, notes, general,
#                 loading_pattern (technical only)
#
# Your own copy: set `dataLineageViz.ai.outputTemplateFile`. It merges over this
# file and your keys win — but only while its `schemaVersion` matches the one
# below. On a mismatch it is skipped with a warning in the Output channel; re-run
# "Data Lineage: Create AI Output Templates" and re-apply your edits.
#
# Per-key reference: docs/AI_PROMPTS.md
# ──────────────────────────────────────────────────────────────────────────────

schemaVersion: 2

# ── Discovery (chat-only) — editable via overlay ─────────────────────────────

discovery_chat:
  stages: [discovery]
  instruction: >
    Markdown; SQL in ```sql fences; levels as a table or nested list. Lead
    with the direct answer. When the answer is a set — every
    source, every consumer, every match — give the whole set, its count and
    how much was searched, from the tool totals. Then explain the flow: what
    each object contributes, with the transformations, column mappings,
    predicates, read/write roles, validation rules and risks the loaded SQL
    shows. Use canonical names; say what is unavailable rather than infer it.
    Keep tool names and payload fields out of the answer, and list raw nodes
    or edges only when asked.

# ── Card + top of the document ───────────────────────────────────────────────

summary:
  stages: [synthesis]
  instruction: >
    One line for the info card, ~120 chars: the subject of the analysis and
    where its data lands.
  example: ""

title:
  stages: [synthesis]
  instruction: >
    Optional, ≤80 chars: "[Subject] — [key computation, pattern or finding]",
    ending on the final output object where it fits.
  example: ""

intro:
  stages: [synthesis]
  instruction: >
    2–4 sentences before the sections: the direct answer to the question
    first — the origin, the key relationship or the finding asked for — then
    the architectural context.
  example: ""

# Section assembly (lift + group + label) is governed by buildSynthesisPrompt()
# in src/ai/prompting/prompts.ts — kept there to avoid duplication with the synthesis cue.
# This file documents only the parts the AI writes from scratch.

closing:
  stages: [synthesis]
  instruction: >
    One paragraph after the sections with the overall answer in the lens the
    user asked for; a business mission states impact and scope and leaves
    the mechanism to the sections.
  example: ""

# `description` is engine output (built by orderAndAssemble in src/ai/tools/presentResult.ts
# from title + intro + sections[] + closing) — NOT an AI-writeable field.
# No instruction template here, by design.

# ── Graph-side decorations ───────────────────────────────────────────────────

highlights:
  stages: [synthesis]
  instruction: >
    Color the landmarks of the answer, relative to the question — not the
    full node list: the sources whose data feeds it (filter-only lookups stay
    bare), its target, and the transformations that create or change its
    values. Carry-through stays uncolored. Each legend label (~40 chars)
    names the role its nodes share.

notes:
  stages: [synthesis]
  instruction: >
    One caption per linked node, one line (~120 chars): what it does in this
    flow; SQL and formulas stay in the section body. In a column trace, name
    the traced column there and any rename.
  example: "Aggregates monthly invoices"

# ── Per-hop capture (active phase) ───────────────────────────────────────────
# Each fired *_capture template produces ONE `sections` key for its angle.
# Under classification `both` both recipes fire (two keys); a single-angle
# lock fires one recipe (one key). Shape: { business?: string, technical?: string }. Independent specs —
# no cross-references between templates. Each key is self-contained;
# synthesis groups across nodes at the next phase.

business_capture:
  stages: [active]
  instruction: |
    What the node does to the meaning of the data.
    1. Purpose: the domain role and the decision it serves.
    2. Rules and branches: each declared value of a mode, status or strategy switch and what it changes; a commented-out branch is declared, not active.
    3. Grain: "one row per …", with the predicates and join keys the rows arrive under.
    4. Formulas: each assigned expression and its default as `$$ target = expression $$`, term for term, with what its terms mean.
    5. Column mapping: `| From | To | Business meaning |`.
    6. Lifecycle: status transitions as numbered steps.
    7. Loading: whether target rows are replaced, extended or removed.
    8. Error handling: what a failure leaves in the rows.
    9. Gaps.

    <scope_relevance>
    A sink that records the run itself — which procedure ran, when, with
    what outcome — is a sidecar in this business section: one line inside
    the section it hangs off, never a section or highlight of its own. A
    sink holding the traced column's own values, before/after or as-of, is
    a business audit trail: a consumer with a one-line caption.
    </scope_relevance>
  example: ""

technical_capture:
  stages: [active]
  instruction: |
    The mechanics, and which rows survive them.
    1. Purpose: the execution role.
    2. Rules and branches: each switch value and the statement it runs.
    3. Join shape and grain: JOIN and WHERE predicates, join hints, "one row per …".
    4. Formulas: `$$ … $$` beside the snippet, one line per branch that assigns the column.
    5. Steps as a numbered walk.
    6. Loading: `reload`, `append`, `upsert`, `historization`, `purge` or `orchestration`; none for a view or function.
    7. Error handling: TRY/CATCH, retry, locking.
    8. Evidence boundary, not an output item: do not add an item 8 heading, evidence-review section or ⚠️ line merely because this recipe lists this rule. Put filters, literals, defaults, time functions, predicate shapes and assignments under Rules, Formulas or Steps as factual behavior. A literal or default is not a defect without supplied schema or business evidence for a requirement it violates. Use ⚠️ only when the supplied SQL alone proves a specific row or value consequence, or supplied evidence proves a violated requirement; quote the deciding expression and that evidence. Never mention indexes, index use, seeks, scans, statistics, cardinality, plans, join strategies or runtime costs unless matching catalog, plan or runtime evidence was supplied; if the user requested an unavailable dimension, state once in factual prose that its evidence was not supplied.
  example: ""

# ── Structural callouts (active phase, bodied focus) ─────────────────────────
# One contract for the ⚠️ findings every capture angle may raise. Fires once per
# bodied hop beside whichever capture recipes the classification fires, so the
# rule is sent once under `both` instead of once per angle.

structural_callouts:
  stages: [active]
  instruction: |
    Apply the evidence boundary above to structural callouts too. A ⚠️ is optional and only for row or value loss, duplication, or overwrite that the supplied SQL itself proves. For a no-transaction failure window, require at least two ordered writes to persistent data: the first changes persistent state and a later persistent write is needed to complete the same operation. Temporary objects, variables, reads, calculations, and steps before a single persistent write do not create that failure window. State literals and defaults as facts unless supplied schema or business evidence proves an adverse effect.
  example: >
    ⚠️ Rows silently dropped — `WHERE o.BranchId = b.BranchId` on nullable
    `BranchId` in `vwLoans`: a loan with no branch never reaches `FactCircA`.

# ── Reduced capture for non-bodied starting points ───────────────────────────

structural_summary:
  stages: [active]
  instruction: >
    This focus has no SQL body, so each `sections` value follows this instead of the recipe: **Purpose**, the node's role from its id and type; **Upstream sources**, one line per `in[]` writer and its role; **Downstream consumers**, one line per `out[]` reader and its role. An empty list reads "none in the graph".

# ── Column Trace capture (active phase, CT mode only) ────────────────────────
# Fires additively alongside business_capture / technical_capture when the
# session has targetColumns set. Instructs the AI to fill out the column_flow
# JSON per hop. CT-mode-gated in templateRenderer.ts → CT_MODE_GATED.
# sections (semantic channel) should cover business/technical logic only —
# NOT re-state column flow; that belongs exclusively in column_flow.

column_trace_capture:
  stages: [active]
  instruction: |
    Resolve this hop's column tasks from the SQL and record the confirmed object/column relations in `column_flow`. Explain the full transformation sequence, including intermediate CTE renames, calculations, predicates and grain, in the shared `sections`. Continue through the same neighbor decisions as whole-object analysis; columns add precision, not a different graph. An empty upstream list states that the value originates here; unresolved mappings remain questions.

# Per-angle section assembly (business / technical / both) is governed by
# buildSynthesisPrompt() in src/ai/prompting/prompts.ts. No separate per-angle templates
# here — the lift+group+label rule is identical for both angles and lives in
# the synthesis cue to avoid duplication.

# ── Cross-section rendering at synthesis ─────────────────────────────────────
# Always-on at synthesis. Describes HOW captured content renders consistently
# across every section in the assembled document. Conditional triggers — each
# rule fires only when the captured slot bodies contain the underlying
# material; the AI does NOT invent tables / formulas / fences without source.

general:
  stages: [synthesis]
  instruction: |
    Render what the captured bodies contain, business meaning first; nothing is invented to fill a bullet:
    - **Column renames**: a `| From | To | Business meaning |` row per rename or derivation.
    - **Source guards**: short WHERE / JOIN / MERGE predicates, not whole statements.
    - **Status lifecycles**: numbered transitions.
    - **Callouts**: each captured ⚠️ sits once, in its section, as its own markdown list item (`- ⚠️ …`), never merged onto the same line as another callout; impact before mechanism in a business mission.
    - **Scope**: a side branch the question did not ask about is one line in the section it hangs off — never a section, a highlight, or a deletion. A column trace follows the traced column's value chain to its terminal sources.
  example: ""

# ── Big-picture ETL closing — TECHNICAL angle only ───────────────────────────
# Classification-gated to ['technical', 'both'] in templateRenderer.ts.
# Skips entirely on business-only missions because business framing names
# domain consequences, not load shapes.

loading_pattern:
  stages: [synthesis]
  instruction: >
    When every bodied procedure carried the same captured load shape, name it
    once — in `closing` if requested, else in the section covering the load —
    with what it means for consumers. Nothing when the shapes differ or none
    was captured.
  example: >
    Loading pattern: every bodied procedure in this chain uses TRUNCATE +
    INSERT — each run rebuilds `FactCircA` from scratch with no
    delta tracking. Downstream consumers must tolerate full-replace
    semantics; there is no incremental-load fallback.
