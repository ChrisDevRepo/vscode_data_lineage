# ──────────────────────────────────────────────────────────────────────────────
# AI Output Specification — what @lineage writes, and how.
#
# EDIT `instruction:` — it is the only text sent to the AI. In every block below:
#   instruction:  sent to the AI. Change this to change the output.
#   stages:       label only. Routing is decided in code; editing it does nothing.
#   sections:     business_capture / technical_capture only, optional: the ordered bold labels the recipe
#                 writes. Synthesis lists the active angle's labels where `general` says {{sections}}.
#   example:      sample for you to read. Never sent to the AI.
# Neither ignored field warns you. No `instruction:` changed = nothing changed.
#
# The three stages, and which blocks fire in each:
#
#   discovery   first chat reply, no exploration — bounded catalog and lineage
#               questions answered with the discovery read tools
#               → discovery_chat
#
#   active      per-hop analysis. Each fired audience recipe writes ONE section:
#               business → 1, technical → 1, both → 2 complementary strings.
#               → shared_capture once, business_capture, technical_capture, structural_callouts,
#                 structural_summary, column_trace_capture (column-trace hops only)
#
#   synthesis   final document. The AI writes these parts; the engine assembles,
#               numbers, and decorates them — do not template what the engine builds.
#               → summary, title, intro, closing, highlights, notes, general,
#                 loading_pattern (technical and both)
#
# Your own copy: set `dataLineageViz.ai.outputTemplateFile`. It merges over this
# file and your keys win — but only while its `schemaVersion` matches the one
# below. On a mismatch it is skipped with a warning in the Output channel; re-run
# "Data Lineage: Create AI Output Templates" and re-apply your edits.
#
# Per-key reference: docs/AI_PROMPTS.md
# ──────────────────────────────────────────────────────────────────────────────

schemaVersion: 2

# ── Discovery (chat-only) — editable via overlay ─────────────────────────────

discovery_chat:
  stages: [discovery]
  instruction: >
    Markdown; SQL in ```sql fences; levels as a table or nested list. Lead
    with the direct answer. When the answer is a set — every
    source, every consumer, every match — give the whole set, its count and
    how much was searched, from the tool totals. Then explain the flow: what
    each object contributes, with the transformations, column mappings,
    predicates, read/write roles, validation rules and risks the loaded SQL
    shows. Use canonical names; say what is unavailable rather than infer it.
    Keep tool names and payload fields out of the answer, and list raw nodes
    or edges only when asked.

# ── Card + top of the document ───────────────────────────────────────────────

summary:
  stages: [synthesis]
  instruction: >
    One line for the info card, ~120 chars: the subject of the analysis and
    where its data originates or lands.
  example: ""

title:
  stages: [synthesis]
  instruction: >
    Optional, ≤80 chars: "[Subject] — [key computation, pattern or finding]",
    ending on the final target object when applicable.
  example: ""

intro:
  stages: [synthesis]
  instruction: >
    2–4 sentences before the sections: lead with the direct answer
    (origin, key relationship, or requested finding), followed by
    architectural context.
  example: ""

# Section assembly (grouping, order and labels) is governed by buildSynthesisPrompt()
# in src/ai/prompting/prompts.ts — kept there to avoid duplication with the synthesis cue.
# This file documents only the parts the AI writes from scratch.

closing:
  stages: [synthesis]
  instruction: >
    One paragraph after the sections synthesizing the overall answer in the
    requested lens. For a business mission, state impact and scope, leaving
    mechanisms to the sections.
  example: ""

# `description` is engine output (built by orderAndAssemble in src/ai/tools/presentResult.ts
# from title + intro + sections[] + closing) — NOT an AI-writeable field.
# No instruction template here, by design.

# ── Graph-side decorations ───────────────────────────────────────────────────

highlights:
  stages: [synthesis]
  instruction: >
    Color landmark nodes relative to the question (not the full graph):
    data sources (filter-only lookups stay bare), targets, and value-altering
    transformations. Carry-through nodes stay uncolored. Legend labels (~40 chars)
    name the shared role.

notes:
  stages: [synthesis]
  instruction: >
    One caption per linked node, one line (~120 chars): its role in this flow;
    keep SQL and formulas in the section body. In a column trace, name the
    traced column and any rename.
  example: "Aggregates monthly invoices"

# ── Per-hop capture (active phase) ───────────────────────────────────────────
# Each fired audience recipe produces ONE `sections` key for its angle.
# Under classification `both` both recipes fire (two keys); a single-angle
# lock fires one recipe (one key). Shape: { business?: string, technical?: string }. Shared coverage is composed
# once with the selected audience recipe(s); both uses business as the primary explanation
# and technical for additional implementation details.
# Synthesis groups across nodes at the next phase.

# `sections` lists the bold labels this recipe writes, in order. Synthesis serves the labels of the active
# angle(s) in `general` (Section structure), so a label is declared here once and nowhere else.
shared_capture:
  stages: [active]
  instruction: |
    Shared capture coverage. Put all analysis in `sections`; text outside the tool call is discarded. Put every applicable item:
    1. Purpose: the node's role in the data flow.
    2. Rules and branches: each declared value of a mode, status or strategy switch and what it changes; a commented-out branch is declared, not active.
    3. Grain: distinguish input rows from surviving rows at each cardinality-changing step. For grouping or ranked-row removal, derive survivors per grouping or partition key from retained count or rank. Quote the deciding SQL.
    4. Column mapping: `| From | To | Business meaning |`.
    5. Steps: a numbered walk of statements, calculations and status transitions in order; naming a computation without explaining it leaves the section incomplete.
    6. Loading: whether target rows are replaced, extended or removed.
    7. Error handling: what a failure leaves in the rows.
    8. Gaps: material unresolved evidence.
  example: ""

business_capture:
  stages: [active]
  sections: [Purpose, Transformations, Grain, Operations]
  instruction: |
    Domain impact on data meaning.
    Explain the domain role, supported decisions, and business definitions and consequences of calculations. For conditional eligibility, evaluate complete predicates with defaults and overrides separately.

    <scope_relevance>
    An execution-logging sink (recording procedure runs, timestamps, or status) is a sidecar: mention in one line within the parent section, never as an independent section or highlight. A sink storing historical or as-of values of the traced column is an audit consumer with a one-line caption.
    </scope_relevance>
  example: ""

technical_capture:
  stages: [active]
  sections: [Purpose, Transformations, Grain, Operations]
  instruction: |
    Execution mechanics and surviving rows.
    Explain execution roles, JOIN/WHERE predicates, join hints, loading mechanics (`reload`, `append`, `upsert`, `purge`), TRY/CATCH, and locking. Do not invent physical access or execution steps from SQL syntax: describe a join hint as a requested strategy, not an observed operator; without an execution plan, do not label a step scan, seek, hash build, or probe.
  example: ""

# ── Structural callouts (active phase, bodied focus) ─────────────────────────
# One contract for the ⚠️ findings every capture angle may raise. Fires once per
# bodied hop beside whichever capture recipes the classification fires, so the
# rule is sent once under `both` instead of once per angle.

structural_callouts:
  stages: [active]
  instruction: |
    Consider question-relevant SQL comments, verify their claims against SQL and metadata, and flag contradictions in a callout. Other ⚠️ findings are optional: use them only when the supplied SQL proves specific row or value loss, duplication or overwrite, or supplied schema or business evidence proves a violated requirement. Quote the deciding expression and any evidence of the requirement. For a no-transaction failure window, require at least two ordered writes to persistent data: the first changes persistent state and a later persistent write is needed to complete the same operation. Temporary objects, variables, reads, calculations, and steps before a single persistent write do not create that failure window. State filters, literals, defaults, join hints, grouping and row grain as SQL facts unless supplied evidence proves an adverse effect. Claims about index presence or use, actual seeks or scans, statistics, estimated or observed row counts, execution plans, chosen physical join strategies or runtime costs require matching catalog, plan or runtime evidence; SQL hints alone do not establish what the engine executed or its performance. Do not create a callout merely because evidence for a requested dimension is unavailable; state its absence once in factual prose.
  example: >
    ⚠️ Rows silently dropped — `WHERE o.BranchId = b.BranchId` on nullable
    `BranchId` in `vwLoans`: a loan with no branch never reaches `FactCircA`.

# ── Reduced capture for a non-bodied focus (table or external object) ────────

structural_summary:
  stages: [active]
  instruction: >
    Non-bodied focus; each `sections` value follows this structure: **Purpose**,
    the node's role from its id and type; **Upstream sources**, one line per `in[]`
    writer and its role; **Downstream consumers**, one line per `out[]` reader
    and its role. State "none in the graph" for empty lists.

# ── Column Trace capture (active phase, CT mode only) ────────────────────────
# Fires additively alongside business_capture / technical_capture on a hop that
# carries column tasks; a hop without them, even in a column trace, gets none.
# Instructs the AI to fill out the column_flow JSON per hop. CT-mode-gated in
# templateRenderer.ts → CT_MODE_GATED.
# The shared captures handle SQL semantics; this adds column-flow evidence.

column_trace_capture:
  stages: [active]
  instruction: |
    Resolve this hop's column tasks from the SQL and record the confirmed object/column relations in `column_flow`. Follow each traced value through the complete statement; columns only copied alongside it are not mapped. Keep unresolved source evidence explicit in eligible questions. When writing `sections`, explain the full transformation sequence (intermediate CTE renames, calculations, predicates, grain), dataset effects, and unresolved source evidence.

# ── Cross-section rendering at synthesis ─────────────────────────────────────
# Always-on at synthesis. Describes HOW captured content renders consistently
# across every section in the assembled document. Conditional triggers — each
# rule fires only when the captured slot bodies contain the underlying
# material; the AI does NOT invent tables / formulas / fences without source.

# `{{sections}}` is replaced by the `sections` labels of the active angle(s): business, technical, or both (ordered union).
# An instruction without the placeholder is sent as written.
general:
  stages: [synthesis]
  instruction: |
    Render captured content without inventing ungrounded details, prioritizing business meaning:
    - **Section structure**: use only these bold labels, in this order when applicable: {{sections}}. Embed formulas directly within relevant transformations (on separate lines with explanations or in a concise table). Do not create a separate Formulas subsection. Place lifecycle transitions and defaults under Transformations. Business covers domain impact; technical covers execution mechanics; both unifies shared facts once. Omit empty/inapplicable labels and boilerplate lists of absent mechanisms. Note material unresolved gaps factually.
    - **Numbered walks** (under Transformations): markdown numbered list, one step per line. Place tables and SQL fences on separate lines with surrounding blank lines; restrict SQL to deciding expressions, referencing captured witnesses when available.
    - **Column renames**: table `| From | To | Business meaning |` for renames or derivations only when not already provided by the backend inventory (backend ownership takes precedence).
    - **Source guards**: concise WHERE / JOIN / MERGE predicates, not complete statements.
    - **Status lifecycles**: numbered state transitions.
    - **Callouts**: each captured ⚠️ appears once within its section as an independent bullet (`- ⚠️ …`), never merged; lead with impact before mechanism in business missions.
    - **Scope**: unrequested side branches appear as a single line within their parent section (never independent sections, highlights, or deletions). Column traces trace the value chain within approved scope, distinguishing terminal sources from scope boundaries.
  example: ""

# ── Big-picture ETL closing — TECHNICAL angle only ───────────────────────────
# Classification-gated to ['technical', 'both'] in templateRenderer.ts.
# Skips entirely on business-only missions because business framing names
# domain consequences, not load shapes.

loading_pattern:
  stages: [synthesis]
  instruction: >
    When all bodied procedures share an identical captured load shape, state it
    once (in `closing` if requested, otherwise within the section covering the load)
    along with consumer impact. Omit when shapes differ or none was captured.
  example: >
    Loading pattern: every bodied procedure in this chain uses TRUNCATE +
    INSERT — each run rebuilds `FactCircA` from scratch with no
    delta tracking. Downstream consumers must tolerate full-replace
    semantics; there is no incremental-load fallback.
